base_firewall_role: services

# The tag the services host's one-off auth key carries; the tailnet policy
# grants by it.
base_tailscale_tag: tag:svc

# A faithful copy of Docker/FreshRSS.Apache.conf at the pinned tag, with
# Listen 80 changed to Listen 8080 and the tailnet's ranges added to
# RemoteIPInternalProxy, as below. Re-diff it against the
# image on every Renovate bump; a drifted copy is a silent behaviour change.
#
# The file is vendored because a non-root container uid cannot bind port 80 -
# measured on svc1, a rootless container netns reports
# ip_unprivileged_port_start=1024 - and the image's LISTEN variable is applied
# with sed -i against this very file, which fails on a read-only rootfs with no
# set -e to notice.
#
# Kept faithful rather than minimised. The OIDC block can never fire because
# OIDC_ENABLED is never defined, the piped CustomLog duplicates what the edge
# already records, and RemoteIPInternalProxy trusts three whole private ranges
# where one host would do. All three are accepted so that diffing this against
# a new release stays trivial. The one addition is the tailnet's two ranges on
# RemoteIPInternalProxy, because the edge now arrives over the tailnet; the
# record's upstream edits carry the same line.
freshrss_apache_conf: |
  ServerName freshrss.localhost
  Listen 8080
  DocumentRoot /var/www/FreshRSS/p/
  AllowEncodedSlashes On
  ServerTokens OS
  TraceEnable Off
  ErrorLog /dev/stderr

  # For logging the original user-agent IP instead of proxy IPs:
  <IfModule mod_remoteip.c>
  	# Can be disabled by setting the TRUSTED_PROXY environment variable to 0:
  	RemoteIPHeader X-Forwarded-For
  	# Can be overridden by the TRUSTED_PROXY environment variable:
  	RemoteIPInternalProxy 10.0.0.1/8 172.16.0.1/12 192.168.0.1/16 100.64.0.0/10 fd7a:115c:a1e0::/48
  </IfModule>

  # Default, will be overridden by p/.htaccess and p/api/.htaccess
  SetEnvIfExpr "reqenv('LOG_REMOTE_USER') == ''" LOG_REMOTE_USER=-
  SetEnvIfExpr "reqenv('LOG_REMOTE_USER') == '-' && reqenv('REMOTE_USER') =~ /(.+)/" LOG_REMOTE_USER=$1

  LogFormat "%a %l %{LOG_REMOTE_USER}e %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined_proxy
  CustomLog "|/var/www/FreshRSS/cli/sensitive-log.sh" combined_proxy

  <IfDefine OIDC_ENABLED>
  	<IfModule !auth_openidc_module>
  		Error "The auth_openidc_module is not available. Install it or unset environment variable OIDC_ENABLED."
  	</IfModule>

  	# Workaround to be able to check whether an environment variable is set
  	# See: https://serverfault.com/questions/1022233/using-ifdefine-with-environment-variables/1022234#1022234
  	Define VStart "${"
  	Define VEnd "}"

  	OIDCProviderMetadataURL ${OIDC_PROVIDER_METADATA_URL}
  	OIDCClientID ${OIDC_CLIENT_ID}
  	OIDCClientSecret ${OIDC_CLIENT_SECRET}

  	OIDCSessionInactivityTimeout ${OIDC_SESSION_INACTIVITY_TIMEOUT}
  	OIDCSessionMaxDuration ${OIDC_SESSION_MAX_DURATION}
  	OIDCSessionType ${OIDC_SESSION_TYPE}

  	OIDCRedirectURI /i/oidc/
  	OIDCDefaultURL ${OIDC_DEFAULT_URL}
  	OIDCCryptoPassphrase ${OIDC_CLIENT_CRYPTO_KEY}

  	Define "Test_${OIDC_REMOTE_USER_CLAIM}"
  	<IfDefine Test_${VStart}OIDC_REMOTE_USER_CLAIM${VEnd}>
  		OIDCRemoteUserClaim preferred_username
  	</IfDefine>
  	<IfDefine !Test_${VStart}OIDC_REMOTE_USER_CLAIM${VEnd}>
  		OIDCRemoteUserClaim "${OIDC_REMOTE_USER_CLAIM}"
  	</IfDefine>
  	Define "Test_${OIDC_SCOPES}"
  	<IfDefine Test_${VStart}OIDC_SCOPES${VEnd}>
  		OIDCScope openid
  	</IfDefine>
  	<IfDefine !Test_${VStart}OIDC_SCOPES${VEnd}>
  		OIDCScope "${OIDC_SCOPES}"
  	</IfDefine>
  	Define "Test_${OIDC_X_FORWARDED_HEADERS}"
  	<IfDefine !Test_${VStart}OIDC_X_FORWARDED_HEADERS${VEnd}>
  		OIDCXForwardedHeaders ${OIDC_X_FORWARDED_HEADERS}
  	</IfDefine>

  	# Additional parameters can be set e.g. in /var/www/FreshRSS/p/i/.htaccess
  </IfDefine>

  <Directory />
  	AllowOverride None
  	Options FollowSymLinks
  	Require all denied
  </Directory>

  <Directory /var/www/FreshRSS/p>
  	AllowOverride None
  	Include /var/www/FreshRSS/p/.htaccess
  	Options FollowSymLinks
  	Require all granted
  </Directory>

  <Directory /var/www/FreshRSS/p/api>
  	Include /var/www/FreshRSS/p/api/.htaccess
  </Directory>

  <Directory /var/www/FreshRSS/p/i>
  	ExpiresActive Off

  	<IfDefine OIDC_ENABLED>
  		AuthType openid-connect
  		Require valid-user
  	</IfDefine>
  	IncludeOptional /var/www/FreshRSS/p/i/.htaccess
  </Directory>

  <Directory /var/www/FreshRSS/p/themes>
  	Include /var/www/FreshRSS/p/themes/.htaccess
  </Directory>

# A faithful copy of the image's logconf.prod.json at the pinned tag
# (mealie/core/logger/), loaded through LOG_CONFIG_OVERRIDE, with two lines
# changed, as the record's upstream edits say:
# - the file handler writes to /dev/null, not ${DATA_DIR}/mealie.log, so no
#   log lands in the backed-up volume. Python never rotates a file that is
#   not a regular one;
# - uvicorn.access goes to the stderr handler, which passes WARNING and
#   above, instead of the access handler on stdout. Every access line is
#   INFO, so the journal gets none of them: their URLs carry the iCal,
#   share, reset, invite and download tokens. Caddy's access log, filtered,
#   is the one kept.
# Whole-line edits that each match one line: the level lines are identical
# across handlers and loggers, so the logger's handler is changed instead.
# The drift check fails a bump whose file differs, and the path names
# python3.14, so a Python bump in the image fails it too.
mealie_log_config: |
  {
    "version": 1,
    "disable_existing_loggers": false,
    "formatters": {
      "simple": {
        "format": "%(levelname)-8s %(asctime)s - %(message)s",
        "datefmt": "%Y-%m-%dT%H:%M:%S"
      },
      "detailed": {
        "format": "[%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s",
        "datefmt": "%Y-%m-%dT%H:%M:%S"
      },
      "access": {
        "()": "uvicorn.logging.AccessFormatter",
        "fmt": "%(levelname)-8s %(asctime)s - [%(client_addr)s] %(status_code)s \"%(request_line)s\"",
        "datefmt": "%Y-%m-%dT%H:%M:%S"
      }
    },
    "handlers": {
      "stderr": {
        "class": "logging.StreamHandler",
        "level": "WARNING",
        "formatter": "simple",
        "stream": "ext://sys.stderr"
      },
      "stdout": {
        "class": "logging.StreamHandler",
        "level": "${LOG_LEVEL}",
        "formatter": "simple",
        "stream": "ext://sys.stdout"
      },
      "access": {
        "class": "logging.StreamHandler",
        "level": "${LOG_LEVEL}",
        "formatter": "access",
        "stream": "ext://sys.stdout"
      },
      "file": {
        "class": "logging.handlers.RotatingFileHandler",
        "level": "DEBUG",
        "formatter": "detailed",
        "filename": "/dev/null",
        "maxBytes": 10000000,
        "backupCount": 3
      }
    },
    "loggers": {
      "root": {
        "level": "${LOG_LEVEL}",
        "handlers": [
          "stderr",
          "file",
          "stdout"
        ]
      },
      "uvicorn.error": {
        "handlers": [
          "stderr",
          "file",
          "stdout"
        ],
        "level": "${LOG_LEVEL}",
        "propagate": false
      },
      "uvicorn.access": {
        "handlers": [
          "stderr",
          "file"
        ],
        "level": "${LOG_LEVEL}",
        "propagate": false
      }
    }
  }

# Hosts Mealie's scraper may fetch although they resolve to a private
# address (HTTP_ALLOW_LIST, comma-separated). Empty here. The CI lab names
# its fixture front, in a documentation range Python counts as private
# (ci/inventory/group_vars/services/overrides.yml).
mealie_http_allow_list: ""

# Syncthing's config.xml, written into its state volume by the record's seed
# before the first start, and only while none is there. On its own defaults
# Syncthing's first start turns on global discovery, relays and NAT
# traversal and announces the host to public servers, so on a first deploy
# this is written before Syncthing can start. After that Syncthing owns the
# file: devices, folders and any change made in the GUI stay, and a restored
# volume keeps its own copy.
#
# Rendered only when the seed is written (the seed names this variable), so
# the hash and the key below are made then and live only in the volume and
# its backups.
# - The login: Syncthing compares this password with bcrypt and never hashes
#   what it finds here itself, so Ansible hashes it, at cost 10, Syncthing's
#   own. bcrypt uses at most 72 bytes of a password, so a longer one is
#   refused rather than silently cut short. A placeholder, a username that is
#   not plain or a password of the wrong length writes nothing and fails the
#   pull, naming the rule.
# - The API key: 32 random letters and digits, in no other place. Without
#   one Syncthing makes a new key in memory at every start. The alert job
#   reads it from this file.
# - Every outbound feature is off: discovery, local announcements, relays
#   and NAT traversal (natEnabled also turns off STUN), usage and crash
#   reports, upgrades. One TCP listener, for devices that dial in.
# - No free-space floors: Syncthing's defaults stay, for the home and for
#   each folder.
# - New folders default to the trash can for 30 days, cleaned hourly. A new
#   device is neither an introducer nor auto-accepts folders, both
#   Syncthing's defaults, stated here.
syncthing_seed_config: |
  <configuration version="52">
      <gui enabled="true" tls="false">
          <address>0.0.0.0:8384</address>
          <user>{{ undef(hint='syncthing_gui_user is still the CHANGE-ME placeholder')
                   if (syncthing_gui_user | string) == 'CHANGE-ME'
                   else syncthing_gui_user
                   if (syncthing_gui_user | string) is regex('[A-Za-z0-9._@-]{1,64}', match_type='fullmatch')
                   else undef(hint='syncthing_gui_user is not 1 to 64 letters, digits, dots, @, hyphens or underscores') }}</user>
          <password>{{ undef(hint='syncthing_gui_password is still the CHANGE-ME placeholder')
                       if (syncthing_gui_password | string) == 'CHANGE-ME'
                       else (syncthing_gui_password | string) | password_hash('bcrypt', rounds=10)
                       if ((syncthing_gui_password | string).encode('utf-8') | length) in range(1, 73)
                       else undef(hint='syncthing_gui_password is not 1 to 72 bytes') }}</password>
          <apikey>{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}</apikey>
      </gui>
      <options>
          <listenAddress>tcp://0.0.0.0:22000</listenAddress>
          <globalAnnounceEnabled>false</globalAnnounceEnabled>
          <localAnnounceEnabled>false</localAnnounceEnabled>
          <relaysEnabled>false</relaysEnabled>
          <natEnabled>false</natEnabled>
          <urAccepted>-1</urAccepted>
          <crashReportingEnabled>false</crashReportingEnabled>
          <autoUpgradeIntervalH>0</autoUpgradeIntervalH>
          <startBrowser>false</startBrowser>
          <announceLANAddresses>false</announceLANAddresses>
      </options>
      <defaults>
          <folder path="/var/syncthing/data/folders">
              <versioning type="trashcan">
                  <cleanupIntervalS>3600</cleanupIntervalS>
                  <param key="cleanoutDays" val="30"></param>
              </versioning>
          </folder>
          <device introducer="false">
              <autoAcceptFolders>false</autoAcceptFolders>
          </device>
      </defaults>
  </configuration>

# Syncthing's daily alert, run by the record's alert job in Syncthing's own
# network namespace: a folder in error or with failed items, or an error in
# Syncthing's log since its start, exits 1, which pages (docs/runbook.md,
# Syncthing). It is the repository's one runtime alert script. It lives in a
# .sh file of its own, so that `just ci` lints it with ShellCheck as any
# other script; read whole, its final newline kept. playbook_dir/.. is the
# checkout's root for site.yml and the CI lab's playbooks alike.
syncthing_alert_script: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../inventory/files/syncthing-alert.sh', rstrip=false) }}"

# dufs's accounts, delivered as its DUFS_AUTH secret (the dufs record). Two
# rules and no anonymous one: the operator's account reads and writes
# everywhere, reader reads everywhere, and dufs itself answers 401 to any
# request without valid credentials, apart from its health URL, OPTIONS and
# its own UI files, which it serves before the account check and which hold
# nothing from the volume. So a mistake in the edge's Caddy still leaves an
# anonymous client nothing. The accounts never go in a dufs config file: one
# with rules but no auth key leaves dufs writable by anyone.
# - The operator's password is hashed here, sha-512 crypt at 5,000 rounds, so
#   dufs's environment holds no plaintext copy of it. Ansible derives the
#   salt from the password itself: the first 16 characters of its SHA-256 hex
#   digest, of which the hosts' crypt library encodes the first 12 as the
#   hash's salt. So the hash, and DUFS_AUTH with it, is the same on every run
#   and a pull restarts nothing. That salt is a fast fingerprint of the
#   password, carried in the hash; it is harmless only because the password
#   is at least 32 random letters and digits, which no search reaches.
# - reader is the account the edge's Caddy sends for every visitor to the
#   public name. Plaintext, so dufs computes no hash for each visitor's
#   request; read-only, which the reader-write-refused check proves at every
#   start.
# - A placeholder, a username that is not plain or is reader, or a password
#   that is not at least 32 letters and digits fails the pull before any
#   service's secret, unit or volume is written, naming the rule and never
#   the value; the base play's firewall lines for dufs come first. The rules
#   also keep out '@/' in a password and ':' in the username, which would
#   break dufs's rule syntax. Only the length and the alphabet are checked:
#   generate both passwords at random.
dufs_auth: >-
  {{ (undef(hint='dufs_upload_user is still the CHANGE-ME placeholder')
      if (dufs_upload_user | string) == 'CHANGE-ME'
      else undef(hint='dufs_upload_user may not be reader, the read-only account')
      if (dufs_upload_user | string) == 'reader'
      else dufs_upload_user
      if (dufs_upload_user | string) is regex('[A-Za-z0-9._-]{1,64}', match_type='fullmatch')
      else undef(hint='dufs_upload_user is not 1 to 64 letters, digits, dots, hyphens or underscores'))
     ~ ':' ~
     (undef(hint='dufs_upload_password is still the CHANGE-ME placeholder')
      if (dufs_upload_password | string) == 'CHANGE-ME'
      else (dufs_upload_password | string)
           | password_hash('sha512', salt=((dufs_upload_password | string) | hash('sha256'))[:16], rounds=5000)
      if (dufs_upload_password | string) is regex('[A-Za-z0-9]{32,}', match_type='fullmatch')
      else undef(hint='dufs_upload_password is not at least 32 letters and digits'))
     ~ '@/:rw|reader:' ~
     (undef(hint='dufs_reader_password is still the CHANGE-ME placeholder')
      if (dufs_reader_password | string) == 'CHANGE-ME'
      else dufs_reader_password
      if (dufs_reader_password | string) is regex('[A-Za-z0-9]{32,}', match_type='fullmatch')
      else undef(hint='dufs_reader_password is not at least 32 letters and digits'))
     ~ '@/' }}

# The DNS forwarder's uid on this host (podman_hosts/main.yml).
deerlab_dnsdist_uid: 2008

podman_services:
  dnsdist: "{{ deerlab_dnsdist_service }}"
  wallabag:
    uid: 2001
    # The image runs as root inside and rewrites its application tree on
    # every start, so it cannot be read-only.
    image: docker.io/wallabag/wallabag:2.6.19@sha256:957dd984804462367132482c37d7bd1512cabe8a9503ec22e06efddc2872942b
    publish:
      - "8080:80"
    volumes:
      - { name: data, mount: /var/www/wallabag/data }
      - { name: images, mount: /var/www/wallabag/web/assets/images }
    tmpfs:
      - "/tmp:rw,nosuid,nodev,noexec,size=64m"
      - "/run:rw,nosuid,nodev,size=16m"
    env:
      SYMFONY__ENV__DOMAIN_NAME: "https://wallabag.{{ deerlab_domain }}"
      SYMFONY__ENV__SERVER_NAME: wallabag
      SYMFONY__ENV__FOSUSER_REGISTRATION: "false"
      SYMFONY__ENV__DATABASE_DRIVER: pdo_sqlite
      POPULATE_DATABASE: "True"
      PHP_MEMORY_LIMIT: 256M
      TZ: Etc/UTC
    secrets:
      - { name: symfony-secret, value: "{{ wallabag_symfony_secret }}", type: env, target: SYMFONY__ENV__SECRET }
    # Trimmed empirically, one capability at a time, then reproved against a
    # volume destroyed and recreated from empty. Each of the five below made
    # the unit fail to start when removed:
    # CAP_CHOWN: nginx failed to chown its own tmp directory inside the
    #   container's writable layer (not a mounted volume, so this is rebuilt
    #   on every start regardless of volume state) with "Operation not
    #   permitted".
    # CAP_SETUID / CAP_SETGID: the entrypoint's `su` to the application user
    #   failed with "Operation not permitted" before the application started.
    # CAP_NET_BIND_SERVICE: nginx could not bind() the low port it publishes;
    #   failed with "Permission denied".
    # CAP_DAC_OVERRIDE: the entrypoint could not write its config file;
    #   failed with "Permission denied".
    # CAP_FOWNER was removed: the health check, the login page and a fresh
    # deployment against an empty volume all passed without it.
    capabilities:
      - CAP_CHOWN
      - CAP_SETUID
      - CAP_SETGID
      - CAP_NET_BIND_SERVICE
      - CAP_DAC_OVERRIDE
    read_only: false
    no_new_privileges: true
    health:
      cmd: curl --fail --silent --output /dev/null http://localhost/login
      interval: 30s
      start_period: 180s
    # What a pull proves once wallabag has started; none of it logs in.
    # database asks for a client that does not exist: invalid_client, not an
    # error page, proves the database answers. Fields: podman_service_verify.
    checks:
      - name: api-info
        path: /api/info
        body_regex: '"allowed_registration":\s*false'
        body_version: true
      # The underscore makes the bogus id a lookup rather than a malformed one.
      - name: database
        method: POST
        path: /oauth/v2/token
        body_format: form-urlencoded
        body: { grant_type: client_credentials, client_id: 0_deerlabcheck, client_secret: x }
        status: [400]
        body_regex: '"error":\s*"invalid_client"'
      - name: login-page
        path: /login
        body_regex: 'name="_csrf_token"'
      # Its lookups reach the operator's DNS resolver under its own name: the
      # resolver's test endpoint answers with the name of the device that
      # looked it up, and only to a curl User-Agent. The body also holds the
      # resolver's profile and the host's address, which no_log keeps out.
      # The URL authenticates nothing: it is in SOPS only because it names
      # the provider, so it may sit in cmd.
      - name: dns-name
        type: exec
        where: host
        timeout: 10
        cmd: [curl, --fail, --silent, --location, --max-time, "8", "{{ deerlab_dns_test_url }}"]
        stdout_regex: '"deviceName":\s*"wallabag"'
    egress: web
    backup:
      sqlite: [{ volume: data, path: db/wallabag.sqlite }]
      volumes: [data, images]

  linkding:
    uid: 2002
    image: ghcr.io/sissbruecker/linkding:1.47.0-plus@sha256:1ba3d9ebb8be8944f771acd9bdf75d3a5d192e1fca779fe005a02fe2b798958a
    # The image drops privilege internally: uwsgi.ini carries uid = www-data,
    # which is 33 in the Debian image, and bootstrap.sh chowns the data
    # directory to it. Starting as 33 makes that chown a permitted same-owner
    # no-op and skips the privilege drop entirely, so nothing here needs CHOWN,
    # DAC_OVERRIDE, SETUID or SETGID. Starting as root would need all four and
    # a writable root filesystem besides.
    user: 33
    group: 33
    publish:
      - "8081:9090"
    volumes:
      # chown renders :U. The image ships data/tasks.sqlite3 owned root:root, so
      # Podman's copy-up into a fresh volume lands root-owned and a uid-33
      # container then fails with "mkdir: cannot create directory
      # 'data/favicons': Permission denied". :U also self-heals after a volume
      # is deleted and recreated, which is what a restore does.
      - { name: data, mount: /etc/linkding/data, chown: true }
    tmpfs:
      # uwsgi.ini writes /tmp/linkding.pid and there is no writable path
      # anywhere else with a read-only root, so the container exits 1 without
      # this: "No usable temporary directory found".
      #
      # mode, never uid/gid. Podman 5.4.2 rejects those two outright - the
      # container exits 125 with `unknown mount option "uid=33": invalid mount
      # option` before the image is even started. A tmpfs is created root-owned
      # and Podman offers no way to chown it, so mode is the only lever. 1777
      # is also Podman's own default here, confirmed on the host; setting it
      # explicitly says the container's uid must be able to write rather than
      # resting on a default.
      - "/tmp:rw,nosuid,nodev,size=256m,mode=1777"
    env:
      # LD_DISABLE_BACKGROUND_TASKS is deliberately ABSENT and must stay absent.
      # It reads as "do not start supervisord", which is what we want here, but
      # it also gates task ENQUEUEING in whichever process evaluates it. Setting
      # it would stop this container queueing any favicon, preview, metadata or
      # snapshot work, and the worker would consume an empty queue forever.
      # LD_SUPERVISOR_MANAGED must stay absent too: on that path bootstrap.sh
      # execs supervisord, so its failure kills the container instead of being
      # ignored.
      #
      # Consequence: this container logs "Error: Can't drop privilege as nonroot
      # user" once per start, because bootstrap.sh tries to launch supervisord
      # and supervisord refuses to run as non-root. It has no set -e and does
      # not check the exit status, so it proceeds to exec uwsgi and everything
      # works. The worker unit is what actually drains the queue.
      #
      # linkding sets no SECURE_PROXY_SSL_HEADER anywhere, so request.is_secure()
      # is always false behind Caddy. This, not proto forwarding, is what stops
      # a POST failing with "CSRF verification failed". The scheme is required.
      LD_CSRF_TRUSTED_ORIGINS: "https://linkding.{{ deerlab_domain }}"
      # The default provider is a Google gstatic endpoint, which would tell
      # Google the domain of every bookmark from this host's address as it is
      # saved.
      LD_FAVICON_PROVIDER: "https://icons.duckduckgo.com/ip3/{domain}.ico"
      LD_ENABLE_SNAPSHOTS: "True"
      LD_SUPERUSER_NAME: "{{ linkding_superuser_name }}"
      TZ: Etc/UTC
    secrets:
      # Create-only: once the user exists linkding logs "Skip creating initial
      # superuser" and will NOT reset the password. Changing this value and
      # promoting appears to succeed and changes nothing; a real password change
      # goes through the UI or manage.py changepassword.
      - { name: superuser-password, value: "{{ linkding_superuser_password }}", type: env, target: LD_SUPERUSER_PASSWORD }
    capabilities: []
    read_only: true
    no_new_privileges: true
    health:
      # /health calls connections["default"].ensure_connection(), so it proves
      # the database is reachable rather than just that a socket is open.
      # /login is a 301 to /login/ and proves nothing.
      cmd: curl --fail --silent --output /dev/null http://localhost:9090/health
      interval: 30s
      start_period: 120s
    # What a pull proves once linkding has started; none of it logs in.
    # api-token makes the API read its token table for a token that does not
    # exist. snapshot runs the worker's single-file and Chromium under its
    # real confinement, on a page that needs no network: the worker's own
    # loopback is not the web container's, and its egress class refuses
    # private addresses beyond that. About one Chromium start in five stalls
    # until single-file's timeout, in the CI lab and on svc1 alike, and the
    # next start succeeds, as linkding's own retry of a failed snapshot does.
    # So the check makes up to four tries of 20 s, each with a fresh profile
    # of its own: on the worker's shared one, a stalled try held the next.
    checks:
      - name: health
        path: /health
        body_regex: '"status":\s*"healthy"'
        body_version: true
      - name: shared-feed
        path: /feeds/shared
        query: { limit: "1" }
        body_regex: <title>Public shared bookmarks</title>
      - name: api-token
        path: /api/bookmarks/
        headers: { Authorization: Token deerlab-invalid }
        status: [401]
        body_regex: Invalid token
      - name: snapshot
        type: exec
        container: worker
        timeout: 90
        cmd:
          - python
          - manage.py
          - shell
          - -c
          - |
            import shutil, tempfile
            from django.conf import settings
            from bookmarks.services import singlefile
            settings.LD_SINGLEFILE_TIMEOUT_SEC = 20
            options = settings.LD_SINGLEFILE_OPTIONS
            for attempt in range(4):
                profile = tempfile.mkdtemp(prefix="deerlab-check-")
                settings.LD_SINGLEFILE_OPTIONS = options + " --browser-arg=--user-data-dir=" + profile
                try:
                    singlefile.create_snapshot("file:///etc/hostname", "/tmp/deerlab-check.html")
                except singlefile.SingleFileError:
                    continue
                finally:
                    shutil.rmtree(profile, ignore_errors=True)
                print("snapshot ok")
                break
        stdout_regex: snapshot ok
      # Its lookups reach the resolver under its own name (as wallabag's).
      - name: dns-name
        type: exec
        where: host
        timeout: 10
        cmd: [curl, --fail, --silent, --location, --max-time, "8", "{{ deerlab_dns_test_url }}"]
        stdout_regex: '"deviceName":\s*"linkding"'
    egress: web
    backup:
      sqlite: [{ volume: data, path: db.sqlite3 }]
      volumes: [data]
    workloads:
      worker:
        kind: worker
        # Huey's consumer, run directly rather than under supervisord.
        # supervisord cannot run here at all: both its configs declare
        # [supervisord] user=root and it refuses to start when it cannot drop
        # privilege. This is the command its own config would have run.
        exec: python manage.py run_huey -f
        env:
          # manage.py defaults to bookmarks.settings, whose __init__ tries dev
          # and falls back to prod. uwsgi.ini sets this explicitly rather than
          # relying on that fallback, so this does too.
          DJANGO_SETTINGS_MODULE: bookmarks.settings.prod
          # supervisord set HOME=/tmp/home for Chromium and nothing ever created
          # the directory. We do not run supervisord, so set it somewhere that
          # exists.
          HOME: /tmp
        tmpfs:
          - "/tmp:rw,nosuid,nodev,size=1g,mode=1777"
          # single-file-cli passes --user-data-dir=./chromium-profile, relative
          # to WORKDIR /etc/linkding, which is read-only. The directory exists
          # in the image owned by www-data; this makes it writable without
          # touching the image.
          - "/etc/linkding/chromium-profile:rw,nosuid,nodev,size=256m,mode=1777"

  baikal:
    uid: 2003
    image: ghcr.io/divbast/baikal:0.13.0@sha256:bf065fc04b9c775468db9fa5074c73a31220a69dd73f2f9a774715ac41261537
    # Pinned rather than inherited from the image's own USER, so an image that
    # changed it fails to start instead of silently re-chowning the volume.
    user: 65532
    group: 65532
    # 8081 is the image's health listener and is deliberately NOT published:
    # a published port answers on the wildcard address, so publishing it
    # would open it to the tailnet.
    publish:
      - "8082:8080"
    volumes:
      - { name: data, mount: /data, chown: true }
    tmpfs:
      # The image's own size. Its Caddy refuses a request body over 64 MB,
      # and PHP spools a body to /tmp at about twice its size, so this holds
      # four of the largest at once; at 64m one over about 30 MB failed with a
      # write error instead of a 413. A tmpfs takes memory only as it fills,
      # and counts against the container's limit in limits.yml.
      - "/tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777"
    env:
      # An input to every password hash Baikal ever writes. Changing it after
      # the first run invalidates the admin password and every DAV user's
      # credentials at once, with no error.
      BAIKAL_AUTH_REALM: BaikalDAV
      BAIKAL_DAV_AUTH_TYPE: Basic
      BAIKAL_TIMEZONE: Etc/UTC
      TZ: Etc/UTC
    secrets:
      # Create-only: once the config file exists the image never rewrites it,
      # so changing this and promoting appears to succeed and changes nothing.
      # A real password change goes through the admin UI.
      - { name: admin-password, value: "{{ baikal_admin_password }}", type: env, target: BAIKAL_ADMIN_PASSWORD }
    capabilities: []
    read_only: true
    no_new_privileges: true
    health:
      # A JSON array, not a plain string: Podman runs a plain string through
      # /bin/sh -c and this image has no shell. Simplifying this to a bare
      # command makes the probe fail forever, and Notify=healthy then holds the
      # unit in `activating` rather than failing it.
      #
      # No leading "CMD" element, and that is load-bearing rather than a
      # shorthand. Podman before 5.8.0 - svc1 runs 5.4.2 - discards the parsed
      # array when its first element is the literal "CMD" and re-splits the raw
      # string on whitespace, leaving one token that can never execute. Without
      # the element it prepends CMD to the parsed array and gets exec form on
      # every version. Adding "CMD" back reads like a correction and is a
      # permanently unhealthy container.
      cmd: '["/usr/local/bin/frankenphp","php-cli","/usr/local/bin/baikal-health"]'
      interval: 30s
      start_period: 60s
    # What a pull proves once Baikal has started; none of it logs in.
    # users-table sends credentials for a user that does not exist, so
    # sabre/dav reads the users table to refuse them.
    checks:
      - name: dav
        path: /dav.php
        status: [401]
        body_regex: "No 'Authorization: Basic' header found"
      - name: users-table
        method: PROPFIND
        path: /dav.php/
        headers: { Authorization: "Basic {{ 'deerlab-nonexistent:x' | b64encode }}" }
        status: [401]
        body_regex: Username or password was incorrect
      # Its lookups reach the resolver under its own name (as wallabag's). The
      # image's PHP can open no URL (allow_url_fopen is off), so this fetches
      # over a bare TLS socket, which verifies the certificate: the same code
      # as the speed test's check on the edge. It follows the resolver's
      # redirect: the test address answers a first request with a 302 to a
      # fresh name, and the lookup of that name is what this proves.
      - name: dns-name
        type: exec
        where: host
        timeout: 10
        cmd:
          - /usr/local/bin/frankenphp
          - php-cli
          - -r
          - >-
            $u = $argv[1]; for ($i = 0; $i < 3; $i++) { $p = parse_url($u);
            $s = @stream_socket_client("tls://" . $p["host"] . ":443", $e, $m, 8); if (!$s) { fwrite(STDERR, "connect: $m\n"); exit(1); }
            fwrite($s, "GET " . ($p["path"] ?? "/") . (isset($p["query"]) ? "?" . $p["query"] : "")
            . " HTTP/1.0\r\nHost: " . $p["host"] . "\r\nUser-Agent: curl/8\r\n\r\n");
            $r = stream_get_contents($s); $x = explode("\r\n\r\n", $r, 2);
            if (preg_match("/^Location:\s*(https:\S+)/mi", $x[0], $l)) { $u = $l[1]; continue; }
            echo $x[1] ?? ""; exit(0); } exit(1);
          - "{{ deerlab_dns_test_url }}"
        stdout_regex: '"deviceName":\s*"baikal"'
    egress: platform
    backup:
      sqlite: [{ volume: data, path: Specific/db/db.sqlite }]
      volumes: [data]

  freshrss:
    uid: 2004
    image: docker.io/freshrss/freshrss:1.31.0-alpine@sha256:2cf8cb46b968cd39f0690938c66c3bf6604404b5125904a35d439c68c006991e
    # The image sets no USER, so Podman would run it as the service user, which
    # maps to namespace uid 0. Pinned to the image's own apache:www-data
    # instead, so cli/access-permissions.sh chowns the volume to the uid that
    # already owns it - a permitted same-owner no-op - rather than failing
    # without CAP_CHOWN and logging an error on every start. Confirm with
    # `id apache` against the image before the first apply.
    user: 100
    group: 82
    publish:
      # Container side 8080, not the image's 80: a non-root container uid
      # cannot bind a low port. Measured on svc1 - a rootless container netns
      # reports ip_unprivileged_port_start=1024, because Podman's
      # default_sysctls does not lower it the way Docker's does.
      - "8083:8080"
    volumes:
      # chown renders :U. A fresh volume's copy-up lands root-owned and a
      # uid-100 container then cannot create data/users. :U also self-heals
      # after a volume is deleted and recreated, which is what Restore B does.
      - { name: data, mount: /var/www/FreshRSS/data, chown: true }
    tmpfs:
      # Apache writes its pid here; the image creates the directory empty.
      - "/run/apache2:rw,nosuid,nodev,size=16m,mode=1777"
      # PHP sessions land in /tmp on Alpine because session.save_path is unset.
      # The template's ReadOnlyTmpfs=true already makes /tmp a writable tmpfs;
      # this entry is here to cap it at 256m.
      - "/tmp:rw,nosuid,nodev,size=256m,mode=1777"
    config_files:
      # A faithful copy of Docker/FreshRSS.Apache.conf at the pinned tag with
      # the two edits listed under upstream:. Re-diff it on every image
      # bump. 0644, not Caddy's 0640: Caddy declares no user: and so runs as
      # namespace uid 0, which can read a root-owned group-restricted file.
      # This container runs as uid 100 and cannot - at 0640 Apache fails to
      # read its own configuration and never starts.
      - path: config/FreshRSS.Apache.conf
        content: "{{ freshrss_apache_conf }}"
        mode: "0644"
        banner: "#"
        upstream:
          path: /var/www/FreshRSS/Docker/FreshRSS.Apache.conf
          edits:
            - { from: Listen 80, to: "Listen 8080" }
            - from: "\tRemoteIPInternalProxy 10.0.0.1/8 172.16.0.1/12 192.168.0.1/16"
              to: "\tRemoteIPInternalProxy 10.0.0.1/8 172.16.0.1/12 192.168.0.1/16 100.64.0.0/10 fd7a:115c:a1e0::/48"
    mounts:
      # The Alpine path. The entrypoint auto-detects it from a list that also
      # covers Debian's sites-available and Arch's conf/conf.d - do not copy a
      # path from documentation written for another variant.
      - { src: /var/lib/freshrss/config/FreshRSS.Apache.conf,
          dst: /etc/apache2/conf.d/FreshRSS.Apache.conf, ro: true }
    env:
      # CRON_MIN is deliberately ABSENT and must stay absent. The image's baked
      # crontab runs `su apache`, and su is setuid-root, which
      # NoNewPrivileges=true neuters, so the internal cron cannot work here
      # under any configuration. On this Alpine variant setting it fails
      # SILENTLY: the container runs, crond starts, `crontab -` fails with
      # "must be suid to work properly", and feeds are never refreshed. The
      # refresh workload below is what actually fetches.
      #
      # TZ is deliberately absent too. The entrypoint applies it by writing
      # /etc/localtime, /etc/timezone and php.ini, all of which fail on a
      # read-only rootfs, with no set -e to notice. The image's own ENV TZ=UTC
      # is the effective setting, which is what this estate wants anyway.
      #
      # Idempotent by upstream design: do-install.php exits 3 once
      # data/applied_migrations.txt exists and the entrypoint treats 3 as "no
      # change performed". A real failure exits non-zero and the entrypoint
      # propagates it, so the container fails loudly. Flags are hyphenated;
      # the underscore spellings are deprecated aliases.
      FRESHRSS_INSTALL: >-
        --default-user {{ freshrss_admin_user }}
        --base-url https://freshrss.{{ deerlab_domain }}
        --db-type sqlite
        --language en
        --title FreshRSS
        --api-enabled
    secrets:
      # The whole argument string is the secret, not just the password, because
      # create-user.php takes the password as an argument and there is no way
      # to split it out. It must NOT go in env: above - the template renders
      # env entries as Environment= lines into a world-readable (mode 0644)
      # Quadlet file, so the password would sit in plaintext on the host.
      #
      # Create-only: create-user.php exits 3 once the user exists, so changing
      # this value and promoting appears to succeed and changes nothing. A real
      # password change goes through the UI or cli/update-user.php.
      #
      # Charset: both the admin username and the password must use only
      # A-Za-z0-9.,_-. The entrypoint expands this string through
      # eval "echo \"$FRESHRSS_USER\"", so inside those double quotes a
      # backtick, a dollar sign, a backslash or a double quote is interpreted,
      # and the resulting unquoted command substitution then word-splits and
      # globs.
      #
      # Even with a compliant charset the password is not kept off the host
      # entirely: the entrypoint passes it to create-user.php as a
      # command-line argument on every container start, so it is briefly
      # visible in that process's /proc/<pid>/cmdline.
      - { name: user-args, value: "--user {{ freshrss_admin_user }} --password {{ freshrss_admin_password }} --language en", type: env, target: FRESHRSS_USER }
    capabilities: []
    read_only: true
    no_new_privileges: true
    health:
      # Invoked through the interpreter rather than the shebang, so neither the
      # exec bit nor $PATH matters. --url is needed because the default is
      # http://localhost/api/ and the listen port moved. The probe asserts the
      # body starts with <!DOCTYPE html>, ends with </html> and contains
      # /scripts/api.js, so it is a content check - but it does NOT read the
      # database. This is liveness only.
      cmd: php /var/www/FreshRSS/cli/health.php --url=http://localhost:8080/api/
      interval: 30s
      start_period: 120s
    # web, not platform: a feed reader fetches arbitrary URLs, so port 80 is
    # required for plain-HTTP feeds and for HTTP-to-HTTPS redirects.
    # What a pull proves once FreshRSS has started; none of it logs in or
    # reads the live database. On the host, refresh waits for the job's
    # first run since the start. The ci- checks run only in the CI lab: they
    # import one public feed, run the refresh job and count what it fetched.
    checks:
      - name: api
        path: /api/
        body_regex: /scripts/api\.js
      - name: greader
        path: /api/greader.php/check/compatibility
        headers: { Authorization: GoogleLogin auth=test/1 }
        body_regex: ^PASS$
      - name: refresh
        type: unit
        workload: refresh
        where: host
      # The user comes from FreshRSS itself, so no account name is in the
      # check. FreshRSS's own releases feed: stable and public.
      - name: ci-feed-import
        type: exec
        where: ci
        cmd:
          - sh
          - -c
          - >-
            cat > /tmp/deerlab-feeds.opml && exec php ./cli/import-for-user.php
            --user "$(php ./cli/list-users.php | head -n 1)" --filename /tmp/deerlab-feeds.opml
        stdin: >-
          <?xml version="1.0" encoding="UTF-8"?><opml version="2.0"><head><title>deerlab lab</title></head><body><outline
          text="FreshRSS releases" type="rss" xmlUrl="https://github.com/FreshRSS/FreshRSS/releases.atom"/></body></opml>
      - name: ci-refresh
        type: unit
        workload: refresh
        start: true
        where: ci
        timeout: 120
      # FreshRSS subscribes a new user to its releases feed already, so the
      # import may add nothing; at least one feed must be there.
      - name: ci-feed-count
        type: exec
        where: ci
        cmd: [php, ./cli/user-info.php, --json]
        stdout_regex: '"feeds":\s*[1-9]'
      - name: ci-feed-unreads
        type: exec
        where: ci
        cmd: [php, ./cli/user-info.php, --json]
        stdout_regex: '"unreads":\s*[1-9]'
      # Its lookups reach the resolver under its own name (as wallabag's).
      - name: dns-name
        type: exec
        where: host
        timeout: 10
        cmd: [php, -r, 'ini_set("user_agent", "curl/8"); echo file_get_contents($argv[1]);', "{{ deerlab_dns_test_url }}"]
        stdout_regex: '"deviceName":\s*"freshrss"'
    egress: web
    backup:
      # A glob, not a fixed path: FreshRSS keeps one database per user, and a
      # second account must not end up covered only by the raw volume copy.
      sqlite:
        - { volume: data, path: "users/*/db.sqlite" }
      volumes: [data]
    workloads:
      refresh:
        kind: job
        # Fifteen minutes, jittered by 60s so the fetch burst does not land on
        # a round minute. runtime_max in limits.yml is 600s, strictly inside
        # the window and enforced by Podman's own --timeout, not a systemd
        # timeout directive.
        schedule: "*:0/15"
        persistent: false
        # Bypasses ./Docker/entrypoint.sh, which ends in exec "$@" and would
        # otherwise re-run cli/prepare.php and
        # cli/access-permissions.sh --only-userdirs every fifteen minutes,
        # concurrently with the daemon serving from the same files.
        entrypoint: php
        exec: ./app/actualize_script.php
        # Overrides the primary's list, which a workload otherwise inherits
        # whole: no Apache runs here, so /run/apache2 is dropped and only the
        # 256m cap on /tmp is kept.
        tmpfs:
          - "/tmp:rw,nosuid,nodev,size=256m,mode=1777"

  vikunja:
    uid: 2005
    # The official image, FROM scratch: one static binary and a CA bundle, no
    # shell, no curl and no entrypoint script. docker.io/vikunja/vikunja serves
    # the same index digest; ghcr.io matches the image's own source label.
    image: ghcr.io/go-vikunja/vikunja:2.8.0@sha256:35d937baf3b5d5803bed6b9e11d007448b7b536df9e4346dc35551e1072636c3
    # The image's own USER, pinned rather than inherited, so an image that
    # changed it cannot make :U silently re-chown the volumes to a new uid.
    # group is explicit because the image names none, which means gid 0.
    user: 1000
    group: 1000
    publish:
      - "8084:3456"
    volumes:
      # chown renders :U. The image ships nothing at either path, so a fresh
      # volume is root-owned and uid 1000 exits 1 at start with "storage
      # validation failed ... permission denied". :U also repairs ownership
      # after Restore B recreates a volume empty.
      - { name: db, mount: /db, chown: true }
      - { name: files, mount: /app/vikunja/files, chown: true }
    tmpfs:
      # A data export zips every attachment into /tmp before moving it into
      # files storage, and a vikunja-file import lands here up to
      # migration.vikunjafile.maxsize, 256MB by default. tmpfs pages count
      # against the container's memory limit in limits.yml.
      - "/tmp:rw,nosuid,nodev,size=256m,mode=1777"
    # Vikunja's web command traps only SIGINT. On Podman's default SIGTERM it
    # exits at once with 143, cutting requests in flight.
    stop_signal: SIGINT
    env:
      # Must equal the browser origin exactly: the web app is served with its
      # API base rewritten to this URL plus api/v1. It also builds every link
      # in mail and feeds, and is fatal at start if unset while CORS is on.
      VIKUNJA_SERVICE_PUBLICURL: "https://{{ vikunja_hostname }}/"
      # Closed. The household registered while it was open. A new account is
      # created on the host with `user create`, which prompts for the password
      # (see the runbook's Vikunja section). Never reopen it to add one
      # person: the hostname is in Certificate Transparency, and anyone
      # watching it can register while it is open.
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
      # The database always stores GMT (pkg/db/db.go), so these two change how
      # times are read and where a new account starts, never stored data.
      VIKUNJA_SERVICE_TIMEZONE: Australia/Sydney
      VIKUNJA_DEFAULTSETTINGS_TIMEZONE: Australia/Sydney
      # Trust the edge's X-Forwarded-For, so logs, session lists and the
      # unauthenticated rate limit of 10 a minute per IP see real clients, not
      # the edge. CIDR only: a bare address is dropped with a warning
      # (parseTrustedProxies in pkg/routes/ip.go). Both tailnet ranges,
      # comma-separated.
      VIKUNJA_SERVICE_IPEXTRACTIONMETHOD: xff
      VIKUNJA_SERVICE_TRUSTEDPROXIES: "100.64.0.0/10,fd7a:115c:a1e0::/48"
      # SQLite with no DSN tricks: on 2.6.0 overlapping writes can fail at once
      # with HTTP 500 "database is locked", which is accepted and in the
      # runbook. Both paths are explicit so a future image cannot move the data
      # silently. .sqlite, not the image's .db, because just restore-drill
      # checks *.sqlite and *.sqlite3 only.
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.sqlite
      VIKUNJA_FILES_BASEPATH: /app/vikunja/files
      # Implicit TLS on 465, the one port the mail egress class adds.
      VIKUNJA_MAILER_ENABLED: "true"
      VIKUNJA_MAILER_HOST: "{{ vikunja_mailer_host }}"
      VIKUNJA_MAILER_PORT: "465"
      VIKUNJA_MAILER_FORCESSL: "true"
      VIKUNJA_MAILER_FROMEMAIL: "{{ vikunja_mailer_from }}"
      TZ: Etc/UTC
      # Deliberately ABSENT, and must stay absent:
      # - VIKUNJA_SERVICE_TESTINGTOKEN mounts database-truncation endpoints;
      # - VIKUNJA_LICENSE_KEY turns on a licence check that calls upstream;
      # - VIKUNJA_SENTRY_* and VIKUNJA_AUTH_OPENID_*;
      # - VIKUNJA_DATABASE_PASSWORD and every PG* variable: this is SQLite;
      # - VIKUNJA_CORS_*. The default allows localhost:* and 127.0.0.1:* with
      #   credentials, which the desktop app needs: it serves its frontend on
      #   127.0.0.1:45735 and falls back to a random port when that is taken.
    secrets:
      # Signs access tokens, link-share tokens and API-token keys; unset, it
      # is regenerated at every start. Not create-only: rotating it invalidates
      # in-flight link-share and access tokens; share links and sessions
      # survive.
      - { name: service-secret, value: "{{ vikunja_service_secret }}", type: env, target: VIKUNJA_SERVICE_SECRET }
      # The username too: it is half a credential, and env: would put it in
      # the world-readable Quadlet file.
      - { name: mailer-username, value: "{{ vikunja_mailer_username }}", type: env, target: VIKUNJA_MAILER_USERNAME }
      - { name: mailer-password, value: "{{ vikunja_mailer_password }}", type: env, target: VIKUNJA_MAILER_PASSWORD }
    capabilities: []
    read_only: true
    no_new_privileges: true
    health:
      # A JSON array because the image has no shell, with no leading "CMD" (see
      # baikal's record). It proves the database opens and migrates and the
      # files directory is writable. It does NOT prove the data is there: over
      # a deleted database it creates a new, empty one and passes, as the
      # server does at every start. backup.sqlite's presence_query is what
      # notices. Each probe runs Vikunja's full start-up, migrations included.
      cmd: '["/app/vikunja/vikunja","healthcheck"]'
      interval: 30s
      start_period: 60s
    # platform plus 465 for the mailer. Webhooks stay enabled and can reach
    # any public address on 443 or 465.
    # What a pull proves once Vikunja has started; none of it logs in. No
    # dns-name check: the image is FROM scratch, with nothing to fetch the
    # resolver's test endpoint, so Vikunja's name at the resolver stays
    # unproven on the host; the CI lab's built-in dns check proves its
    # steering.
    # database asks for a link share that does not exist: error 3006 comes
    # from the shares table.
    checks:
      - name: api-info
        path: /api/v1/info
        body_regex: '"registration_enabled":\s*false'
        body_version: true
      - name: database
        method: POST
        path: /api/v1/shares/deerlab-nonexistent/auth
        body: {}
        body_format: json
        status: [404]
        body_regex: '"code":\s*3006'
      - name: frontend
        path: /
        body_regex: "window\\.API_URL = 'https://{{ vikunja_hostname | regex_escape }}"
    egress: mail
    backup:
      sqlite:
        # Fails the backup, and pages, when no account exists. A re-created
        # empty database passes every other check.
        - { volume: db, path: vikunja.sqlite, presence_query: "SELECT count(*) > 0 FROM users" }
      volumes: [db, files]

  actual:
    uid: 2006
    # The official Debian build, from Docker Hub because it records push
    # times, which Renovate's cooldown needs. ghcr.io/actualbudget/actual
    # serves the same index digest.
    image: docker.io/actualbudget/actual-server:26.11.0@sha256:06cf186569cf58d93e12659ff1a517b65b5b0ebee7050a3991d4bd8a1d398da6
    # The image sets no USER, so it would run as root, and root with no
    # capabilities cannot write the /data the image gives to actual:1001.
    # Pinned to that user. Upstream neither documents nor tests non-root, so
    # re-test on every bump.
    user: 1001
    group: 1001
    publish:
      - "8085:5006"
    volumes:
      # One volume: /data/.migrate and server-files/account.sqlite are one
      # restore unit, and losing .migrate crash-loops the server. chown
      # renders :U: a fresh volume is root-owned, and the first migration's
      # mkdir then fails with EACCES.
      - { name: data, mount: /data, chown: true }
    env:
      # Explicit: the reset-password CLI resolves the data directory itself
      # and looks in /app unless this is set.
      ACTUAL_DATA_DIR: /data
      # No such file exists in the read-only image, so no config file is
      # read. Unset, the server loads /data/config.json whenever one exists,
      # so a file written into the volume, or carried in by a restore, could
      # change the login method or the trusted proxies at the next start.
      ACTUAL_CONFIG_PATH: /app/config.json
      # IPv4 explicitly. The default :: logs "Listening" and exits 0 on a
      # kernel without IPv6; the edge dials it over IPv4.
      ACTUAL_HOSTNAME: 0.0.0.0
      # Whose X-Forwarded-For to believe, so the login limiter (5 failures
      # per 15 minutes) keys on each real client: both tailnet ranges. No
      # spaces: a space after a comma makes the server exit 0 with nothing
      # listening.
      ACTUAL_TRUSTED_PROXIES: "100.64.0.0/10,fd7a:115c:a1e0::/48"
      # Keeps ANSI colour codes out of the request log in journald.
      NO_COLOR: "1"
      # Deliberately ABSENT, and must stay absent:
      # - ACTUAL_LOGIN_METHOD, ACTUAL_ALLOWED_LOGIN_METHODS,
      #   ACTUAL_TRUSTED_AUTH_PROXIES and every ACTUAL_OPENID_*: one shared
      #   password, no header auth, no OpenID;
      # - ACTUAL_CORS_PROXY_ENABLED and ACTUAL_GITHUB_TOKEN;
      # - ACTUAL_TOKEN_EXPIRATION: the next login revives the same token, so
      #   it buys nothing. Revoke by deleting the sessions (runbook);
      # - DEBUG: actual-sensitive:* prints secrets, and bank-sync secret
      #   values are logged under actual:*;
      # - NODE_ENV: the image sets production; development drops the rate
      #   limiter.
    capabilities: []
    read_only: true
    no_new_privileges: true
    # No stop_signal and no entrypoint. tini forwards signals and the server
    # handles none, so SIGTERM ends it at once with 143. Without tini, node
    # as PID 1 ignores SIGTERM and SIGINT alike.
    # 143 is that stop, not a fault: without this every stop and every
    # restart the role makes, an image bump's among them, would page.
    success_exit_status: [143]
    health:
      # Opens account.sqlite afresh, read-only and only if it exists, reads
      # auth, then asks the server a question it answers from the database,
      # with a 5 s timeout. It fails on a deleted or unreadable database, a
      # hung server and one not listening, and passes before the password is
      # set, which Notify=healthy needs. It proves neither a password nor a
      # budget; the backup's presence_query does. Backticks, so neither YAML
      # nor JSON needs escaped quotes; the fold joins lines with spaces.
      cmd: >-
        ["node","-e","const D=require(`/app/node_modules/better-sqlite3`);
        const db=new D(`/data/server-files/account.sqlite`,{readonly:true,fileMustExist:true});
        db.prepare(`SELECT count(*) FROM auth`).get(); db.close();
        fetch(`http://127.0.0.1:5006/account/needs-bootstrap`,{signal:AbortSignal.timeout(5000)})
        .then(r=>r.json()).then(j=>process.exit(j.status===`ok`?0:1),()=>process.exit(1))"]
      interval: 30s
      start_period: 60s
    # The server calls out only for bank sync, which is not configured; the
    # user still needs 443 for restic and the dead-man.
    # What a pull proves once Actual has started; none of it logs in.
    # needs-bootstrap reads the auth table: the host's server holds a
    # password, the CI lab's fresh one does not.
    checks:
      - name: version
        path: /info
        body_regex: '"name":\s*"@actual-app/sync-server"'
        body_version: true
      - name: bootstrapped
        where: host
        path: /account/needs-bootstrap
        body_regex: '"bootstrapped":\s*true'
      - name: fresh-store
        where: ci
        path: /account/needs-bootstrap
        body_regex: '"bootstrapped":\s*false'
      - name: web
        path: /
        body_regex: <title>Actual</title>
      # Its lookups reach the resolver under its own name (as wallabag's).
      - name: dns-name
        type: exec
        where: host
        timeout: 10
        cmd:
          - node
          - -e
          - >-
            fetch(process.argv[1], {headers: {"user-agent": "curl/8"}, signal: AbortSignal.timeout(8000)})
            .then(r => r.text()).then(t => process.stdout.write(t))
          - "{{ deerlab_dns_test_url }}"
        stdout_regex: '"deviceName":\s*"actual"'
    egress: platform
    backup:
      sqlite:
        # Prints 1 only with a password set and at least one live budget
        # that is end-to-end encrypted. Pages on a lost or re-created store,
        # on no budget and on encryption lost, and on the first night until
        # the household has created the budget.
        - volume: data
          path: server-files/account.sqlite
          presence_query: >-
            SELECT (SELECT count(*) FROM auth) > 0 AND (SELECT count(*) FROM
            files WHERE deleted = 0 AND encrypt_keyid IS NOT NULL) > 0
        # Each budget's change log since its last full upload. A sync reset,
        # turning on encryption among them, deletes it until a device syncs.
        - { volume: data, path: "user-files/group-*.sqlite", allow_empty: true }
      volumes: [data]

  rsshub:
    uid: 2007
    # The chromium-bundled variant, because about 109 route namespaces need a
    # browser. Docker Hub, not ghcr.io: ghcr.io deletes RSSHub builds after 30
    # days, which would break a rebuild or a revert. RSSHub builds daily from
    # master and has no releases, so the dated tag is the version.
    image: docker.io/diygod/rsshub:chromium-bundled-2026-11-28@sha256:6d519752be220363926c17728fa7a2cb0d7710e7da32567474f7985f00c6d668
    # The image sets no USER, so it would run as root. Any uid works, since
    # nothing is mounted; this is the image's own node user.
    user: 1000
    group: 1000
    publish:
      - "8086:1200"
    # No volumes and no backup: key. The cache is in memory and nothing else
    # persists, so a restore is a redeploy.
    tmpfs:
      # Patchright's per-launch profile and artefact directories, Chromium's
      # crashpad database and font and NSS caches, npm's logs and Node's
      # compile cache. Nothing in it is executed. It counts against memory.
      - "/tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777"
    env:
      # Required: under the read-only home every browser launch dies with
      # "chrome_crashpad_handler: --database is required".
      HOME: /tmp
      # Otherwise winston tries to write /app/logs/, failing silently on the
      # read-only root. stdout reaches the journal.
      NO_LOGFILES: "true"
      # Stated so that a change of upstream default cannot move it.
      CACHE_TYPE: memory
      # By default / is exempt from the access key and lists the paths most
      # requested, so which feeds are read. This also unregisters /metrics.
      DEBUG_INFO: "false"
      # Makes /robots.txt, which the access key does not guard, answer 200:
      # both health checks probe it, so the key appears in neither.
      DISALLOW_ROBOT: "true"
      # Routes that fetch a URL or host the caller names, such as /rss/:url
      # and any Mastodon or Lemmy host. Only key holders can reach them, and
      # the egress class keeps them off private ranges and svc1 itself.
      ALLOW_USER_SUPPLY_UNSAFE_DOMAIN: "true"
      # The operator's choice over the image's Asia/Shanghai: a route that
      # parses a date with no zone reads it as Melbourne time.
      TZ: Australia/Melbourne
      # Deliberately ABSENT: REMOTE_CONFIG, SENTRY, HONEYBADGER_API_KEY and
      # OPENAI_API_KEY, each of which sends data to a third party.
    secrets:
      # RSSHub accepts the key only as ?key= in the URL. A Podman secret,
      # because the Quadlet file is world-readable; never in HealthCmd.
      - { name: access-key, value: "{{ rsshub_access_key }}", type: env, target: ACCESS_KEY }
    # RSSHub launches its browser with --no-sandbox and ignores certificate
    # errors, both hard-coded upstream, so Chromium's own sandbox is always
    # off. These and the egress chain are what contain a renderer.
    capabilities: []
    read_only: true
    no_new_privileges: true
    # No stop_signal: dumb-init forwards SIGTERM and the server exits 143.
    # That is the stop, not a fault: without this every stop and every
    # restart the role makes, each weekly image bump's among them, would page.
    success_exit_status: [143]
    health:
      # Liveness only: it proves the HTTP server answers. A browser broken
      # by a bump goes unseen; browser routes then answer 503 and FreshRSS
      # shows a feed error.
      cmd: curl --fail --silent --output /dev/null http://127.0.0.1:1200/robots.txt
      interval: 30s
      start_period: 60s
    # Any TCP port to public addresses: routes reach IMAP on 993 and sites on
    # ports other than 80 and 443. Private ranges and svc1's own addresses
    # stay closed.
    # What a pull proves once RSSHub has started; it exposes no version, so
    # the built-in image check is its version proof. A check never carries
    # the key: ?code= is md5(path + key), which opens one test route and
    # nothing else. A fresh limit= on every run misses the route cache.
    # browser drives the bundled Chromium through Patchright against the
    # same route, under the container's real confinement, with the
    # executable RSSHub itself would pick; the URL and its code go on stdin,
    # never in the command line.
    checks:
      - name: robots
        path: /robots.txt
        body_regex: "Disallow: /"
      - name: key-required
        path: /healthz
        status: [403]
      - name: route-key-required
        path: /test/1
        status: [403]
      - name: test-route
        path: /test/1
        timeout: 15
        query:
          code: "{{ ('/test/1' ~ rsshub_access_key) | hash('md5') }}"
          limit: "{{ range(6, 1000) | random | string }}"
        body_regex: <title>Title1</title>
      - name: browser
        type: exec
        timeout: 45
        stdin: "http://127.0.0.1:1200/test/1?code={{ ('/test/1' ~ rsshub_access_key) | hash('md5') }}&limit={{ range(6, 1000) | random }}"
        cmd:
          - node
          - -e
          - >-
            const {chromium}=require('patchright');let u='';process.stdin.on('data',d=>u+=d).on('end',async()=>{
            const b=await chromium.launch({executablePath:process.env.CHROMIUM_EXECUTABLE_PATH||undefined,args:['--no-sandbox']});
            const p=await b.newPage();await p.goto(u.trim());
            const c=await p.content();await b.close();const ok=c.includes('Title1');
            process.stdout.write(ok?'Title1':'missing');process.exit(ok?0:1)})
        stdout_regex: Title1
      # Through Caddy and the tailnet, as a reader arrives.
      - name: edge
        where: host
        via: edge
        host: "rsshub.{{ deerlab_domain }}"
        path: /robots.txt
        timeout: 35
        body_regex: "Disallow: /"
      # Its lookups reach the resolver under its own name (as wallabag's).
      - name: dns-name
        type: exec
        where: host
        timeout: 10
        cmd: [curl, --fail, --silent, --location, --max-time, "8", "{{ deerlab_dns_test_url }}"]
        stdout_regex: '"deviceName":\s*"rsshub"'
    egress: public

  mealie:
    uid: 2009
    # Docker Hub, not ghcr.io, because it records push times, which
    # Renovate's cooldown needs; ghcr.io/mealie-recipes/mealie serves the
    # same index digest. Tags carry a leading v, which body_version allows.
    image: docker.io/hkotel/mealie:v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f
    # The image's own abc user, uid 911. The image sets no USER, so it would
    # start as root, and its entry script's root steps (usermod, chown -R
    # /app, gosu) run only for uid 0: under 911 it prints a banner and
    # starts the server. gid 911, the entry script's own PGID default:
    # everything the image ships is root's, so the group shows only in the
    # volume.
    user: 911
    group: 911
    publish:
      # 9000 is above 1024, so binding it needs no capability.
      - "8087:9000"
    volumes:
      # One volume: mealie.db, every recipe's images, and .secret and
      # .session_secret, which sign every session. chown renders :U. A fresh
      # volume is root-owned, and uid 911 exits 1 at start with "Permission
      # denied: '/app/data/groups'".
      - { name: data, mount: /app/data, chown: true }
    tmpfs:
      # The template's ReadOnlyTmpfs=true already makes /tmp a writable tmpfs;
      # this entry caps it at 256m. Starlette spools a request body over 1 MB
      # here, and NLTK's tagger (the ingredient parser), restores and imports
      # from other apps use it too. With no writable /tmp at all (Docker,
      # read-only, no tmpfs) a recipe photo upload answered 400. tmpfs pages
      # count against the container's memory limit in limits.yml.
      - "/tmp:rw,nosuid,nodev,size=256m,mode=1777"
    config_files:
      # 0644: uid 911 cannot read a group-restricted file. No banner: JSON
      # has no comment syntax.
      - path: config/logconf.json
        content: "{{ mealie_log_config }}"
        mode: "0644"
        upstream:
          path: /opt/mealie/lib/python3.14/site-packages/mealie/core/logger/logconf.prod.json
          edits:
            - { from: '      "filename": "${DATA_DIR}/mealie.log",', to: '      "filename": "/dev/null",' }
            - { from: '        "access",', to: '        "stderr",' }
    # The file, not its directory: config_files makes the directory 0750 for
    # the service user, which is namespace root, so uid 911 could not enter
    # it.
    mounts:
      - { src: /var/lib/mealie/config/logconf.json, dst: /etc/deerlab/logconf.json, ro: true }
    env:
      # Builds every invite, password-reset and notification link, and the
      # installed app's scope.
      BASE_URL: "https://{{ mealie_hostname }}"
      # The default, written down. The operator creates each account; an
      # invite link still registers into its household.
      ALLOW_SIGNUP: "false"
      # Hours: 9600 is the maximum, 400 days from logging in. A login does not
      # slide forward with use; the app renews it only while it is open after
      # 60 % of its remaining life has passed.
      TOKEN_TIME: "9600"
      # Hours. Five wrong passwords lock that account, even against the right
      # one; the count is per user, and there is no limit per address.
      SECURITY_USER_LOCKOUT_TIME: "1"
      # Whose X-Forwarded-For to believe: both tailnet ranges, which the edge
      # arrives from.
      HOST_IP: "100.64.0.0/10,fd7a:115c:a1e0::/48"
      # Removes /docs. /redoc and /openapi.json still answer.
      API_DOCS: "false"
      # The daily tasks run at 23:45 local time, and meal plans are dated.
      TZ: Australia/Sydney
      # Vikunja's relay and sender, over implicit TLS on 465, which the
      # web-mail class opens. Mealie does not verify the relay's certificate:
      # it uses smtplib.SMTP_SSL with no context.
      SMTP_HOST: "{{ vikunja_mailer_host }}"
      SMTP_PORT: "465"
      SMTP_AUTH_STRATEGY: SSL
      SMTP_FROM_NAME: Mealie
      SMTP_FROM_EMAIL: "{{ vikunja_mailer_from }}"
      # The vendored copy above, mounted below.
      LOG_CONFIG_OVERRIDE: /etc/deerlab/logconf.json
      # Hosts the scraper may fetch although they are private: none here.
      HTTP_ALLOW_LIST: "{{ mealie_http_allow_list }}"
      # Deliberately ABSENT, and must stay absent:
      # - every OPENAI_* variable. At v3.30.0 AI providers live in the
      #   database, and the key is typed into the group settings; these
      #   configure nothing on a fresh store;
      # - OIDC_*, LDAP_* and REVERSE_PROXY_AUTH_*: Mealie's own login only;
      # - SCRAPER_PROXY_*: the scraper fetches directly, under the firewall;
      # - SQLITE_MIGRATE_JOURNAL_WAL: journal mode stays delete, one file;
      # - UVICORN_WORKERS: each worker would run its own scheduler.
    secrets:
      # type: env, never the role's default mount: a 0400 root-owned file in
      # /run/secrets named after a settings field crashes Mealie at start
      # under a non-root uid. The username too, as Vikunja's.
      - { name: smtp-user, value: "{{ vikunja_mailer_username }}", type: env, target: SMTP_USER }
      - { name: smtp-password, value: "{{ vikunja_mailer_password }}", type: env, target: SMTP_PASSWORD }
    # No capability was needed: every failure in the confinement experiment
    # was a write, and the volume and /tmp cover both.
    capabilities: []
    read_only: true
    no_new_privileges: true
    # No stop_signal: on Podman's default SIGTERM it exits 0, unless a
    # request is in flight: it waits for that, and a long one outlasts the
    # stop timeout (the runbook, Mealie, Stopping and restarting).
    health:
      # Opens mealie.db afresh, read-only, and reads users, then asks the
      # server for /api/app/about, each with a 5 s timeout. The image's own
      # check (curl /api/app/about) passes over a deleted database, because
      # the connection pool keeps the deleted file open; this one fails. A
      # JSON array with no leading "CMD" (see baikal's record); the fold
      # joins the lines with spaces.
      cmd: >-
        ["python","-I","-c","import sqlite3,urllib.request;
        c=sqlite3.connect('file:/app/data/mealie.db?mode=ro',uri=True,timeout=5);
        c.execute('SELECT count(*) FROM users').fetchone(); c.close();
        urllib.request.urlopen('http://127.0.0.1:9000/api/app/about',timeout=5)"]
      interval: 30s
      start_period: 60s
    # Web and SMTP submission to public addresses only, never svc1's own:
    # the scraper fetches any address a user hands it, and the AI provider's
    # base URL and the notifiers skip Mealie's own request-forgery guard.
    egress: web-mail
    # What a pull proves once Mealie has started; none of it logs in or
    # reads the live database.
    checks:
      # tokenTime proves the environment reached the server.
      - name: version
        path: /api/app/about
        body_regex: '"allowSignup":\s*false,.*"tokenTime":\s*9600[,}]'
        body_version: true
      # A lookup in household_preferences that must find nothing.
      - name: database
        path: /api/households/mealplans/ical/deerlab-nonexistent
        status: [404]
        body_regex: Calendar not found
      # The lab's store is fresh: the default admin's email is still there.
      - name: fresh-store
        where: ci
        path: /api/app/about/startup-info
        body_regex: '"isFirstLogin":\s*true'
      - name: frontend
        path: /
        body_regex: <title>Mealie</title>
      # The installed app's manifest, with the phone's share target.
      - name: manifest
        path: /manifest.webmanifest
        body_regex: '"share_target"'
      # Its lookups reach the resolver under its own name (as wallabag's).
      - name: dns-name
        type: exec
        where: host
        timeout: 10
        cmd: [curl, --fail, --silent, --location, --max-time, "8", -A, curl/8, "{{ deerlab_dns_test_url }}"]
        stdout_regex: '"deviceName":\s*"mealie"'
      # The vendored log config is in force: Mealie's own would write this
      # file at every start, so a bump that stopped reading
      # LOG_CONFIG_OVERRIDE fails here rather than logging tokens again.
      - name: log-file-absent
        type: exec
        cmd: [test, "!", -e, /app/data/mealie.log]
      # The published default admin's email is gone (the operator replaced
      # the admin before the public site). It cannot prove the password
      # changed: only a login would, and no check logs in.
      - name: admin-changed
        where: host
        path: /api/app/about/startup-info
        body_regex: '"isFirstLogin":\s*false'
      # Through Caddy and the tailnet, as a phone arrives.
      - name: edge
        where: host
        via: edge
        host: "{{ mealie_hostname }}"
        path: /api/app/about
        timeout: 35
        body_regex: '"allowSignup":\s*false'
      # Mealie's own scraper on the CI fixture front's plain-http recipe
      # page: port 80 under web-mail, pasta, the guard's allow list and the
      # recipe parser. It touches no database.
      - name: ci-scrape
        type: exec
        where: ci
        timeout: 30
        cmd:
          - python
          - -I
          - -c
          - >-
            import asyncio,sys; from mealie.services.scraper.scraper_strategies import RecipeScraperPackage;
            s=asyncio.run(RecipeScraperPackage(sys.argv[1],None,None).scrape_url());
            print(s.title() if s else 'no recipe')
          - http://203.0.113.10/mealie-recipe.html
        stdout_regex: deerlab lab pancakes
    backup:
      sqlite:
        # Prints 1 only once a second account and a first recipe exist. A
        # fresh store already holds the default admin, so users > 0 would
        # pass on a lost and re-created store. Journal mode delete: one file.
        - volume: data
          path: mealie.db
          presence_query: >-
            SELECT (SELECT count(*) FROM users) > 1 AND (SELECT count(*) FROM recipes) > 0
      volumes: [data]

  # The always-on hub for the operator's own devices: every device syncs with
  # it, and through it with the others, so no two need to be online at once.
  # Tailnet devices dial it directly; the edge forwards the others.
  syncthing:
    uid: 2010
    # The official image. Its releases are unsigned, so this digest is the
    # only integrity anchor.
    image: docker.io/syncthing/syncthing:2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
    # Any uid works once the volumes are its own (:U below). With a non-root
    # user the image's entry script runs Syncthing directly; its root-only
    # steps (setcap, su-exec) never run.
    user: 65532
    group: 65532
    publish:
      # The GUI and API first: http checks go to the first published port.
      # Deliberately outside 8080-8099, the range the tailnet policy opens to
      # the edge, so only the operator's devices reach it.
      - "8384:8384"
      # The sync port, inside that range, for the edge's forwarder.
      - "8088:22000"
    volumes:
      # Two volumes, so that a restore can never bring back an index without
      # its files. state holds config.xml, cert.pem and key.pem (the device's
      # identity) and is backed up; data holds the index and every folder and
      # is never backed up. An index restored over missing files tells every
      # device to delete them. state is mounted at /var/syncthing, the
      # image's own VOLUME, so Podman adds no anonymous volume (measured: the
      # two named volumes and nothing else). chown renders :U: a fresh volume
      # is root's, and 65532 cannot create its config directory. :U re-chowns
      # at every start; with 50,000 files in data the unit was healthy in the
      # same 1 s as with none (measured).
      - name: state
        mount: /var/syncthing
        chown: true
        # Written while absent, before the first start, and never touched
        # once it exists: on a first deploy Syncthing never starts on its
        # defaults (syncthing_seed_config, above).
        seed:
          - { path: config/config.xml, mode: "0600", content_var: syncthing_seed_config }
      - { name: data, mount: /var/syncthing/data, chown: true }
    config_files:
      # 0644: the alert job's 65532 cannot read a group-restricted file. No
      # banner, so what is deployed is inventory/files/syncthing-alert.sh
      # byte for byte. A change restarts Syncthing, as any config file
      # change does.
      - path: config/alert.sh
        content: "{{ syncthing_alert_script }}"
        mode: "0644"
    env:
      # Emptied: the image sets STHOMEDIR, and with it set Syncthing refuses
      # STCONFDIR and STDATADIR. Measured: config, keys and certificate in
      # /var/syncthing/config, the database in /var/syncthing/data/index,
      # and nothing else in /var/syncthing but the two directories.
      STHOMEDIR: ""
      STCONFDIR: /var/syncthing/config
      STDATADIR: /var/syncthing/data/index
      # The image's own value, stated: the env wins over config.xml at every
      # start and is never saved into it.
      STGUIADDRESS: 0.0.0.0:8384
      STNOUPGRADE: "1"
      # Deliberately ABSENT, and must stay absent: STNORESTART and STPAUSED.
      # STGUIAPIKEY would add a second key that is never saved; the seed
      # carries the one key.
    # Nothing was added back: it ran confined with no capability.
    capabilities: []
    read_only: true
    no_new_privileges: true
    # No stop_signal and no success_exit_status: on Podman's default SIGTERM
    # it exits 0 within a second, and an idle stop ends inactive with
    # Result=success (measured).
    health:
      # Liveness only: the API answers. Never folder state, which
      # HealthOnFailure=kill would turn into a restart loop for a folder
      # that needs a person; the alert job reports folders. A JSON array
      # with no leading "CMD" (see baikal's record).
      cmd: '["curl","-fsS","-m","5","-o","/dev/null","http://127.0.0.1:8384/rest/noauth/health"]'
      interval: 30s
      start_period: 60s
    # With the seed in place Syncthing opens no outbound connection: devices
    # dial in. 443 for the dns-name check and the image.
    egress: platform
    # What a pull proves once Syncthing has started. None logs in.
    checks:
      - name: health
        path: /rest/noauth/health
        body_regex: '"status":\s*"OK"'
      # The GUI refuses a login it does not know: the seeded login is in
      # force, not an open GUI.
      - name: login-required
        method: POST
        path: /rest/noauth/auth/password
        body_format: json
        body: { username: deerlab-nonexistent, password: x, stayLoggedIn: false }
        status: [403]
      # The sync port presents Syncthing's own certificate. It refuses curl's
      # default ALPN offer, hence --no-alpn. Syncthing then closes the
      # connection for want of a client certificate, and curl exits 52 after
      # printing the server's, hence the true. Each run leaves two warnings
      # in Syncthing's log.
      - name: sync-tls
        type: exec
        cmd: [sh, -c, 'curl -sk --no-alpn -m 4 -o /dev/null -w "%{certs}" https://127.0.0.1:22000/; true']
        stdout_regex: 'CN = syncthing'
      # Its lookups reach the resolver under its own name (as wallabag's).
      - name: dns-name
        type: exec
        where: host
        timeout: 10
        cmd: [curl, --fail, --silent, --location, --max-time, "8", "{{ deerlab_dns_test_url }}"]
        stdout_regex: '"deviceName":\s*"syncthing"'
      # svc1 still runs its own identity. A rebuild that lost key.pem would
      # otherwise run a new device ID unseen, with every device's pairing
      # broken. It is kept in SOPS with the other identifiers, but once the
      # edge forwards port 22000 any client that completes TLS can compute it
      # from svc1's certificate: SOPS gives it one definition, not secrecy. A
      # check's regex never reaches a log or a page.
      - name: device-id
        type: exec
        where: host
        cmd: [syncthing, device-id]
        stdout_regex: '^{{ syncthing_device_id }}$'
      # Runs the job itself, so the verdict is decided at each start rather
      # than at the next 07:00 UTC; the job only reads, so an extra run harms
      # nothing. 15 s for a run that took under a second in the CI lab, within
      # svc1's budget.
      - name: alert
        type: unit
        workload: alert
        start: true
        where: host
        timeout: 15
      # The lab has no folders: the job must still succeed.
      - name: ci-alert
        type: unit
        workload: alert
        start: true
        where: ci
        timeout: 120
    # Config and identity only. Nothing here is SQLite, and the index and the
    # folders are never backed up (volumes, above).
    backup:
      volumes: [state]
    workloads:
      alert:
        kind: job
        # Daily, at a fixed hour. persistent: a run missed while svc1 was down
        # runs at the next boot, so a broken folder cannot go unreported for
        # long.
        schedule: "*-*-* 07:00:00 UTC"
        persistent: true
        # Syncthing's own network namespace: the API listens on its loopback,
        # and platform drops 127/8, so a job in a namespace of its own could
        # not reach it. The raw form, not syncthing.container: that would add
        # Requires=, and the timer would then start Syncthing itself.
        network: container:syncthing
        # The script, not the image's entry script and Syncthing.
        entrypoint: /bin/sh
        exec: /etc/deerlab/syncthing-alert.sh
        # The file, not its directory: config_files makes the directory 0750
        # for the service user, which is namespace root, so 65532 could not
        # enter it.
        mounts:
          - { src: /var/lib/syncthing/config/alert.sh, dst: /etc/deerlab/syncthing-alert.sh, ro: true }

  dufs:
    uid: 2011
    # The official image: one static binary on scratch, with no shell, no
    # /etc/passwd and no USER. Docker Hub records push times, so Renovate's
    # three-day wait applies.
    image: docker.io/sigoden/dufs:v0.47.0@sha256:e5152c04e41d5a9d785546278b632bf035c8a08c52d7e8d35f4b59681f5ff35a
    # The image has no USER, so without both the container runs as uid 0 with
    # gid 0. 65532 owns the volume through :U, below.
    user: 65532
    group: 65532
    publish:
      # Inside 8080-8099, the range the tailnet policy opens to the edge, for
      # Caddy's two sites.
      - "8089:5000"
    volumes:
      # The files, served at the root. chown renders :U: a fresh volume is
      # root's, and uploads then fail with 500 "Permission denied". No tmpfs:
      # dufs writes nothing outside this volume.
      - { name: data, mount: /data, chown: true }
    # Serves /data on the wildcard address and port 5000, dufs's defaults,
    # and lets the operator upload, delete, search and fetch a folder as an
    # uncompressed zip. Off, and staying off: --allow-hash, --allow-symlink,
    # --enable-cors, -A, --hidden and the render modes.
    exec: /data --allow-upload --allow-delete --allow-search --allow-archive --compress none
    env:
      # dufs's default access log plus the client address Caddy forwards,
      # since every request reaches dufs from the edge. Never
      # $http_authorization or $remote_user, which would log credentials. In
      # the environment rather than exec, so the $ signs and the quotes stay
      # off the Exec= line.
      DUFS_LOG_FORMAT: '$time_iso8601 $log_level - $remote_addr "$request" $status $http_x_forwarded_for'
    secrets:
      # The two accounts, and no anonymous rule (dufs_auth, above).
      - { name: auth, value: "{{ dufs_auth }}", type: env, target: DUFS_AUTH }
    # Nothing was added back: it runs confined with no capability.
    capabilities: []
    read_only: true
    no_new_privileges: true
    # dufs stops on SIGINT and, as PID 1, ignores SIGTERM: Podman's default
    # would end in a kill at the timeout, which pages. On SIGINT it exits 0 in
    # about 0.2 s, even mid-upload.
    stop_signal: SIGINT
    health:
      # A stand-in. The image has no shell and no client, so this proves only
      # that the binary runs, and Podman does not restart a dufs that hangs.
      # The checks below prove it serves, at every start. A JSON array with
      # no leading "CMD" (see baikal's record).
      cmd: '["/bin/dufs","--version"]'
      interval: 30s
      start_period: 30s
    # dufs opens no outbound connection; platform still lets the service user
    # pull its image and run restic.
    egress: platform
    # What a pull proves once dufs has started. None uses the operator's
    # account; reader's is the one Caddy sends for every visitor. No dns-name
    # check: the image has no client to make one (as Vikunja's).
    checks:
      - name: health
        path: /__dufs__/health
        body_regex: '"status":"OK"'
      # No anonymous rule: without credentials dufs refuses.
      - name: anonymous-refused
        path: /
        status: [401]
      # The reader account reads the volume; the page names the version.
      - name: reader-listing
        path: /
        headers: { Authorization: "Basic {{ ('reader:' ~ dufs_reader_password) | b64encode }}" }
        body_version: true
      # reader is read-only: the guard for the credential Caddy sends for
      # every visitor.
      - name: reader-write-refused
        method: PUT
        path: /deerlab-check-put
        headers: { Authorization: "Basic {{ ('reader:' ~ dufs_reader_password) | b64encode }}" }
        status: [403]
      # Anonymous clients cannot write: the guard against dufs's fail-open.
      - name: put-refused
        method: PUT
        path: /deerlab-check-put
        status: [401]
      # A user that does not exist gets 401: unknown credentials are refused,
      # which the edge's login relies on. No hash is computed and no real
      # credential is used.
      - name: login-configured
        path: /
        headers: { Authorization: "Basic {{ 'deerlab-nonexistent:x' | b64encode }}" }
        status: [401]
      # Anonymous clients cannot delete.
      - name: delete-refused
        method: DELETE
        path: /deerlab-nonexistent
        status: [401]
      # Through Caddy and the tailnet, as a visitor arrives: a folder without
      # its slash must stay hidden on the public site. That rests on dufs
      # sending Content-Disposition on files only, so it runs here, at every
      # dufs start, image bumps included, and not only when Caddy restarts
      # (Caddy's files-folder-hidden). 35 s, because Caddy waits up to 30 s
      # for an upstream that is restarting.
      - name: edge-folder-hidden
        where: host
        via: edge
        host: "files.{{ deerlab_domain }}"
        path: /deerlab-check
        status: [404]
        timeout: 35
    # The files as they are on the volume. A snapshot taken during an upload
    # holds the partial file; the next night's corrects it.
    backup:
      volumes: [data]
      # The operator places .deerlab-presence once and keeps it for good
      # (docs/runbook.md, dufs). An emptied or re-created volume then fails
      # the backup instead of backing up green.
      require:
        - { volume: data, path: .deerlab-presence }
