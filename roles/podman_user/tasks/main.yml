- name: Validate the service definitions
  ansible.builtin.assert:
    that:
      - podman_user_service_spec.uid is defined
      - podman_user_service_spec.uid | int >= podman_user_uid_base
      - podman_user_service_spec.egress in podman_user_egress_classes
      # Ansible evaluates `that:` in order and stops at the first false
      # condition, so this guard has to run before the three indexing checks
      # below - without it, a service missing from deerlab_service_limits
      # dies as a raw Jinja KeyError instead of this assert's own fail_msg.
      - podman_user_service_name in podman_user_limits
      - podman_user_limits[podman_user_service_name].slice.memory is defined
      - podman_user_limits[podman_user_service_name].slice.cpu is defined
      - podman_user_limits[podman_user_service_name].slice.tasks is defined
    fail_msg: >-
      service {{ podman_user_service_name }} needs uid >= {{ podman_user_uid_base }}, an egress
      class, and an entry with a slice budget in deerlab_service_limits
    quiet: true
  # A failed loop result contains its complete item. Loop over the service name
  # alone so a validation failure cannot print the service's secret values.
  loop: "{{ podman_user_services | list }}"
  loop_control:
    loop_var: podman_user_service_name
    label: "{{ podman_user_service_name }}"
  vars:
    podman_user_service_spec: "{{ podman_user_services[podman_user_service_name] }}"

- name: Reject duplicate UIDs
  ansible.builtin.assert:
    that:
      - podman_user_services.values() | map(attribute='uid') | list | unique | length == podman_user_services | length
    fail_msg: two services share a UID
    quiet: true

# A service with workloads runs every one of its containers in one slice, so a
# slice sized for one of them throttles the others. The symptom is a container
# that is running, healthy and slow for a reason that appears nowhere in its
# own unit, so this refuses to render rather than letting it happen.
# human_to_bytes normalises the suffixes; comparing "4G" to "512M" as strings
# would not.
- name: Reject a slice budget smaller than the containers it holds
  ansible.builtin.assert:
    that:
      - podman_user_limits[podman_user_service_name].slice.memory | human_to_bytes
        >= podman_user_limits[podman_user_service_name].containers.values() | map(attribute='memory') | map('human_to_bytes') | sum
      - podman_user_limits[podman_user_service_name].slice.tasks | int
        >= podman_user_limits[podman_user_service_name].containers.values() | map(attribute='tasks') | map('int') | sum
    fail_msg: "the slice budget of {{ podman_user_service_name }} is smaller than the sum of its containers"
    quiet: true
  loop: "{{ podman_user_services | list }}"
  loop_control:
    loop_var: podman_user_service_name
    label: "{{ podman_user_service_name }}"

# Writing the whole file replaces whatever it held before, including any
# subordinate range this role does not manage — such as the one Debian's
# useradd auto-allocates to a regular account. That is intended: only
# service users run rootless Podman, so only service users need one here.
- name: Write the subordinate UID ranges
  ansible.builtin.template:
    src: subid.j2
    dest: /etc/subuid
    owner: root
    group: root
    mode: "0644"
  notify: Migrate podman storage

- name: Write the subordinate GID ranges
  ansible.builtin.template:
    src: subid.j2
    dest: /etc/subgid
    owner: root
    group: root
    mode: "0644"
  notify: Migrate podman storage

- name: Configure each service user
  ansible.builtin.include_tasks: user.yml
  loop: "{{ podman_user_services | dict2items }}"
  loop_control:
    loop_var: podman_user_item
    label: "{{ podman_user_item.key }}"

# systemd_service with only daemon_reload always reports changed, which would
# fail the idempotency gate in Task 22. Gate it on the drop-ins actually moving.
- name: Reload systemd for the drop-ins
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: podman_user_dropins_changed | default(false)

- name: Start each user manager
  ansible.builtin.systemd_service:
    name: "user@{{ item.value.uid }}.service"
    state: started
  loop: "{{ podman_user_services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Wait for each user's D-Bus socket
  ansible.builtin.wait_for:
    path: "/run/user/{{ item.value.uid }}/bus"
    timeout: 30
  loop: "{{ podman_user_services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Flush handlers so a storage migration never runs after services have started
  ansible.builtin.meta: flush_handlers
