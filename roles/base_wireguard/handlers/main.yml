# A reload re-reads the network files and keeps every other link as it is;
# eth0 keeps its address. systemd-networkd itself is never stopped.
- name: Reload systemd-networkd
  ansible.builtin.command:
    cmd: networkctl reload
  register: base_wireguard_reload
  changed_when: true
  failed_when: base_wireguard_reload.rc != 0
