# The WireGuard tunnel between the hosts is retired: the edge reaches svc1
# over the tailnet. This role removes what the tunnel's role left, and stays
# for one release so that every host has run it before it is deleted. It
# reloads systemd-networkd but never stops or disables it: it also manages
# eth0.

- name: Remove the tunnel's key and network files
  ansible.builtin.file:
    path: "/etc/systemd/network/{{ item }}"
    state: absent
  loop: [wg0.key, wg0.psk, 50-wg0.netdev, 50-wg0.network]
  notify: Reload systemd-networkd

- name: Stop waiting for the tunnel at boot
  ansible.builtin.systemd_service:
    name: systemd-networkd-wait-online@wg0.service
    enabled: false

- name: Remove the peers' tunnel names from /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s\S+\.wg$'
    state: absent

- name: Remove the WireGuard tools
  ansible.builtin.apt:
    name: wireguard-tools
    state: absent

# networkd forgets the files at the reload, but a reload never deletes a
# netdev it already made, so the interface goes after it: deleting it first
# would let a reload with the files still present make it again.
- name: Reload networkd before deleting the interface
  ansible.builtin.meta: flush_handlers

- name: Read whether the tunnel interface still exists
  ansible.builtin.command:
    argv: [ip, link, show, wg0]
  register: base_wireguard_link
  changed_when: false
  failed_when: false
  check_mode: false

- name: Delete the tunnel interface
  ansible.builtin.command:
    argv: [networkctl, delete, wg0]
  register: base_wireguard_delete
  when: base_wireguard_link.rc == 0
  changed_when: true
  failed_when: base_wireguard_delete.rc != 0
