argument_specs:
  main:
    short_description: Rootless Podman Quadlet per service
    description: >
      For each service in podman_services: writes config files into the
      service user's home, creates Podman secrets, pre-pulls the pinned
      image, renders root-owned Quadlet volume and container units into
      /etc/containers/systemd/users/<uid>, reloads and verifies the user
      manager, restarts on change, and asserts the systemd cgroup manager.
    options:
      podman_service_services:
        type: dict
        required: true
        description: >
          The podman_services dictionary. Each value supports the keys
          uid (int), image (fully qualified, tag and digest), publish
          (list of host:container[/udp]), volumes (list of {name, mount}),
          mounts (list of {src, dst, ro}), tmpfs (list of strings),
          env (dict), secrets (list of {name, value, type, target}),
          config_files (list of {path, content, mode, banner}, banner
          being the format's comment marker, which prefixes the file
          with the managed header), capabilities (list),
          read_only (bool), no_new_privileges (bool), userns
          (str), network (str), health ({cmd, interval, start_period}),
          egress (any|web|platform), backup ({sqlite: {volume, path}, volumes}),
          user (str or int, container-side UID), group (str or int),
          entrypoint (str, renders Entrypoint=), exec (str, overrides the
          image command), volumes entries taking
          an optional chown boolean that makes Podman chown the volume to
          the container user, health being optional, and
          workloads (dict of name to a partial spec, each rendering an
          extra container unit under the same service user, volume and
          slice, ordered After= and PartOf= the primary unit), each
          requiring a kind of worker or job. A job requires schedule
          (renders OnCalendar=), may set jitter (renders
          RandomizedDelaySec=, default 60) and persistent (renders
          Persistent=, boolean, default false), and may not set health.
          A worker rejects schedule and persistent. A workload inherits
          every key of its parent except publish, secrets, health,
          workloads, backup, uid, egress, kind, schedule and persistent,
          and overrides any of them; env is merged with the workload
          winning, and a volume's chown is never inherited. The exclusion
          list is the contract - an enumeration of what IS inherited goes
          stale every time a key is added.
      podman_service_never_inherited:
        type: list
        elements: str
        default:
          - publish
          - secrets
          - health
          - workloads
          - backup
          - uid
          - egress
          - kind
          - schedule
          - persistent
        description: >
          Keys a workload never inherits from its parent service. This is
          the workload inheritance contract. Workloads must declare their
          own kind and job scheduling policy; the validation forbidden-key
          list intentionally does not reject those mandatory workload keys.
      podman_service_unit_root:
        type: path
        default: /etc/containers/systemd/users
      podman_service_limits:
        type: dict
        required: true
        description: >
          Resource ceilings keyed by service name, each holding a slice
          budget and a containers mapping. Every container's own entry
          carries memory, cpu, tasks and pids. Primary containers and workers
          use start_timeout as systemd TimeoutStartSec. Jobs instead require
          runtime_max, strictly shorter than their schedule interval, which
          renders as Podman's --timeout argument. Conmon enforces the bound by
          killing the container, making the unit fail and firing its failure
          notification; systemd RuntimeMaxSec is ignored for Type=oneshot and
          TimeoutStartSec does not terminate the Podman 5.4.2 container.
