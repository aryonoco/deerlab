repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: mise exec -- gitleaks protect --staged --redact
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck
        language: system
        types: [shell]
        files: \.sh$
        exclude: ^collections/

  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint
        entry: mise exec -- ansible-lint --offline
        language: system
        pass_filenames: false
        files: \.(ya?ml)$
        exclude: ^(collections/|\.github/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: (\.md$|^collections/)
      - id: end-of-file-fixer
        exclude: (^collections/|^LICENSE)
      - id: check-yaml
        exclude: ^collections/
      - id: check-json
        exclude: ^collections/
      - id: check-merge-conflict
        exclude: (^collections/|^LICENSE)
