argument_specs:
  main:
    short_description: nftables ruleset for an edge or services host
    description: >
      One templated ruleset. Default-drop input with ICMP for path MTU
      discovery and the tailnet's interface accepted, the tailnet policy
      deciding what reaches each port. The edge has public SSH, ports and
      redirects; a services host accepts SSH only from the edge. Output
      is permissive for root and gets a per-UID chain for every service
      user according to its egress class.
    options:
      base_firewall_role:
        type: str
        required: true
        choices: [edge, services]
      base_firewall_services:
        type: dict
        required: true
        description: >
          The podman_services dictionary for this host. Every entry needs an
          egress key holding one of base_firewall_egress_classes.
      base_firewall_ssh_port:
        type: int
        default: 22
      base_firewall_edge_public_v4:
        type: str
        default: ""
        description: >-
          The edge's public IPv4 address, the only source a services host
          accepts SSH from outside the tailnet. Required on a services host.
      base_firewall_tailscale_interface:
        type: str
        default: tailscale0
        description: >
          tailscaled's interface. Everything arriving on it is accepted; the
          tailnet policy decides what reaches each port.
      base_firewall_tailscale_port:
        type: int
        required: true
        description: tailscaled's UDP port, open to the internet on an edge host only.
      base_firewall_tailnet_v4:
        type: str
        default: 100.64.0.0/10
        description: Tailscale's IPv4 range, dropped when it arrives on any other interface.
      base_firewall_tailnet_v6:
        type: str
        default: fd7a:115c:a1e0::/48
        description: Tailscale's IPv6 range, dropped when it arrives on any other interface.
      base_firewall_restart_tailscaled:
        type: bool
        default: true
        description: >
          Restart tailscaled after each ruleset reload, because the reload's
          flush deletes the rules tailscaled installed.
      base_firewall_edge_tcp_redirects:
        type: dict
        description: Public port to Caddy's published port, TCP.
      base_firewall_edge_udp_redirects:
        type: dict
        description: Public port to Caddy's published port, UDP.
      base_firewall_private_v4:
        type: list
        elements: str
      base_firewall_private_v6:
        type: list
        elements: str
      base_firewall_resolvers:
        type: list
        elements: str
        description: >-
          Resolver addresses web-, platform-, mail- and public-class
          services may reach on port 53.
      base_firewall_egress_classes:
        type: list
        elements: str
        description: >
          Egress classes a service may declare. any accepts everything. web
          permits DNS, 80 and 443 outside the private ranges. platform is web
          without 80, for a service whose application makes no outbound calls
          but whose service user still pulls its image, runs restic and posts
          to Pushover. mail is platform plus 465, for an application that sends
          its own mail through a relay over implicit TLS. public is any TCP
          port outside the private ranges and the host's own addresses, for
          a service whose routes reach sites on arbitrary ports. A value outside this
          list is refused rather than rendered, because the template's fallback
          drops everything including the backup and the alert about it.
