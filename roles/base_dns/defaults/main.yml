# The operator's DNS resolver over DNS-over-TLS: its addresses, and the name
# its certificate carries. Both identify the resolver, so both live in the
# inventory's secrets.sops.yaml.
base_dns_tls_addresses: "{{ deerlab_dns_tls_addresses }}"
# The resolver reads a leading label as the device's name, so its logs name
# the host on this path as they do for lookups that come through tailscaled.
base_dns_tls_name: "{{ inventory_hostname }}-{{ deerlab_dns_tls_name }}"
# The provider's interface, configured by DHCP. Its network file is read
# from networkd on every run, so a file the provider renames is followed.
base_dns_uplink_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
# A name every pull needs: the repository's host.
base_dns_check_name: "{{ deerlab_repo_url | urlsplit('hostname') }}"
