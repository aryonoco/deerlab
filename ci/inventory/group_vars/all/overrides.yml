# The CI lab's overrides. This file sorts after main.yml, so it wins.

# Nothing in the lab may page anyone.
deerlab_pushover_url: https://pushover.invalid/1/messages.json

# The lab's minutes-old data has no Vikunja account and no encrypted Actual
# budget, so the presence query would fail every gate backup. See the backup
# role's default.
backup_presence_query_enabled: false

# The lab runs each pull by hand; a timer would race it.
base_pull_enabled: false

# A container's network namespace has none of these.
base_os_sysctl_skip:
  - net.core.bpf_jit_harden
  - net.core.rmem_max
  - net.core.wmem_max

# Run the checks marked ci or both, and page nobody.
podman_service_verify_site: ci
podman_service_verify_notify: false

# A container has no /dev/net/tun, so tailscaled runs in userspace; and the
# lab must not report to Tailscale. It is installed and never enrolled.
base_tailscale_userspace: true
base_tailscale_no_logs: true

# The lab's tailscaled is never enrolled, so the tailnet check would fail
# every run.
tailnet_check_enabled: false
