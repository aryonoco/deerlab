- name: Set the facts for {{ podman_service_item.key }}
  ansible.builtin.set_fact:
    podman_service_name: "{{ podman_service_item.key }}"
    podman_service_spec: "{{ podman_service_item.value }}"
    podman_service_uid: "{{ podman_service_item.value.uid }}"
    podman_service_home: "/var/lib/{{ podman_service_item.key }}"
    podman_service_unit_dir: "{{ podman_service_unit_root }}/{{ podman_service_item.value.uid }}"
    podman_service_env:
      XDG_RUNTIME_DIR: "/run/user/{{ podman_service_item.value.uid }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_service_item.value.uid }}/bus"
    podman_service_units: []

# ansible.builtin.copy will not create an intermediate directory, and a
# config file's path may nest (config/Caddyfile). The bind mount in the same
# service definition points at that directory, so a missing one is a start
# failure rather than a cosmetic gap. Skipped when the path is a bare
# filename: dirname is then empty and the target would be the home directory,
# which podman_user owns and keeps at 0700.
- name: Create the config directories of {{ podman_service_name }}
  ansible.builtin.file:
    path: "{{ podman_service_home }}/{{ item.path | dirname }}"
    state: directory
    owner: "{{ podman_service_name }}"
    group: "{{ podman_service_name }}"
    mode: "0750"
  loop: "{{ podman_service_spec.config_files | default([]) }}"
  loop_control:
    label: "{{ item.path | dirname }}"
  when: item.path | dirname | length > 0

# banner is the file format's comment marker, and carries the same "edit the
# repository, not this file" line every other generated file on either host
# gets. It is optional because config_files is generic: a format with no
# comment syntax cannot take one.
- name: Write the config files of {{ podman_service_name }}
  ansible.builtin.copy:
    content: |-
      {% if item.banner is defined %}{{ item.banner }} {{ deerlab_managed }}
      {% endif %}{{ item.content }}
    dest: "{{ podman_service_home }}/{{ item.path }}"
    owner: "{{ podman_service_name }}"
    group: "{{ podman_service_name }}"
    mode: "{{ item.mode | default('0640') }}"
  loop: "{{ podman_service_spec.config_files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: podman_service_config_files

- name: Create the secrets of {{ podman_service_name }}
  containers.podman.podman_secret:
    name: "{{ podman_service_name }}-{{ item.name }}"
    data: "{{ item.value }}"
    state: present
  become: true
  become_user: "{{ podman_service_name }}"
  environment: "{{ podman_service_env }}"
  loop: "{{ podman_service_spec.secrets | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  register: podman_service_secrets

- name: Check for the image of {{ podman_service_name }}
  ansible.builtin.command:
    cmd: "podman image exists {{ podman_service_spec.image }}"
  become: true
  become_user: "{{ podman_service_name }}"
  environment: "{{ podman_service_env }}"
  register: podman_service_image_exists
  changed_when: false
  failed_when: podman_service_image_exists.rc not in [0, 1]

- name: Pull the image of {{ podman_service_name }}
  ansible.builtin.command:
    cmd: "podman pull --quiet {{ podman_service_spec.image }}"
  become: true
  become_user: "{{ podman_service_name }}"
  environment: "{{ podman_service_env }}"
  when: podman_service_image_exists.rc == 1
  changed_when: true

- name: Create the unit directory of {{ podman_service_name }}
  ansible.builtin.file:
    path: "{{ podman_service_unit_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the volume units of {{ podman_service_name }}
  ansible.builtin.template:
    src: volume.j2
    dest: "{{ podman_service_unit_dir }}/{{ podman_service_name }}-{{ item.name }}.volume"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ podman_service_spec.volumes | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: podman_service_volume_units

- name: Write the primary container unit of {{ podman_service_name }}
  ansible.builtin.include_tasks: container.yml
  vars:
    podman_service_container_name: "{{ podman_service_name }}"
    podman_service_container_spec: "{{ podman_service_spec }}"
    podman_service_container_limits: "{{ podman_service_limits[podman_service_name].containers[podman_service_name] }}"
    podman_service_parent_unit: ""

# A sidecar is not a second service: it shares the user, UID, subordinate range,
# slice, egress chain and backup repository, and differs only in what it runs.
# It inherits the parent's spec and overrides what it declares. publish,
# secrets, health, backup, uid, egress and sidecars are never inherited -
# two containers cannot publish the same host port, and a queue consumer has no
# endpoint to health-check. env is merged rather than replaced, with the
# sidecar winning, because a worker needs the parent's application settings as
# well as its own.
- name: Write the sidecar container units of {{ podman_service_name }}
  ansible.builtin.include_tasks: container.yml
  loop: "{{ podman_service_spec.sidecars | default({}) | dict2items }}"
  loop_control:
    loop_var: podman_service_sidecar
    label: "{{ podman_service_sidecar.key }}"
  vars:
    podman_service_container_name: "{{ podman_service_name }}-{{ podman_service_sidecar.key }}"
    podman_service_container_limits: "{{ podman_service_limits[podman_service_name].containers[podman_service_name ~ '-' ~ podman_service_sidecar.key] }}"
    podman_service_parent_unit: "{{ podman_service_name }}.service"
    podman_service_container_spec: >-
      {{ podman_service_spec | dict2items
         | rejectattr('key', 'in', ['publish', 'secrets', 'health', 'sidecars', 'backup', 'uid', 'egress'])
         | items2dict
         | combine({'env': (podman_service_spec.env | default({}))
                           | combine(podman_service_sidecar.value.env | default({}))})
         | combine(podman_service_sidecar.value | dict2items
                   | rejectattr('key', 'equalto', 'env') | items2dict) }}

- name: Decide on a restart of {{ podman_service_name }}
  ansible.builtin.set_fact:
    podman_service_restart: >-
      {{ (podman_service_units | rejectattr('sidecar') | selectattr('changed') | list | length > 0)
         or (podman_service_volume_units.changed | default(false))
         or (podman_service_config_files.changed | default(false))
         or (podman_service_secrets.changed | default(false)) }}
    podman_service_reload: >-
      {{ (podman_service_units | selectattr('changed') | list | length > 0)
         or (podman_service_volume_units.changed | default(false))
         or (podman_service_config_files.changed | default(false))
         or (podman_service_secrets.changed | default(false)) }}

# Broader than podman_service_restart on purpose: Quadlet regenerates a
# .service unit only on a daemon-reload, so a sidecar-only change that skipped
# this would write the new .container file, leave the stale generated unit in
# place, and then restart that stale unit below. systemd-analyze verify would
# still pass, because it reads the new file directly rather than the stale
# generated one, so nothing would catch the mismatch.
- name: Reload the user manager of {{ podman_service_name }}
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ podman_service_name }}"
  environment: "{{ podman_service_env }}"
  when: podman_service_reload | bool

- name: Verify the generated units of {{ podman_service_name }}
  ansible.builtin.command:
    cmd: >-
      systemd-analyze --user --generators=true verify
      {{ podman_service_units | map(attribute='name') | map('regex_replace', '$', '.service') | join(' ') }}
  become: true
  become_user: "{{ podman_service_name }}"
  environment: "{{ podman_service_env }}"
  changed_when: false

# Restarting the primary restarts its sidecars too, because they are PartOf= it.
# So restart the primary whenever anything shared moved, and a sidecar on its
# own only when the primary is not already being restarted.
- name: Restart after a change to {{ podman_service_name }}
  ansible.builtin.systemd_service:
    name: "{{ podman_service_name }}.service"
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_service_name }}"
  environment: "{{ podman_service_env }}"
  when: podman_service_restart | bool

- name: Restart the changed sidecars of {{ podman_service_name }}
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.service"
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_service_name }}"
  environment: "{{ podman_service_env }}"
  loop: "{{ podman_service_units | selectattr('sidecar') | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (podman_service_restart | bool)

- name: Ensure the running state of {{ podman_service_name }}
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.service"
    state: started
    scope: user
  become: true
  become_user: "{{ podman_service_name }}"
  environment: "{{ podman_service_env }}"
  loop: "{{ podman_service_units }}"
  loop_control:
    label: "{{ item.name }}"

# A pure read: it changes nothing, so it may run under check mode too, and the
# assertion below needs its output to have something to parse during a dry run.
- name: Read the Podman runtime facts of {{ podman_service_name }}
  ansible.builtin.command:
    cmd: podman info --format json
  become: true
  become_user: "{{ podman_service_name }}"
  environment: "{{ podman_service_env }}"
  register: podman_service_info
  changed_when: false
  check_mode: false

# Defensive, not a working fresh-host path: this only stops the assertion from
# parsing an empty string if the probe above is ever skipped. On a configured
# host the conditions below still apply in full.
- name: Assert the systemd cgroup manager and native overlay for {{ podman_service_name }}
  ansible.builtin.assert:
    that:
      - (podman_service_info.stdout | from_json).host.cgroupManager == 'systemd'
      - (podman_service_info.stdout | from_json).store.graphDriverName == 'overlay'
    fail_msg: "{{ podman_service_name }} fell back to cgroupfs or a non-overlay driver; check DBUS_SESSION_BUS_ADDRESS and dbus-user-session"
    quiet: true
  when: podman_service_info.stdout | default('') | length > 0
