base_firewall_role: edge

# The jump host: every other machine is reached through it, by Ansible and
# by `just ssh`, which needs sshd to allow TCP forwarding.
base_ssh_allow_tcp_forwarding: true

# The tag the edge's one-off auth key carries; the tailnet policy grants by it.
base_tailscale_tag: tag:edge

# QUIC wants larger UDP buffers than Debian's default; raising them here
# means Caddy does not need CAP_NET_ADMIN to do it itself.
base_os_sysctl_extra:
  net.core.rmem_max: 7500000
  net.core.wmem_max: 7500000

# Empty selects Caddy's default CA, which is the production one. Point it at a
# staging directory URL while proving a new edge: staging's failure limits are
# far higher, so a wrong DNS record or an unreachable port 80 costs nothing.
caddy_acme_ca: ""

# True only in the CI lab, where Caddy's internal CA issues at once and no
# public CA is ever asked.
caddy_local_certs: false

# From edge1 a request to its own public address leaves by lo, which never
# meets the firewall's 443 redirect, so its checks use Caddy's own port.
podman_service_verify_edge_port: 8443

caddy_caddyfile: |
  {
      admin off
      email {{ deerlab_acme_email }}
      {{ ('acme_ca ' ~ caddy_acme_ca) if caddy_acme_ca else '' }}
  {% if caddy_local_certs %}
      local_certs
  {% endif %}
      servers {
          protocols h1 h2 h3
      }
      log default {
          output stderr
          # Caddy's error lines carry a failed request's headers, so a 5xx on
          # the budget site would record Actual's X-Actual-Token session token
          # there. The site's own log filter covers only its access log;
          # other sites never send the header. Error lines carry the request
          # URI too, and RSSHub's access key rides in its query string, so
          # query strings go from every site's error lines. Mealie's iCal
          # feed and share links carry theirs in the path, and a 502 while
          # svc1 restarts would log one, so those paths go too, as in the
          # Mealie site's own access log.
          format filter {
              request>headers>X-Actual-Token delete
              request>uri regexp ^/api/households/mealplans/ical/[^/?]+ /api/households/mealplans/ical/REDACTED
              request>uri regexp /shared/r/[^/?]+ /shared/r/REDACTED
              request>uri regexp ^/api/recipes/shared/[^/?]+ /api/recipes/shared/REDACTED
              request>uri regexp [?].*$ ?REDACTED
              request>headers>Referer regexp /shared/r/[^/?]+ /shared/r/REDACTED
              request>headers>Referer regexp [?].*$ ?REDACTED
              wrap json
          }
      }
  }

  # The files directory's reader account, as two snippets the files and
  # upload sites use, from a file of Caddy's record written with no log and
  # no diff (caddy_dufs_reader, below), so the credential is in neither this
  # file nor its diff. A snippet is defined before the sites import it.
  import /etc/caddy/dufs-reader.caddy

  # Internal health listener, never published.
  :8081 {
      respond /healthz 200
  }

  # Every backend but the speed test's is on svc1, reached over the tailnet by
  # its MagicDNS name.
  # tcp4: Actual listens on IPv4 only, and no backend has been reached over
  # IPv6. resolvers: the container's own server is pasta's forwarder, which
  # base_firewall steers to Caddy's listener on the DNS forwarder, whose
  # resolver knows nothing of the tailnet. Asking quad-100 directly keeps
  # svc1's name off it, and works while the forwarder is down.

  wallabag.{{ deerlab_domain }} {
      log {
          output stdout
          format json
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8080 {
          transport http {
              resolvers 100.100.100.100
          }
          health_uri /login
          health_interval 15s
          health_timeout 5s
          health_status 200
          lb_try_duration 30s
      }
  }

  linkding.{{ deerlab_domain }} {
      log {
          output stdout
          format json
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8081 {
          transport http {
              resolvers 100.100.100.100
          }
          # /health calls ensure_connection(), so an unhealthy backend is one
          # whose database is unreachable - not merely one whose socket closed.
          health_uri /health
          health_interval 15s
          health_timeout 5s
          health_status 200
          # Long enough to cover the services host restarting the backend.
          # Without it an edge reboot serves "503 no upstreams available" until
          # the first passive probe lands.
          lb_try_duration 30s
      }
  }

  baikal.{{ deerlab_domain }} {
      log {
          output stdout
          format json
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8082 {
          transport http {
              resolvers 100.100.100.100
          }
          # Exactly 401, not 2xx. Every Baikal failure mode - unwritable config,
          # missing database, unwritable database directory - answers 200 with
          # an exception page, so a conventional check reports a dead server as
          # healthy.
          health_uri /dav.php
          health_status 401
          health_interval 15s
          health_timeout 5s
          # Long enough to cover the services host restarting the backend.
          lb_try_duration 30s
      }
  }

  freshrss.{{ deerlab_domain }} {
      log {
          output stdout
          format json
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8083 {
          transport http {
              resolvers 100.100.100.100
          }
          # Liveness only, and deliberately so - unlike linkding's /health and
          # baikal's exact-401, this proves nothing about the database.
          # p/api/index.php calls initSystem() and never queries it, so /api/
          # answers 200 over a destroyed database. No cheap endpoint exists
          # that does better; see the runbook.
          health_uri /api/
          health_interval 15s
          health_timeout 5s
          health_status 200
          # Long enough to cover the services host restarting the backend.
          lb_try_duration 30s
      }
  }

  {{ vikunja_hostname }} {
      log {
          output stdout
          format json
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8084 {
          transport http {
              resolvers 100.100.100.100
          }
          # Liveness only. /health opens a session and pings the database,
          # which on SQLite succeeds on any open handle: a deleted or empty
          # database answers 200. See the runbook.
          health_uri /health
          health_interval 15s
          health_timeout 5s
          health_status 200
          # Long enough to cover the services host restarting the backend.
          lb_try_duration 30s
      }
  }

  {{ actual_hostname }} {
      log {
          output stdout
          # Actual sends its session token in a custom X-Actual-Token
          # header, which Caddy does not redact the way it redacts Cookie
          # and Authorization. Every device shares that one token and it
          # never expires, so it stays out of the journal; the default
          # logger in the global options drops it from error lines too.
          format filter {
              request>headers>X-Actual-Token delete
              wrap json
          }
      }
      # Refused while unused: /openid/config tests passwords for anyone, and
      # /metrics shows memory and uptime without a login. Either may be
      # wanted later; delete a path from this matcher to re-enable it.
      # A trailing * also catches the path with a trailing slash, which
      # the server answers too.
      # /account/bootstrap: the password is set, and whoever calls it first
      # on an emptied store would own the server. Set it from the host
      # instead (runbook, Actual).
      @refused path /openid/* /metrics* /account/bootstrap*
      respond @refused 404
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8085 {
          transport http {
              resolvers 100.100.100.100
          }
          # Reads the auth table through the server's open database handle,
          # so a file deleted under a running server answers until a
          # restart; the container probe opens the file afresh.
          health_uri /account/needs-bootstrap
          health_interval 15s
          health_timeout 5s
          health_status 200
          # Long enough to cover the services host restarting the backend.
          lb_try_duration 30s
      }
  }

  # The name is the operator's, from SOPS, and the first such value in a site
  # address: one Caddy cannot load (empty, a path, a space, capitals) would
  # fail its whole configuration at its next start, every site with it. So
  # anything but a plain lower-case hostname fails the pull before Caddy's
  # files are written, with Caddy still serving.
  {{ mealie_hostname
     if (mealie_hostname | string) is regex('[a-z0-9]([a-z0-9-]*[a-z0-9])?([.][a-z0-9]([a-z0-9-]*[a-z0-9])?)+', match_type='fullmatch')
     else undef(hint='mealie_hostname is not a plain lower-case hostname') }} {
      log {
          output stdout
          # Mealie's secrets ride in URLs: the household's iCal feed and each
          # shared recipe in the path, invites, password resets and downloads
          # in the query. Each regexp redacts one form, in order; the Referer
          # carries a share path or a query on to the next request, and a
          # redirect's Location carries the token on: Mealie answers an invite
          # link, /register?token=, with a 307 to /register/?token=. Unanchored
          # there, because Caddy's own http-to-https redirect is absolute.
          format filter {
              request>uri regexp ^/api/households/mealplans/ical/[^/?]+ /api/households/mealplans/ical/REDACTED
              request>uri regexp /shared/r/[^/?]+ /shared/r/REDACTED
              request>uri regexp ^/api/recipes/shared/[^/?]+ /api/recipes/shared/REDACTED
              request>uri regexp [?].*$ ?REDACTED
              request>headers>Referer regexp /shared/r/[^/?]+ /shared/r/REDACTED
              request>headers>Referer regexp [?].*$ ?REDACTED
              resp_headers>Location regexp /api/households/mealplans/ical/[^/?]+ /api/households/mealplans/ical/REDACTED
              resp_headers>Location regexp /shared/r/[^/?]+ /shared/r/REDACTED
              resp_headers>Location regexp /api/recipes/shared/[^/?]+ /api/recipes/shared/REDACTED
              resp_headers>Location regexp [?].*$ ?REDACTED
              wrap json
          }
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8087 {
          transport http {
              resolvers 100.100.100.100
          }
          # A lookup in household_preferences that must find nothing: Mealie
          # answers 404 "Calendar not found" only when its database answers.
          # It reads through the server's open handle, so a file deleted
          # under a running server answers until a restart; the container
          # probe opens the file afresh.
          health_uri /api/households/mealplans/ical/deerlab-health
          health_status 404
          health_body "Calendar not found"
          health_interval 15s
          health_timeout 5s
          # Long enough to cover the services host restarting the backend.
          lb_try_duration 30s
      }
  }

  rsshub.{{ deerlab_domain }} {
      log {
          output stdout
          # RSSHub's access key rides in the query string (?key=), and Caddy
          # logs query strings. A regexp, not the query filter: the query
          # filter logs a URI it cannot parse unchanged. The whole query goes.
          format filter {
              request>uri regexp [?].*$ ?REDACTED
              request>headers>Referer regexp [?].*$ ?REDACTED
              resp_headers>Location regexp [?].*$ ?REDACTED
              wrap json
          }
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8086 {
          transport http {
              resolvers 100.100.100.100
          }
          # RSSHub builds absolute URLs from its own socket, so its 301s say
          # http://; a reader that saved one would send the key in clear.
          header_down Location ^http:// https://
          # Exempt from the key, and 200 only with DISALLOW_ROBOT; liveness
          # only, like the container probe.
          health_uri /robots.txt
          health_interval 15s
          health_timeout 5s
          health_status 200
          lb_try_duration 30s
      }
  }

  # The speed test's backend is on the edge itself, at pasta's address for
  # the host: the test measures the link to this machine.
  speedtest.{{ deerlab_domain }} {
      # HTTP/1.1, as for the files directory's upload site. Over HTTP/2 Caddy
      # gives each connection one fixed 1 MiB upload window, which held uploads
      # to a fraction of the link, and HTTP/3 cost several times the CPU and was
      # the slowest at every round-trip time. ALPN covers TLS; a browser learns
      # of QUIC from the Alt-Svc header Caddy puts on every response before any
      # handler runs. It is set to clear here, at once: a deletion is deferred
      # to the responses the handlers write, and misses the 401 Caddy itself
      # sends before the login, a browser's first answer. clear also drops an h3
      # a browser learned earlier. A DNS HTTPS record advertising h3 would undo
      # it: the name's record is a plain A/AAAA.
      tls {
          alpn http/1.1
      }
      header Alt-Svc clear
      log {
          output stdout
          # Caddy logs the username of an authenticated request as user_id,
          # and every chunk of a test is one.
          format filter {
              user_id delete
              wrap json
          }
      }
      # The login, in a file of its own so that neither the username nor the
      # hash is in this file, its diff or the Quadlet.
      import /etc/caddy/librespeed-auth.caddy
      # Writes a fake result on every request and shows database errors.
      @refused path /results/sanitycheck.php*
      respond @refused 404
      reverse_proxy 169.254.1.2:8082 {
          # LibreSpeed records the first of these it finds as the client's
          # address, trusting any sender, so anyone past the login could set
          # the address of their result.
          header_up -Client-IP
          header_up -CF-Connecting-IPv6
          header_up X-Real-IP {remote_host}
          # The browser resends the login on every request, and nothing behind
          # Caddy reads it: the stats page has a password of its own. So the
          # edge password stops here.
          header_up -Authorization
          # Liveness only: nothing on this port proves the database without a
          # login or a write. The image's own probe does, on 8081, which stays
          # unpublished.
          health_uri /backend/empty.php
          health_interval 15s
          health_timeout 5s
          health_status 200
          lb_try_duration 30s
      }
  }

  # The files directory, for visitors: a file by its exact URL and nothing
  # else, served by dufs on svc1. dufs lists a folder at its URL with or
  # without the slash and never redirects, so URL rules alone cannot refuse
  # every listing; the reply check in reverse_proxy does.
  files.{{ deerlab_domain }} {
      log {
          output stdout
          format json
      }
      # nosniff deferred, so dufs's own pages, which send it, carry it once.
      header {
          X-Robots-Tag noindex
          >X-Content-Type-Options nosniff
      }
      # Caddy's own answers, with dufs down too: every method but GET and HEAD
      # (PROPFIND lists names, sizes and dates); any query string, since
      # dufs's search, zip, JSON and render modes all ride on one, so a file
      # URL with a query 404s as well; every path ending in a slash, the root
      # included; and a dotfile or dot-folder anywhere in the path, matched on
      # Caddy's decoded, cleaned path, so the %2e forms are caught.
      @notread not method GET HEAD
      respond @notread 404
      @query expression {http.request.uri.query} != ""
      respond @query 404
      @folder path */
      respond @folder 404
      @dot path_regexp (^|/)\.
      respond @dot 404
      # Uploaded active content runs sandboxed, never with this origin.
      # Matched on the response's type, one type per line.
      header {
          match {
              header Content-Type text/html*
              header Content-Type application/xhtml+xml*
              header Content-Type image/svg+xml*
              header Content-Type text/xml*
              header Content-Type application/xml*
              header Content-Type *+xml*
              header Content-Type text/mathml*
          }
          Content-Security-Policy sandbox
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8089 {
          transport http {
              resolvers 100.100.100.100
          }
          # Every visitor is served as dufs's read-only reader, whatever
          # Authorization they send.
          import dufs_reader_up
          # The reply check. dufs puts Content-Disposition: inline on every
          # file it serves and attachment on a zip; a listing, a search, JSON,
          # PROPFIND, OPTIONS, its UI and its errors carry none. Each of those
          # becomes Caddy's own empty 404, so a folder and a missing path look
          # alike. A 304, which dufs answers before it sets the header, is left
          # alone. This rests on a dufs convention, not a setting: dufs's
          # edge-folder-hidden check, at every dufs start, fails if a
          # release starts sending the header on a listing.
          @listing {
              status 2xx 4xx 5xx
              header !Content-Disposition
          }
          handle_response @listing {
              respond 404
          }
          @archive header Content-Disposition attachment*
          handle_response @archive {
              respond 404
          }
          # Active checks go straight to dufs, past the reader and the reply
          # check; dufs answers its health URL without an account.
          health_uri /__dufs__/health
          health_interval 15s
          health_timeout 5s
          health_status 200
          lb_try_duration 30s
      }
  }

  # The operator's login to the files directory: uploads, deletes, search
  # and WebDAV.
  upload.{{ deerlab_domain }} {
      # HTTP/1.1 only, as for the speed test (see its comment): HTTP/2 holds
      # uploads to one fixed window per connection, and 0-RTT could replay a
      # write. ALPN alone does not stop QUIC, hence the 421 below.
      tls {
          alpn http/1.1
      }
      header Alt-Svc clear
      header {
          X-Robots-Tag noindex
          >X-Content-Type-Options nosniff
      }
      log {
          output stdout
          # dufs's download buttons put a 3-day share token in the query
          # string (?token=), which opens that path to whoever holds it, and
          # Caddy logs query strings. A regexp, as for RSSHub: the whole
          # query goes.
          format filter {
              request>uri regexp [?].*$ ?REDACTED
              request>headers>Referer regexp [?].*$ ?REDACTED
              wrap json
          }
      }
      # The per-upload cap. An upload over it whose size is announced gets 413
      # at once; one sent without a size is cut at 1 GiB, and dufs keeps the
      # partial file.
      request_body {
          max_size 1GiB
      }
      # The operator's uploaded active content downloads instead of running
      # with the login. dufs's own pages still render at a folder URL with
      # its slash and in its editor and viewer; a folder URL without the
      # slash, as dufs builds its breadcrumb links, downloads instead.
      @uploaded {
          not path */
          not query edit=*
          not query view=*
      }
      header @uploaded {
          match {
              header Content-Type text/html*
              header Content-Type application/xhtml+xml*
              header Content-Type image/svg+xml*
              header Content-Type text/xml*
              header Content-Type application/xml*
              header Content-Type *+xml*
              header Content-Type text/mathml*
          }
          Content-Disposition attachment
      }
      # In this order.
      route {
          @h3 protocol http/3
          respond @h3 421
          # An authenticated DELETE or MOVE of the root would wipe or move the
          # whole share. Caddy cleans the path first, so //, /%2e and /sub/..
          # are caught; a folder below the root can still be deleted.
          @root {
              method DELETE MOVE
              path /
          }
          respond @root 403
          # The reader's exact credential, which the files site sends for
          # visitors, never logs in here; nor does any Digest header: dufs
          # offers only Basic, but would accept Digest for the plaintext
          # reader.
          import dufs_reader_refuse
          @digest header Authorization "Digest *"
          header @reader WWW-Authenticate "Basic realm=\"DUFS\""
          respond @reader 401
          header @digest WWW-Authenticate "Basic realm=\"DUFS\""
          respond @digest 401
          # The gate: a request without credentials never reaches dufs; one
          # with credentials passes to dufs, which checks them, except that
          # for a GET it takes a valid share token (?token=) first and then
          # ignores the credentials. The realm is dufs's own.
          @anonymous not header Authorization *
          header @anonymous WWW-Authenticate "Basic realm=\"DUFS\""
          respond @anonymous 401
          reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8089 {
              transport http {
                  resolvers 100.100.100.100
              }
              health_uri /__dufs__/health
              health_interval 15s
              health_timeout 5s
              health_status 200
              lb_try_duration 30s
          }
      }
  }

# The speed test's login, imported by its site block from a file of Caddy's
# record that is written with no log and no diff. bcrypt at cost 10, not
# Caddy's default 14: a wrong password always costs a full hash, and at 14
# forty concurrent guesses held Caddy's whole CPU quota and slowed another
# site. The password's length is the protection, not the cost.
#
# A value Caddy cannot load (empty, a placeholder, a hash neither $-prefixed
# nor base64, a username that breaks the Caddyfile) fails its whole
# configuration at its next start, every site with it. So this refuses
# anything but a plain username and a bcrypt hash at cost 10, and the pull
# fails before Caddy's files are written, with Caddy still serving.
# A damaged hash of the right shape loads, and refuses every login.
caddy_librespeed_auth: |
  basic_auth bcrypt {
      {{ librespeed_auth_user
         if (librespeed_auth_user | string) is regex('[A-Za-z0-9._-]+', match_type='fullmatch')
         else undef(hint='librespeed_auth_user is not letters, digits, dots, hyphens and underscores') }} {{
         librespeed_auth_hash
         if (librespeed_auth_hash | string) is regex('[$]2[aby][$]10[$][./A-Za-z0-9]{53}', match_type='fullmatch')
         else undef(hint='librespeed_auth_hash is not a bcrypt hash at cost 10') }}
  }

# The files directory's reader account, for the two dufs sites above. The
# files site sends it for every visitor, since dufs has no anonymous rule,
# and the upload site refuses it, so it never logs in there. It is dufs's
# dufs_reader_password, read from svc1's secrets, in a file of Caddy's
# record written with no log and no diff. It is held to svc1's rule, so
# the edge never sends a placeholder or a weak password on visitors'
# behalf: a placeholder or a password that is not at least 32 letters and
# digits fails the pull before any service's secret, unit or volume is
# written, naming the rule. Base64 keeps any value inside the Caddyfile's
# syntax.
caddy_dufs_reader_basic: >-
  {{ ('reader:' ~ (undef(hint='dufs_reader_password is still the CHANGE-ME placeholder')
      if (hostvars['svc1']['dufs_reader_password'] | string) == 'CHANGE-ME'
      else hostvars['svc1']['dufs_reader_password']
      if (hostvars['svc1']['dufs_reader_password'] | string) is regex('[A-Za-z0-9]{32,}', match_type='fullmatch')
      else undef(hint='dufs_reader_password is not at least 32 letters and digits')))
     | b64encode }}
caddy_dufs_reader: |
  (dufs_reader_up) {
      header_up Authorization "Basic {{ caddy_dufs_reader_basic }}"
  }

  (dufs_reader_refuse) {
      @reader header Authorization "Basic {{ caddy_dufs_reader_basic }}"
  }

# HAProxy's configuration for syncthing-edge-haproxy, the forwarder that
# carries off-tailnet Syncthing devices from public TCP 22000 to Syncthing's
# sync port on svc1 over the tailnet. TCP only. Measured in labs on this
# image with this text, except the resolver and the backend, which were the
# labs' own:
# - on a Docker network: its own resolver at quad-100 for svc1's MagicDNS
#   name, with init-addr none, starts and stays healthy while the name does
#   not resolve, and resolves it at run time with no server check; per
#   source, the 25th concurrent and the 61st new connection in a minute are
#   refused at once; an IPv6 client reaches svc1, keyed by its /64;
# - under rootless Podman 5.4.2 with pasta, as edge1 runs it: a healthy idle
#   device stays connected, and HAProxy sees each device's own address.
#   pasta ends the device's TCP connection in front of HAProxy, so no TCP
#   setting here can tell that a device vanished without closing: the hub
#   lets go of it only at Syncthing's own timeout, after 300 s and 431 s in two runs, and
#   refuses the device's new connection as already connected until then.
# The frontend takes at most 256 connections and the process 512, and the
# health frontend listens on loopback and does not log.
syncthing_edge_haproxy_config: |
  global
      log stdout format raw local0 info
      nbthread 2
      maxconn 512
  defaults
      mode tcp
      log global
      timeout connect 5s
      timeout client 10m
      timeout server 10m
      timeout client-fin 30s
      timeout server-fin 30s
  resolvers tailnet
      nameserver quad100 100.100.100.100:53
      accepted_payload_size 1232
      hold valid 30s
      timeout resolve 30s
  frontend sync
      bind :::22000 v4v6
      maxconn 256
      option tcplog
      stick-table type ipv6 size 10k expire 10m store conn_rate(1m),conn_cur
      tcp-request connection track-sc0 src,ipmask(32,64)
      tcp-request connection reject if { sc0_conn_rate gt 60 }
      tcp-request connection reject if { sc0_conn_cur gt 24 }
      default_backend syncthing
  backend syncthing
      server svc1 {{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8088 resolvers tailnet resolve-prefer ipv4 init-addr none
  frontend health
      bind 127.0.0.1:8405
      mode http
      no log
      monitor-uri /healthz

# The firewall's redirects on the edge, restated whole because inventory
# replaces the role's default rather than merging it: Caddy's 80 and 443,
# and public TCP 22000 to the Syncthing forwarder's 8083.
base_firewall_edge_tcp_redirects:
  80: 8080
  443: 8443
  22000: 8083

# The DNS forwarder's uid on this host (podman_hosts/main.yml).
deerlab_dnsdist_uid: 2001

# Caddy and the Syncthing forwarder ask tailscaled for svc1's MagicDNS name
# themselves (Caddy's upstreams' resolvers in the Caddyfile above, the
# forwarder's resolvers section), so that name never reaches the operator's
# DNS resolver; every other lookup of theirs goes through its listener.
base_firewall_dns_tailnet_services: [caddy, syncthing-edge-haproxy]

podman_services:
  dnsdist: "{{ deerlab_dnsdist_service }}"
  caddy:
    uid: 2000
    image: docker.io/library/caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    # Host ports 80 and 443 are redirected to these by the firewall.
    publish:
      - "8080:80"
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - { name: data, mount: /data }
    mounts:
      - { src: /var/lib/caddy/config, dst: /etc/caddy, ro: true }
    tmpfs:
      - "/tmp:rw,nosuid,nodev,noexec,size=64m"
      - "/config:rw,nosuid,nodev,noexec,size=16m"
    env:
      TZ: Etc/UTC
    config_files:
      - { path: config/Caddyfile, content: "{{ caddy_caddyfile }}", mode: "0640", banner: "#" }
      - { path: config/librespeed-auth.caddy, content: "{{ caddy_librespeed_auth }}", mode: "0640", banner: "#", sensitive: true }
      - { path: config/dufs-reader.caddy, content: "{{ caddy_dufs_reader }}", mode: "0640", banner: "#", sensitive: true }
    # The official binary carries a file capability and will not exec with
    # everything dropped. NET_BIND_SERVICE is confined to Caddy's namespace.
    capabilities:
      - CAP_NET_BIND_SERVICE
    read_only: true
    no_new_privileges: true
    health:
      cmd: wget -q -O /dev/null http://127.0.0.1:8081/healthz
      interval: 30s
      start_period: 30s
    # What a pull proves once Caddy has started. The site- checks reach each
    # backend through TLS and the tailnet, with its Caddyfile health_uri and
    # health_status; host only, because the CI lab's upstreams are stand-ins.
    # The refusals, the redirect and the log redaction are Caddy's own, so
    # they run in the lab too.
    checks:
      - name: site-wallabag
        where: host
        via: edge
        host: "wallabag.{{ deerlab_domain }}"
        path: /login
        timeout: 10
      - name: site-linkding
        where: host
        via: edge
        host: "linkding.{{ deerlab_domain }}"
        path: /health
        timeout: 10
      - name: site-baikal
        where: host
        via: edge
        host: "baikal.{{ deerlab_domain }}"
        path: /dav.php
        status: [401]
        timeout: 10
      - name: site-freshrss
        where: host
        via: edge
        host: "freshrss.{{ deerlab_domain }}"
        path: /api/
        timeout: 10
      - name: site-vikunja
        where: host
        via: edge
        host: "{{ vikunja_hostname }}"
        path: /health
        timeout: 10
      - name: site-actual
        where: host
        via: edge
        host: "{{ actual_hostname }}"
        path: /account/needs-bootstrap
        timeout: 10
      - name: site-rsshub
        where: host
        via: edge
        host: "rsshub.{{ deerlab_domain }}"
        path: /robots.txt
        timeout: 10
      - name: site-mealie
        where: host
        via: edge
        host: "{{ mealie_hostname }}"
        path: /api/households/mealplans/ical/deerlab-health
        status: [404]
        timeout: 10
      - name: refused-metrics
        via: edge
        host: "{{ actual_hostname }}"
        path: /metrics
        status: [404]
      - name: refused-openid
        via: edge
        host: "{{ actual_hostname }}"
        path: /openid/config
        status: [404]
      - name: refused-bootstrap
        via: edge
        host: "{{ actual_hostname }}"
        path: /account/bootstrap
        status: [404]
      # The speed test's login is Caddy's: a request without credentials
      # gets 401. That proves the site is loaded, its certificate served and
      # its login on.
      - name: login-speedtest
        via: edge
        host: "speedtest.{{ deerlab_domain }}"
        path: /
        status: [401]
      # The files directory. The root, a dotfile, the upload site's gate and
      # its root guard are Caddy's own answers, so they run in the lab too. A
      # folder without its slash and the kept file need dufs and run when
      # Caddy starts: the first fails if dufs sends Content-Disposition on a
      # listing, the second proves the whole path to svc1. At a dufs start,
      # dufs's own edge-folder-hidden asks for the folder. None sends a
      # credential.
      - name: files-root-hidden
        via: edge
        host: "files.{{ deerlab_domain }}"
        path: /
        status: [404]
      - name: files-dotfile-hidden
        via: edge
        host: "files.{{ deerlab_domain }}"
        path: /.deerlab-check
        status: [404]
      - name: files-folder-hidden
        where: host
        via: edge
        host: "files.{{ deerlab_domain }}"
        path: /deerlab-check
        status: [404]
      - name: files-file-served
        where: host
        via: edge
        host: "files.{{ deerlab_domain }}"
        path: /deerlab-check/ok.txt
      - name: upload-login
        via: edge
        host: "upload.{{ deerlab_domain }}"
        path: /
        status: [401]
      - name: upload-root-guard
        via: edge
        host: "upload.{{ deerlab_domain }}"
        method: DELETE
        path: /
        status: [403]
      - name: http-redirect
        path: /
        headers: { Host: "wallabag.{{ deerlab_domain }}" }
        status: [308]
      # RSSHub's key rides in the query string, which the site's log must
      # drop. 403 is RSSHub refusing the keyless request; 502 or 503 an
      # upstream Caddy cannot reach, as in the CI lab. site-rsshub, not this,
      # proves RSSHub answers.
      - name: redact-query
        type: log
        timeout: 45
        send:
          via: edge
          host: "rsshub.{{ deerlab_domain }}"
          path: /deerlab-log-__MARKER__
          query: { deerlab-sentinel: __SENTINEL__ }
          status: [403, 502, 503]
      # Actual's session token rides in X-Actual-Token, which the site's log
      # must drop; Caddy itself refuses /metrics.
      - name: redact-token
        type: log
        send:
          via: edge
          host: "{{ actual_hostname }}"
          path: /metrics/deerlab-log-__MARKER__
          headers: { X-Actual-Token: __SENTINEL__ }
          status: [404]
      # Mealie's tokens ride in URLs, which the site's log must redact; a log
      # check carries its sentinel in the query, so the path redactions are
      # proven only at build time. 200 or 404 is Mealie answering, 502 or
      # 503 an upstream Caddy cannot reach, as in the CI lab.
      - name: redact-mealie
        type: log
        timeout: 45
        send:
          via: edge
          host: "{{ mealie_hostname }}"
          path: /deerlab-log-__MARKER__
          query: { token: __SENTINEL__ }
          status: [200, 404, 502, 503]
      # Its lookups reach the operator's DNS resolver under its own name: the
      # resolver's test endpoint answers with the name of the device that
      # looked it up, and only to a curl User-Agent. The body also holds the
      # resolver's profile and the host's address, which no_log keeps out.
      - name: dns-name
        type: exec
        where: host
        timeout: 10
        cmd: [wget, -U, curl/8, -T, "8", -qO-, "{{ deerlab_dns_test_url }}"]
        stdout_regex: '"deviceName":\s*"caddy"'
    egress: any
    backup:
      volumes: [data]

  # The operator's speed test. On the edge, not svc1, because it measures the
  # link to the edge: on svc1 every byte would also cross the tailnet hop.
  librespeed:
    uid: 2002
    image: ghcr.io/divbast/librespeed:6.3.1@sha256:6c7dca384c51af2b8b78e44cb97bdca846b730aee7b925235dbdd3a395da9eae
    # The image's own nonroot user, pinned rather than inherited, as Baikal's.
    # The image has no shell and runs FrankenPHP directly, configured at each
    # start by the environment below; nothing is mounted into it.
    user: 65532
    group: 65532
    publish:
      # Container side 8080: a non-root container uid cannot bind below 1024.
      # Caddy reaches host port 8082 at 169.254.1.2, pasta's address for the
      # host. The firewall opens no port for it to the internet, so past
      # Caddy only the host and the tailnet reach it. 8081, the image's health
      # listener, is deliberately not published.
      - "8082:8080"
    volumes:
      # The volume the old image wrote, now at the image's /data. :U is
      # required: the old files are owned by that image's uid 100, and this
      # one refuses to start on a /data it cannot write. Podman re-owns
      # everything at each start, the old db.sqlite included, which this
      # image never opens and which stays for a rollback (docs/runbook.md,
      # LibreSpeed).
      - { name: data, mount: /data, chown: true }
    tmpfs:
      # The configuration the image writes at every start, and PHP's
      # sessions. Uploads never land here: PHP reads no body over 8 KiB.
      - "/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777"
    env:
      # Quoted: the template writes each value as a string, so a YAML boolean
      # would reach the image as True, which it refuses.
      TELEMETRY: "true"
      # The address Caddy's connections arrive from inside the container. The
      # stats login then counts failures per client, from the X-Forwarded-For
      # Caddy sets, rather than one count for everyone. The address stored
      # with a result still comes from the X-Real-IP the edge sets.
      TRUSTED_PROXIES: 169.254.1.2
      # FrankenPHP starts two PHP threads per CPU Go sees, and Go sees the
      # host's CPUs, not the unit's CPUQuota. On a large host that runs past
      # pids: 64 and the probe can no longer start. Four gives eight threads,
      # enough for one test's six download streams, at about 30 pids on any
      # host. Processes podman exec starts in the container inherit it too.
      GOMAXPROCS: "4"
    secrets:
      # At most 72 bytes, or the image refuses to start: bcrypt reads no more.
      # The image keeps only the password's bcrypt hash, in /data.
      - { name: stats-password, value: "{{ librespeed_stats_password }}", type: env, target: STATS_PASSWORD }
    capabilities: []
    read_only: true
    no_new_privileges: true
    # No stop_signal: on Podman's SIGTERM FrankenPHP exits 0 when idle. A
    # request still open 30 s later is killed, exit 137, which pages, and no
    # stop setting avoids that without also hiding a crash (docs/runbook.md,
    # Alerts).
    health:
      # The image's own probe: PHP's settings, the ISP database, the results
      # database opened read-only, and getIP.php's answer. A JSON array with
      # no leading "CMD": the image has no shell, and Podman reads no health
      # check from it, so the command is given here in full.
      cmd: '["/usr/local/bin/frankenphp","php-cli","/usr/local/bin/librespeed-health"]'
      interval: 30s
      start_period: 60s
    # What a pull proves once LibreSpeed has started. None of it logs in,
    # sends a password or writes a result.
    checks:
      # PHP answers, and the ISP database bundled in the image loads. A public
      # address, the regional registry's own, stands in for a client's: the
      # server believes X-Real-IP on this direct path (Caddy overwrites it at
      # the edge), and has nothing to look up for a private one.
      - name: getip
        path: /backend/getIP.php
        query: { isp: "true" }
        headers: { X-Real-IP: 193.0.6.139 }
        body_regex: '"processedString":"193\.0\.6\.139 - [^"]+, [^"]+"'
      # The results table is there. The database is opened read-only, so the
      # check never creates the file: upstream's own database code would
      # re-create a deleted telemetry.db, empty, and hide the loss from the
      # image's probe.
      - name: database
        type: exec
        cmd:
          - /usr/local/bin/frankenphp
          - php-cli
          - -r
          - >-
            $p = new PDO("sqlite:/data/telemetry.db", null, null, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
            Pdo\Sqlite::ATTR_OPEN_FLAGS => Pdo\Sqlite::OPEN_READONLY]);
            echo $p->query("SELECT count(*) FROM sqlite_master WHERE type = 'table' AND name = 'speedtest_users'")->fetchColumn() === 1
            ? "table-ok" : "no-table", "\n";
        stdout_regex: ^table-ok$
      # The stats page shows its login form: neither open, nor gone, as it is
      # when the image has no password.
      - name: stats-locked
        path: /results/stats.php
        body_regex: name="password"
      # Its lookups reach the resolver under its own name, as Caddy's do. The
      # image has no wget, and its PHP can open no URL, so this fetches over a
      # bare TLS socket, which verifies the certificate. It follows the
      # resolver's redirect: the test address answers a first request with a
      # 302 to a fresh name, and the lookup of that name is what this proves.
      - name: dns-name
        type: exec
        where: host
        timeout: 10
        cmd:
          - /usr/local/bin/frankenphp
          - php-cli
          - -r
          - >-
            $u = $argv[1]; for ($i = 0; $i < 3; $i++) { $p = parse_url($u);
            $s = @stream_socket_client("tls://" . $p["host"] . ":443", $e, $m, 8); if (!$s) { fwrite(STDERR, "connect: $m\n"); exit(1); }
            fwrite($s, "GET " . ($p["path"] ?? "/") . (isset($p["query"]) ? "?" . $p["query"] : "")
            . " HTTP/1.0\r\nHost: " . $p["host"] . "\r\nUser-Agent: curl/8\r\n\r\n");
            $r = stream_get_contents($s); $x = explode("\r\n\r\n", $r, 2);
            if (preg_match("/^Location:\s*(https:\S+)/mi", $x[0], $l)) { $u = $l[1]; continue; }
            echo $x[1] ?? ""; exit(0); } exit(1);
          - "{{ deerlab_dns_test_url }}"
        stdout_regex: '"deviceName":\s*"librespeed"'
    # The image opens no connection out; image pulls, restic and Pushover
    # need 443 alone.
    egress: platform
    backup:
      # One file with a rollback journal. count(*) > 0, not >= 0: the image
      # creates the table, empty, whenever it starts without one, so only a
      # row shows the database is the one that holds the history. The old
      # db.sqlite, unchanged since the switch, and stats-login.db, the stats
      # login's failure count, go in the volume copy alone: an entry for
      # stats-login.db would fail its test -s until the stats login was
      # first used, and the backup before every image switch with it.
      sqlite:
        - { volume: data, path: telemetry.db, presence_query: "SELECT count(*) > 0 FROM speedtest_users" }
      volumes: [data]

  # The forwarder for Syncthing devices off the tailnet: public TCP 22000,
  # redirected here by the firewall, to Syncthing's sync port on svc1 over the
  # tailnet. Not reached through Caddy: Syncthing's own TLS runs end to end,
  # and HAProxy only passes the bytes.
  syncthing-edge-haproxy:
    uid: 2003
    # Docker Hub's official image, digest-pinned.
    image: docker.io/library/haproxy:3.4.7-alpine@sha256:b9fe316f718d5015c5cfebd8ca019591f3e44656f61d93cb8b59a1028961e530
    # The image's own haproxy user, pinned numerically (measured: 99:99), so
    # an image that changed it cannot run as another uid unnoticed.
    user: 99
    group: 99
    publish:
      - "8083:22000"
    config_files:
      # 0644: uid 99 cannot read a group-restricted file.
      - { path: config/haproxy.cfg, content: "{{ syncthing_edge_haproxy_config }}", mode: "0644", banner: "#" }
    # The file, not its directory: config_files makes the directory 0750 for
    # the service user, which is namespace root, so uid 99 could not enter it.
    mounts:
      - { src: /var/lib/syncthing-edge-haproxy/config/haproxy.cfg, dst: /usr/local/etc/haproxy/haproxy.cfg, ro: true }
    # Nothing added back: it ran confined with no capability and binds no
    # port below 1024.
    capabilities: []
    read_only: true
    no_new_privileges: true
    # The image stops with SIGUSR1, which waits for every connection to close;
    # Syncthing's never do, so the stop is killed at 30 s with exit 137, which
    # pages. On SIGTERM it stopped in 0.16 s with a device connected, exit 0.
    stop_signal: SIGTERM
    health:
      # The loopback-only monitor frontend in the config.
      cmd: wget -q -O /dev/null http://127.0.0.1:8405/healthz
      interval: 30s
      start_period: 60s
    # 443 to public addresses for the image, and one tailnet port, svc1's
    # Syncthing sync port, which the tailnet policy lets the edge reach.
    egress: platform-tailnet
    egress_tailnet_port: 8088
    checks:
      # The path from inside the forwarder: its own listener, HAProxy,
      # quad-100, the egress class, the tailnet, svc1's published port and
      # Syncthing's TLS. The image's own socat prints
      # Syncthing's certificate subject. Host only: the CI lab has no svc1.
      - name: passthrough
        type: exec
        where: host
        timeout: 10
        cmd: [sh, -c, 'socat -d -d -d -u OPENSSL:127.0.0.1:22000,verify=0 /dev/null 2>&1']
        stdout_regex: 'SSL peer cert subject: "O = Syncthing.*CN = syncthing'
      # Its lookups reach the resolver under its own name (as Caddy's).
      - name: dns-name
        type: exec
        where: host
        timeout: 10
        cmd: [wget, -U, curl/8, -T, "8", -qO-, "{{ deerlab_dns_test_url }}"]
        stdout_regex: '"deviceName":\s*"syncthing-edge-haproxy"'
