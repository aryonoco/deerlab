base_firewall_role: edge

# The jump host: every other machine is reached through it, by Ansible and
# by `just ssh`, which needs sshd to allow TCP forwarding.
base_ssh_allow_tcp_forwarding: true

# The tag the edge's one-off auth key carries; the tailnet policy grants by it.
base_tailscale_tag: tag:edge

# QUIC wants larger UDP buffers than Debian's default; raising them here
# means Caddy does not need CAP_NET_ADMIN to do it itself.
base_os_sysctl_extra:
  net.core.rmem_max: 7500000
  net.core.wmem_max: 7500000

# Empty selects Caddy's default CA, which is the production one. Point it at a
# staging directory URL while proving a new edge: staging's failure limits are
# far higher, so a wrong DNS record or an unreachable port 80 costs nothing.
caddy_acme_ca: ""

# True only in the CI lab, where Caddy's internal CA issues at once and no
# public CA is ever asked.
caddy_local_certs: false

# From edge1 a request to its own public address leaves by lo, which never
# meets the firewall's 443 redirect, so its checks use Caddy's own port.
podman_service_verify_edge_port: 8443

caddy_caddyfile: |
  {
      admin off
      email {{ deerlab_acme_email }}
      {{ ('acme_ca ' ~ caddy_acme_ca) if caddy_acme_ca else '' }}
  {% if caddy_local_certs %}
      local_certs
  {% endif %}
      servers {
          protocols h1 h2 h3
      }
      log default {
          output stderr
          # Caddy's error lines carry a failed request's headers, so a 5xx on
          # the budget site would record Actual's X-Actual-Token session token
          # there. The site's own log filter covers only its access log;
          # other sites never send the header. Error lines carry the request
          # URI too, and RSSHub's access key rides in its query string, so
          # query strings go from every site's error lines. Mealie's iCal
          # feed and share links carry theirs in the path, and a 502 while
          # svc1 restarts would log one, so those paths go too, as in the
          # Mealie site's own access log.
          format filter {
              request>headers>X-Actual-Token delete
              request>uri regexp ^/api/households/mealplans/ical/[^/?]+ /api/households/mealplans/ical/REDACTED
              request>uri regexp /shared/r/[^/?]+ /shared/r/REDACTED
              request>uri regexp ^/api/recipes/shared/[^/?]+ /api/recipes/shared/REDACTED
              request>uri regexp [?].*$ ?REDACTED
              request>headers>Referer regexp /shared/r/[^/?]+ /shared/r/REDACTED
              request>headers>Referer regexp [?].*$ ?REDACTED
              wrap json
          }
      }
  }

  # Internal health listener, never published.
  :8081 {
      respond /healthz 200
  }

  # Every backend but the speed test's is on svc1, reached over the tailnet by
  # its MagicDNS name.
  # tcp4: Actual listens on IPv4 only, and no backend has been reached over
  # IPv6. resolvers: the container's own server is pasta's forwarder, which
  # base_firewall steers to Caddy's listener on the DNS forwarder, whose
  # resolver knows nothing of the tailnet. Asking quad-100 directly keeps
  # svc1's name off it, and works while the forwarder is down.

  wallabag.{{ deerlab_domain }} {
      log {
          output stdout
          format json
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8080 {
          transport http {
              resolvers 100.100.100.100
          }
          health_uri /login
          health_interval 15s
          health_timeout 5s
          health_status 200
          lb_try_duration 30s
      }
  }

  linkding.{{ deerlab_domain }} {
      log {
          output stdout
          format json
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8081 {
          transport http {
              resolvers 100.100.100.100
          }
          # /health calls ensure_connection(), so an unhealthy backend is one
          # whose database is unreachable - not merely one whose socket closed.
          health_uri /health
          health_interval 15s
          health_timeout 5s
          health_status 200
          # Long enough to cover the services host restarting the backend.
          # Without it an edge reboot serves "503 no upstreams available" until
          # the first passive probe lands.
          lb_try_duration 30s
      }
  }

  baikal.{{ deerlab_domain }} {
      log {
          output stdout
          format json
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8082 {
          transport http {
              resolvers 100.100.100.100
          }
          # Exactly 401, not 2xx. Every Baikal failure mode - unwritable config,
          # missing database, unwritable database directory - answers 200 with
          # an exception page, so a conventional check reports a dead server as
          # healthy.
          health_uri /dav.php
          health_status 401
          health_interval 15s
          health_timeout 5s
          # Long enough to cover the services host restarting the backend.
          lb_try_duration 30s
      }
  }

  freshrss.{{ deerlab_domain }} {
      log {
          output stdout
          format json
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8083 {
          transport http {
              resolvers 100.100.100.100
          }
          # Liveness only, and deliberately so - unlike linkding's /health and
          # baikal's exact-401, this proves nothing about the database.
          # p/api/index.php calls initSystem() and never queries it, so /api/
          # answers 200 over a destroyed database. No cheap endpoint exists
          # that does better; see the runbook.
          health_uri /api/
          health_interval 15s
          health_timeout 5s
          health_status 200
          # Long enough to cover the services host restarting the backend.
          lb_try_duration 30s
      }
  }

  {{ vikunja_hostname }} {
      log {
          output stdout
          format json
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8084 {
          transport http {
              resolvers 100.100.100.100
          }
          # Liveness only. /health opens a session and pings the database,
          # which on SQLite succeeds on any open handle: a deleted or empty
          # database answers 200. See the runbook.
          health_uri /health
          health_interval 15s
          health_timeout 5s
          health_status 200
          # Long enough to cover the services host restarting the backend.
          lb_try_duration 30s
      }
  }

  {{ actual_hostname }} {
      log {
          output stdout
          # Actual sends its session token in a custom X-Actual-Token
          # header, which Caddy does not redact the way it redacts Cookie
          # and Authorization. Every device shares that one token and it
          # never expires, so it stays out of the journal; the default
          # logger in the global options drops it from error lines too.
          format filter {
              request>headers>X-Actual-Token delete
              wrap json
          }
      }
      # Refused while unused: /openid/config tests passwords for anyone, and
      # /metrics shows memory and uptime without a login. Either may be
      # wanted later; delete a path from this matcher to re-enable it.
      # A trailing * also catches the path with a trailing slash, which
      # the server answers too.
      # /account/bootstrap: the password is set, and whoever calls it first
      # on an emptied store would own the server. Set it from the host
      # instead (runbook, Actual).
      @refused path /openid/* /metrics* /account/bootstrap*
      respond @refused 404
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8085 {
          transport http {
              resolvers 100.100.100.100
          }
          # Reads the auth table through the server's open database handle,
          # so a file deleted under a running server answers until a
          # restart; the container probe opens the file afresh.
          health_uri /account/needs-bootstrap
          health_interval 15s
          health_timeout 5s
          health_status 200
          # Long enough to cover the services host restarting the backend.
          lb_try_duration 30s
      }
  }

  # The name is the operator's, from SOPS, and the first such value in a site
  # address: one Caddy cannot load (empty, a path, a space, capitals) would
  # fail its whole configuration at its next start, every site with it. So
  # anything but a plain lower-case hostname fails the pull before Caddy's
  # files are written, with Caddy still serving.
  {{ mealie_hostname
     if (mealie_hostname | string) is regex('[a-z0-9]([a-z0-9-]*[a-z0-9])?([.][a-z0-9]([a-z0-9-]*[a-z0-9])?)+', match_type='fullmatch')
     else undef(hint='mealie_hostname is not a plain lower-case hostname') }} {
      log {
          output stdout
          # Mealie's secrets ride in URLs: the household's iCal feed and each
          # shared recipe in the path, invites, password resets and downloads
          # in the query. Each regexp redacts one form, in order; the Referer
          # carries a share path or a query on to the next request, and a
          # redirect's Location carries the token on: Mealie answers an invite
          # link, /register?token=, with a 307 to /register/?token=. Unanchored
          # there, because Caddy's own http-to-https redirect is absolute.
          format filter {
              request>uri regexp ^/api/households/mealplans/ical/[^/?]+ /api/households/mealplans/ical/REDACTED
              request>uri regexp /shared/r/[^/?]+ /shared/r/REDACTED
              request>uri regexp ^/api/recipes/shared/[^/?]+ /api/recipes/shared/REDACTED
              request>uri regexp [?].*$ ?REDACTED
              request>headers>Referer regexp /shared/r/[^/?]+ /shared/r/REDACTED
              request>headers>Referer regexp [?].*$ ?REDACTED
              resp_headers>Location regexp /api/households/mealplans/ical/[^/?]+ /api/households/mealplans/ical/REDACTED
              resp_headers>Location regexp /shared/r/[^/?]+ /shared/r/REDACTED
              resp_headers>Location regexp /api/recipes/shared/[^/?]+ /api/recipes/shared/REDACTED
              resp_headers>Location regexp [?].*$ ?REDACTED
              wrap json
          }
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8087 {
          transport http {
              resolvers 100.100.100.100
          }
          # A lookup in household_preferences that must find nothing: Mealie
          # answers 404 "Calendar not found" only when its database answers.
          # It reads through the server's open handle, so a file deleted
          # under a running server answers until a restart; the container
          # probe opens the file afresh.
          health_uri /api/households/mealplans/ical/deerlab-health
          health_status 404
          health_body "Calendar not found"
          health_interval 15s
          health_timeout 5s
          # Long enough to cover the services host restarting the backend.
          lb_try_duration 30s
      }
  }

  rsshub.{{ deerlab_domain }} {
      log {
          output stdout
          # RSSHub's access key rides in the query string (?key=), and Caddy
          # logs query strings. A regexp, not the query filter: the query
          # filter logs a URI it cannot parse unchanged. The whole query goes.
          format filter {
              request>uri regexp [?].*$ ?REDACTED
              request>headers>Referer regexp [?].*$ ?REDACTED
              resp_headers>Location regexp [?].*$ ?REDACTED
              wrap json
          }
      }
      reverse_proxy tcp4/{{ hostvars['svc1']['deerlab_tailnet_fqdn'] }}:8086 {
          transport http {
              resolvers 100.100.100.100
          }
          # RSSHub builds absolute URLs from its own socket, so its 301s say
          # http://; a reader that saved one would send the key in clear.
          header_down Location ^http:// https://
          # Exempt from the key, and 200 only with DISALLOW_ROBOT; liveness
          # only, like the container probe.
          health_uri /robots.txt
          health_interval 15s
          health_timeout 5s
          health_status 200
          lb_try_duration 30s
      }
  }

  # The speed test's backend is on the edge itself, at pasta's address for
  # the host: the test measures the link to this machine.
  speedtest.{{ deerlab_domain }} {
      # HTTP/1.1 for this site alone. Over HTTP/2 Caddy gives each connection
      # one fixed 1 MiB upload window, which held uploads to a fraction of
      # the link, and HTTP/3 cost several times the CPU and was the slowest
      # at every round-trip time. ALPN covers TLS; a browser learns of QUIC
      # from the Alt-Svc header Caddy puts on every response before any
      # handler runs. It is set to clear here, at once: a deletion is
      # deferred to the responses the handlers write, and misses the 401
      # Caddy itself sends before the login, a browser's first answer. clear
      # also drops an h3 a browser learned earlier. A DNS HTTPS record
      # advertising h3 would undo it: the name's record is a plain A/AAAA.
      tls {
          alpn http/1.1
      }
      header Alt-Svc clear
      log {
          output stdout
          # Caddy logs the username of an authenticated request as user_id,
          # and every chunk of a test is one.
          format filter {
              user_id delete
              wrap json
          }
      }
      # The login, in a file of its own so that neither the username nor the
      # hash is in this file, its diff or the Quadlet.
      import /etc/caddy/librespeed-auth.caddy
      # Writes a fake result on every request and shows database errors.
      @refused path /results/sanitycheck.php*
      respond @refused 404
      reverse_proxy 169.254.1.2:8082 {
          # LibreSpeed records the first of these it finds as the client's
          # address, trusting any sender, so anyone past the login could set
          # the address of their result.
          header_up -Client-IP
          header_up -CF-Connecting-IPv6
          header_up X-Real-IP {remote_host}
          # Liveness only: no endpoint proves the database without a login or
          # a write.
          health_uri /backend/empty.php
          health_interval 15s
          health_timeout 5s
          health_status 200
          lb_try_duration 30s
      }
  }

# The speed test's login, imported by its site block from a file of Caddy's
# record that is written with no log and no diff. bcrypt at cost 10, not
# Caddy's default 14: a wrong password always costs a full hash, and at 14
# forty concurrent guesses held Caddy's whole CPU quota and slowed another
# site. The password's length is the protection, not the cost.
#
# A value Caddy cannot load (empty, a placeholder, a hash neither $-prefixed
# nor base64, a username that breaks the Caddyfile) fails its whole
# configuration at its next start, every site with it. So this refuses
# anything but a plain username and a bcrypt hash at cost 10, and the pull
# fails before Caddy's files are written, with Caddy still serving.
# A damaged hash of the right shape loads, and refuses every login.
caddy_librespeed_auth: |
  basic_auth bcrypt {
      {{ librespeed_auth_user
         if (librespeed_auth_user | string) is regex('[A-Za-z0-9._-]+', match_type='fullmatch')
         else undef(hint='librespeed_auth_user is not letters, digits, dots, hyphens and underscores') }} {{
         librespeed_auth_hash
         if (librespeed_auth_hash | string) is regex('[$]2[aby][$]10[$][./A-Za-z0-9]{53}', match_type='fullmatch')
         else undef(hint='librespeed_auth_hash is not a bcrypt hash at cost 10') }}
  }

# LibreSpeed's vendored configuration. Apache starts directly from these, in
# place of upstream's start script, which rewrites /etc/apache2 and the web
# root and chowns them, so it cannot run on a read-only root, and which sets
# secrets into PHP source with an unescaped sed. Each file is mounted beside
# the image's own copy, never over it, so the built-in upstream- checks read
# the image's file and catch a drifted copy. Re-diff all three on every bump.
#
# A faithful copy of /etc/apache2/httpd.conf at the pinned tag, with the edits
# listed under upstream: in the record. Listen 8080: a non-root container uid
# cannot bind port 80. DocumentRoot /speedtest: the image's application tree,
# served in place. The two logs: logs/ is /var/log/apache2, which uid 100
# cannot open, and the journal is where every other service's log goes.
librespeed_httpd_conf: |
  #
  # This is the main Apache HTTP server configuration file.  It contains the
  # configuration directives that give the server its instructions.
  # See <URL:http://httpd.apache.org/docs/2.4/> for detailed information.
  # In particular, see
  # <URL:http://httpd.apache.org/docs/2.4/mod/directives.html>
  # for a discussion of each configuration directive.
  #
  # Do NOT simply read the instructions in here without understanding
  # what they do.  They're here only as hints or reminders.  If you are unsure
  # consult the online docs. You have been warned.
  #
  # Configuration and logfile names: If the filenames you specify for many
  # of the server's control files begin with "/" (or "drive:/" for Win32), the
  # server will use that explicit path.  If the filenames do *not* begin
  # with "/", the value of ServerRoot is prepended -- so "logs/access_log"
  # with ServerRoot set to "/usr/local/apache2" will be interpreted by the
  # server as "/usr/local/apache2/logs/access_log", whereas "/logs/access_log"
  # will be interpreted as '/logs/access_log'.

  #
  # ServerTokens
  # This directive configures what you return as the Server HTTP response
  # Header. The default is 'Full' which sends information about the OS-Type
  # and compiled in modules.
  # Set to one of:  Full | OS | Minor | Minimal | Major | Prod
  # where Full conveys the most information, and Prod the least.
  #
  ServerTokens OS

  #
  # ServerRoot: The top of the directory tree under which the server's
  # configuration, error, and log files are kept.
  #
  # Do not add a slash at the end of the directory path.  If you point
  # ServerRoot at a non-local disk, be sure to specify a local disk on the
  # Mutex directive, if file-based mutexes are used.  If you wish to share the
  # same ServerRoot for multiple httpd daemons, you will need to change at
  # least PidFile.
  #
  ServerRoot /var/www

  #
  # Mutex: Allows you to set the mutex mechanism and mutex file directory
  # for individual mutexes, or change the global defaults
  #
  # Uncomment and change the directory if mutexes are file-based and the default
  # mutex file directory is not on a local disk or is not appropriate for some
  # other reason.
  #
  # Mutex default:/run/apache2

  #
  # Listen: Allows you to bind Apache to specific IP addresses and/or
  # ports, instead of the default. See also the <VirtualHost>
  # directive.
  #
  # Change this to Listen on specific IP addresses as shown below to
  # prevent Apache from glomming onto all bound IP addresses.
  #
  #Listen 12.34.56.78:80
  Listen 8080

  #
  # Dynamic Shared Object (DSO) Support
  #
  # To be able to use the functionality of a module which was built as a DSO you
  # have to place corresponding `LoadModule' lines at this location so the
  # directives contained in it are actually available _before_ they are used.
  # Statically compiled modules (those listed by `httpd -l') do not need
  # to be loaded here.
  #
  # Example:
  # LoadModule foo_module modules/mod_foo.so
  #
  #LoadModule mpm_event_module modules/mod_mpm_event.so
  LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
  #LoadModule mpm_worker_module modules/mod_mpm_worker.so
  LoadModule authn_file_module modules/mod_authn_file.so
  #LoadModule authn_dbm_module modules/mod_authn_dbm.so
  #LoadModule authn_anon_module modules/mod_authn_anon.so
  #LoadModule authn_dbd_module modules/mod_authn_dbd.so
  #LoadModule authn_socache_module modules/mod_authn_socache.so
  LoadModule authn_core_module modules/mod_authn_core.so
  LoadModule authz_host_module modules/mod_authz_host.so
  LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
  LoadModule authz_user_module modules/mod_authz_user.so
  #LoadModule authz_dbm_module modules/mod_authz_dbm.so
  #LoadModule authz_owner_module modules/mod_authz_owner.so
  #LoadModule authz_dbd_module modules/mod_authz_dbd.so
  LoadModule authz_core_module modules/mod_authz_core.so
  LoadModule access_compat_module modules/mod_access_compat.so
  LoadModule auth_basic_module modules/mod_auth_basic.so
  #LoadModule auth_form_module modules/mod_auth_form.so
  #LoadModule auth_digest_module modules/mod_auth_digest.so
  #LoadModule allowmethods_module modules/mod_allowmethods.so
  #LoadModule file_cache_module modules/mod_file_cache.so
  #LoadModule cache_module modules/mod_cache.so
  #LoadModule cache_disk_module modules/mod_cache_disk.so
  #LoadModule cache_socache_module modules/mod_cache_socache.so
  #LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
  #LoadModule socache_dbm_module modules/mod_socache_dbm.so
  #LoadModule socache_memcache_module modules/mod_socache_memcache.so
  #LoadModule socache_redis_module modules/mod_socache_redis.so
  #LoadModule watchdog_module modules/mod_watchdog.so
  #LoadModule macro_module modules/mod_macro.so
  #LoadModule dbd_module modules/mod_dbd.so
  #LoadModule dumpio_module modules/mod_dumpio.so
  #LoadModule echo_module modules/mod_echo.so
  #LoadModule buffer_module modules/mod_buffer.so
  #LoadModule data_module modules/mod_data.so
  #LoadModule ratelimit_module modules/mod_ratelimit.so
  LoadModule reqtimeout_module modules/mod_reqtimeout.so
  #LoadModule ext_filter_module modules/mod_ext_filter.so
  #LoadModule request_module modules/mod_request.so
  #LoadModule include_module modules/mod_include.so
  LoadModule filter_module modules/mod_filter.so
  #LoadModule reflector_module modules/mod_reflector.so
  #LoadModule substitute_module modules/mod_substitute.so
  #LoadModule sed_module modules/mod_sed.so
  #LoadModule charset_lite_module modules/mod_charset_lite.so
  #LoadModule deflate_module modules/mod_deflate.so
  #LoadModule brotli_module modules/mod_brotli.so
  LoadModule mime_module modules/mod_mime.so
  LoadModule log_config_module modules/mod_log_config.so
  #LoadModule log_debug_module modules/mod_log_debug.so
  #LoadModule log_forensic_module modules/mod_log_forensic.so
  #LoadModule logio_module modules/mod_logio.so
  LoadModule env_module modules/mod_env.so
  #LoadModule mime_magic_module modules/mod_mime_magic.so
  #LoadModule expires_module modules/mod_expires.so
  LoadModule headers_module modules/mod_headers.so
  #LoadModule usertrack_module modules/mod_usertrack.so
  #LoadModule unique_id_module modules/mod_unique_id.so
  LoadModule setenvif_module modules/mod_setenvif.so
  LoadModule version_module modules/mod_version.so
  #LoadModule remoteip_module modules/mod_remoteip.so
  #LoadModule session_module modules/mod_session.so
  #LoadModule session_cookie_module modules/mod_session_cookie.so
  #LoadModule session_crypto_module modules/mod_session_crypto.so
  #LoadModule session_dbd_module modules/mod_session_dbd.so
  #LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
  #LoadModule slotmem_plain_module modules/mod_slotmem_plain.so
  #LoadModule dialup_module modules/mod_dialup.so
  #LoadModule http2_module modules/mod_http2.so
  LoadModule unixd_module modules/mod_unixd.so
  #LoadModule heartbeat_module modules/mod_heartbeat.so
  #LoadModule heartmonitor_module modules/mod_heartmonitor.so
  LoadModule status_module modules/mod_status.so
  LoadModule autoindex_module modules/mod_autoindex.so
  #LoadModule asis_module modules/mod_asis.so
  #LoadModule info_module modules/mod_info.so
  #LoadModule suexec_module modules/mod_suexec.so
  <IfModule !mpm_prefork_module>
  	#LoadModule cgid_module modules/mod_cgid.so
  </IfModule>
  <IfModule mpm_prefork_module>
  	#LoadModule cgi_module modules/mod_cgi.so
  </IfModule>
  #LoadModule vhost_alias_module modules/mod_vhost_alias.so
  #LoadModule negotiation_module modules/mod_negotiation.so
  LoadModule dir_module modules/mod_dir.so
  #LoadModule actions_module modules/mod_actions.so
  #LoadModule speling_module modules/mod_speling.so
  #LoadModule userdir_module modules/mod_userdir.so
  LoadModule alias_module modules/mod_alias.so
  #LoadModule rewrite_module modules/mod_rewrite.so

  LoadModule negotiation_module modules/mod_negotiation.so

  <IfModule unixd_module>
  #
  # If you wish httpd to run as a different user or group, you must run
  # httpd as root initially and it will switch.
  #
  # User/Group: The name (or #number) of the user/group to run httpd as.
  # It is usually good practice to create a dedicated user and group for
  # running httpd, as with most system services.
  #
  User apache
  Group apache

  </IfModule>

  # 'Main' server configuration
  #
  # The directives in this section set up the values used by the 'main'
  # server, which responds to any requests that aren't handled by a
  # <VirtualHost> definition.  These values also provide defaults for
  # any <VirtualHost> containers you may define later in the file.
  #
  # All of these directives may appear inside <VirtualHost> containers,
  # in which case these default settings will be overridden for the
  # virtual host being defined.
  #

  #
  # ServerAdmin: Your address, where problems with the server should be
  # e-mailed.  This address appears on some server-generated pages, such
  # as error documents.  e.g. admin@your-domain.com
  #
  ServerAdmin you@example.com

  #
  # Optionally add a line containing the server version and virtual host
  # name to server-generated pages (internal error documents, FTP directory
  # listings, mod_status and mod_info output etc., but not CGI generated
  # documents or custom error documents).
  # Set to "EMail" to also include a mailto: link to the ServerAdmin.
  # Set to one of:  On | Off | EMail
  #
  ServerSignature On

  #
  # ServerName gives the name and port that the server uses to identify itself.
  # This can often be determined automatically, but we recommend you specify
  # it explicitly to prevent problems during startup.
  #
  # If your host doesn't have a registered DNS name, enter its IP address here.
  #
  #ServerName www.example.com:80

  #
  # Deny access to the entirety of your server's filesystem. You must
  # explicitly permit access to web content directories in other
  # <Directory> blocks below.
  #
  <Directory />
      AllowOverride none
      Require all denied
  </Directory>

  #
  # Note that from this point forward you must specifically allow
  # particular features to be enabled - so if something's not working as
  # you might expect, make sure that you have specifically enabled it
  # below.
  #

  #
  # DocumentRoot: The directory out of which you will serve your
  # documents. By default, all requests are taken from this directory, but
  # symbolic links and aliases may be used to point to other locations.
  #
  DocumentRoot "/speedtest"
  <Directory "/speedtest">
      #
      # Possible values for the Options directive are "None", "All",
      # or any combination of:
      #   Indexes Includes FollowSymLinks SymLinksifOwnerMatch ExecCGI MultiViews
      #
      # Note that "MultiViews" must be named *explicitly* --- "Options All"
      # doesn't give it to you.
      #
      # The Options directive is both complicated and important.  Please see
      # http://httpd.apache.org/docs/2.4/mod/core.html#options
      # for more information.
      #
      Options Indexes FollowSymLinks

      #
      # AllowOverride controls what directives may be placed in .htaccess files.
      # It can be "All", "None", or any combination of the keywords:
      #   AllowOverride FileInfo AuthConfig Limit
      #
      AllowOverride None

      #
      # Controls who can get stuff from this server.
      #
      Require all granted
  </Directory>

  #
  # DirectoryIndex: sets the file that Apache will serve if a directory
  # is requested.
  #
  <IfModule dir_module>
      DirectoryIndex index.html
  </IfModule>

  #
  # The following lines prevent .htaccess and .htpasswd files from being
  # viewed by Web clients.
  #
  <Files ".ht*">
      Require all denied
  </Files>

  #
  # ErrorLog: The location of the error log file.
  # If you do not specify an ErrorLog directive within a <VirtualHost>
  # container, error messages relating to that virtual host will be
  # logged here.  If you *do* define an error logfile for a <VirtualHost>
  # container, that host's errors will be logged there and not here.
  #
  ErrorLog /dev/stderr

  #
  # LogLevel: Control the number of messages logged to the error_log.
  # Possible values include: debug, info, notice, warn, error, crit,
  # alert, emerg.
  #
  LogLevel warn

  <IfModule log_config_module>
      #
      # The following directives define some format nicknames for use with
      # a CustomLog directive (see below).
      #
      LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
      LogFormat "%h %l %u %t \"%r\" %>s %b" common

      <IfModule logio_module>
        # You need to enable mod_logio.c to use %I and %O
        LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
      </IfModule>

      #
      # The location and format of the access logfile (Common Logfile Format).
      # If you do not define any access logfiles within a <VirtualHost>
      # container, they will be logged here.  Contrariwise, if you *do*
      # define per-<VirtualHost> access logfiles, transactions will be
      # logged therein and *not* in this file.
      #
      #CustomLog logs/access.log common

      #
      # If you prefer a logfile with access, agent, and referer information
      # (Combined Logfile Format) you can use the following directive.
      #
      CustomLog /dev/stdout combined
  </IfModule>

  <IfModule alias_module>
      #
      # Redirect: Allows you to tell clients about documents that used to
      # exist in your server's namespace, but do not anymore. The client
      # will make a new request for the document at its new location.
      # Example:
      # Redirect permanent /foo http://www.example.com/bar

      #
      # Alias: Maps web paths into filesystem paths and is used to
      # access content that does not live under the DocumentRoot.
      # Example:
      # Alias /webpath /full/filesystem/path
      #
      # If you include a trailing / on /webpath then the server will
      # require it to be present in the URL.  You will also likely
      # need to provide a <Directory> section to allow access to
      # the filesystem path.

      #
      # ScriptAlias: This controls which directories contain server scripts.
      # ScriptAliases are essentially the same as Aliases, except that
      # documents in the target directory are treated as applications and
      # run by the server when requested rather than as documents sent to the
      # client.  The same rules about trailing "/" apply to ScriptAlias
      # directives as to Alias.
      #
      ScriptAlias /cgi-bin/ "/var/www/localhost/cgi-bin/"

  </IfModule>

  <IfModule cgid_module>
      #
      # ScriptSock: On threaded servers, designate the path to the UNIX
      # socket used to communicate with the CGI daemon of mod_cgid.
      #
      #Scriptsock cgisock
  </IfModule>

  #
  # "/var/www/localhost/cgi-bin" should be changed to whatever your ScriptAliased
  # CGI directory exists, if you have that configured.
  #
  <Directory "/var/www/localhost/cgi-bin">
      AllowOverride None
      Options None
      Require all granted
  </Directory>

  <IfModule headers_module>
      #
      # Avoid passing HTTP_PROXY environment to CGI's on this or any proxied
      # backend servers which have lingering "httpoxy" defects.
      # 'Proxy' request header is undefined by the IETF, not listed by IANA
      #
      RequestHeader unset Proxy early
  </IfModule>

  <IfModule mime_module>
      #
      # TypesConfig points to the file containing the list of mappings from
      # filename extension to MIME-type.
      #
      TypesConfig /etc/apache2/mime.types

      #
      # AddType allows you to add to or override the MIME configuration
      # file specified in TypesConfig for specific file types.
      #
      #AddType application/x-gzip .tgz
      #
      # AddEncoding allows you to have certain browsers uncompress
      # information on the fly. Note: Not all browsers support this.
      #
      #AddEncoding x-compress .Z
      #AddEncoding x-gzip .gz .tgz
      #
      # If the AddEncoding directives above are commented-out, then you
      # probably should define those extensions to indicate media types:
      #
      AddType application/x-compress .Z
      AddType application/x-gzip .gz .tgz

      #
      # AddHandler allows you to map certain file extensions to "handlers":
      # actions unrelated to filetype. These can be either built into the server
      # or added with the Action directive (see below)
      #
      # To use CGI scripts outside of ScriptAliased directories:
      # (You will also need to add "ExecCGI" to the "Options" directive.)
      #
      #AddHandler cgi-script .cgi

      # For type maps (negotiated resources):
      #AddHandler type-map var

      #
      # Filters allow you to process content before it is sent to the client.
      #
      # To parse .shtml files for server-side includes (SSI):
      # (You will also need to add "Includes" to the "Options" directive.)
      #
      #AddType text/html .shtml
      #AddOutputFilter INCLUDES .shtml
  </IfModule>

  #
  # The mod_mime_magic module allows the server to use various hints from the
  # contents of the file itself to determine its type.  The MIMEMagicFile
  # directive tells the module where the hint definitions are located.
  #
  <IfModule mime_magic_module>
      MIMEMagicFile /etc/apache2/magic
  </IfModule>

  #
  # Customizable error responses come in three flavors:
  # 1) plain text 2) local redirects 3) external redirects
  #
  # Some examples:
  #ErrorDocument 500 "The server made a boo boo."
  #ErrorDocument 404 /missing.html
  #ErrorDocument 404 "/cgi-bin/missing_handler.pl"
  #ErrorDocument 402 http://www.example.com/subscription_info.html
  #

  #
  # MaxRanges: Maximum number of Ranges in a request before
  # returning the entire resource, or one of the special
  # values 'default', 'none' or 'unlimited'.
  # Default setting is to accept 200 Ranges.
  #MaxRanges unlimited

  #
  # EnableMMAP and EnableSendfile: On systems that support it,
  # memory-mapping or the sendfile syscall may be used to deliver
  # files.  This usually improves server performance, but must
  # be turned off when serving from networked-mounted
  # filesystems or if support for these functions is otherwise
  # broken on your system.
  # Defaults: EnableMMAP On, EnableSendfile Off
  #
  #EnableMMAP off
  #EnableSendfile on

  # Load config files from the config directory "/etc/apache2/conf.d".
  #
  IncludeOptional /etc/apache2/conf.d/*.conf

# A faithful copy of /speedtest/results/telemetry_settings.php at the pinned
# tag, with two edits. The stats password comes from the environment, a Podman
# secret, so this file holds no secret; when it is missing or empty the page
# disables itself, which the stats-locked check catches, rather than staying
# locked with no way in. The database sits on the volume, named db.sqlite so
# that just restore-drill finds it.
librespeed_telemetry_settings: |
  <?php

  // Type of db: "mssql", "mysql", "sqlite" or "postgresql"
  $db_type = 'sqlite';
  // Password to login to stats.php. Change this!!!
  $stats_password = getenv('LIBRESPEED_STATS_PASSWORD') ?: 'PASSWORD';
  // If set to true, test IDs will be obfuscated to prevent users from guessing URLs of other tests
  $enable_id_obfuscation = false;
  // If set to true, IP addresses will be redacted from IP and ISP info fields, as well as the log
  $redact_ip_addresses = false;

  // Sqlite3 settings
  $Sqlite_db_file = '/database/db.sqlite';

  // mssql settings
  $MsSql_server = 'DB_HOSTNAME';
  $MsSql_databasename = 'DB_NAME';
  $MsSql_WindowsAuthentication = true;   //true or false
  $MsSql_username = 'USERNAME';          //not used if MsSql_WindowsAuthentication is true
  $MsSql_password = 'PASSWORD';          //not used if MsSql_WindowsAuthentication is true
  $MsSql_TrustServerCertificate = true;  //true, false or comment out for driver default
  //Download driver from https://docs.microsoft.com/en-us/sql/connect/php/download-drivers-php-sql-server?view=sql-server-ver16

  // Mysql settings
  $MySql_username = 'USERNAME';
  $MySql_password = 'PASSWORD';
  $MySql_hostname = 'DB_HOSTNAME';
  $MySql_databasename = 'DB_NAME';
  $MySql_port = '3306';

  // Postgresql settings
  $PostgreSql_username = 'USERNAME';
  $PostgreSql_password = 'PASSWORD';
  $PostgreSql_hostname = 'DB_HOSTNAME';
  $PostgreSql_databasename = 'DB_NAME';

# A faithful copy of /speedtest/settings.json at the pinned tag, with
# telemetry on, so every test is recorded.
librespeed_settings_json: |
  {
    "telemetry_level": "basic",
    "test_order": "ID_U_P",
    "time_dl_max": 12,
    "time_ul_max": 12,
    "time_dlGraceTime": 0,
    "time_ulGraceTime": 0,
    "time_auto": false
  }

# deerlab's own: this server alone, the entry upstream's start script writes
# for a standalone server. Upstream's /speedtest/server-list.json lists
# public servers run by third parties, which the modern page and the stability
# page would otherwise offer and test against.
librespeed_server_list: |
  [
    {
      "name": "local",
      "server": "/backend",
      "dlURL": "garbage.php",
      "ulURL": "empty.php",
      "pingURL": "empty.php",
      "getIpURL": "getIP.php",
      "sponsorName": "",
      "sponsorURL": "",
      "id": 1
    }
  ]

# deerlab's own. The pages fetch settings.json and server-list.json from the
# web root; these serve the mounted copies there, so the image's own stay where
# the drift check reads them. ServerName spares Apache a lookup of its own
# name at every start.
librespeed_apache_conf: |
  ServerName speedtest.localhost
  Alias /settings.json /etc/deerlab/settings.json
  Alias /server-list.json /etc/deerlab/server-list.json
  <Directory "/etc/deerlab">
      Require all denied
      <Files "settings.json">
          Require all granted
      </Files>
      <Files "server-list.json">
          Require all granted
      </Files>
  </Directory>

# deerlab's own. The PHP sources load their settings with a relative require,
# which searches include_path first, so the mounted copy wins over the image's
# beside the script, for the pages and for the command-line database check
# alike; their file_exists() test still sees the image's. The rest is the
# image's own include_path. Its paths name the PHP version (php85): a PHP bump
# in the image leaves this file unread, the image's settings load, their
# database is on the read-only root, and the database check fails.
librespeed_php_ini: |
  include_path = "/etc/deerlab/php:.:/usr/share/php85"

# The DNS forwarder's uid on this host (podman_hosts/main.yml).
deerlab_dnsdist_uid: 2001

# Caddy asks tailscaled for svc1's MagicDNS name itself (its upstreams'
# resolvers in the Caddyfile above), so that name never reaches the operator's DNS
# resolver; every other lookup of Caddy's goes through its listener.
base_firewall_dns_tailnet_services: [caddy]

podman_services:
  dnsdist: "{{ deerlab_dnsdist_service }}"
  caddy:
    uid: 2000
    image: docker.io/library/caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    # Host ports 80 and 443 are redirected to these by the firewall.
    publish:
      - "8080:80"
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - { name: data, mount: /data }
    mounts:
      - { src: /var/lib/caddy/config, dst: /etc/caddy, ro: true }
    tmpfs:
      - "/tmp:rw,nosuid,nodev,noexec,size=64m"
      - "/config:rw,nosuid,nodev,noexec,size=16m"
    env:
      TZ: Etc/UTC
    config_files:
      - { path: config/Caddyfile, content: "{{ caddy_caddyfile }}", mode: "0640", banner: "#" }
      - { path: config/librespeed-auth.caddy, content: "{{ caddy_librespeed_auth }}", mode: "0640", banner: "#", sensitive: true }
    # The official binary carries a file capability and will not exec with
    # everything dropped. NET_BIND_SERVICE is confined to Caddy's namespace.
    capabilities:
      - CAP_NET_BIND_SERVICE
    read_only: true
    no_new_privileges: true
    health:
      cmd: wget -q -O /dev/null http://127.0.0.1:8081/healthz
      interval: 30s
      start_period: 30s
    # What a pull proves once Caddy has started. The site- checks reach each
    # backend through TLS and the tailnet, with its Caddyfile health_uri and
    # health_status; host only, because the CI lab's upstreams are stand-ins.
    # The refusals, the redirect and the log redaction are Caddy's own, so
    # they run in the lab too.
    checks:
      - name: site-wallabag
        where: host
        via: edge
        host: "wallabag.{{ deerlab_domain }}"
        path: /login
        timeout: 10
      - name: site-linkding
        where: host
        via: edge
        host: "linkding.{{ deerlab_domain }}"
        path: /health
        timeout: 10
      - name: site-baikal
        where: host
        via: edge
        host: "baikal.{{ deerlab_domain }}"
        path: /dav.php
        status: [401]
        timeout: 10
      - name: site-freshrss
        where: host
        via: edge
        host: "freshrss.{{ deerlab_domain }}"
        path: /api/
        timeout: 10
      - name: site-vikunja
        where: host
        via: edge
        host: "{{ vikunja_hostname }}"
        path: /health
        timeout: 10
      - name: site-actual
        where: host
        via: edge
        host: "{{ actual_hostname }}"
        path: /account/needs-bootstrap
        timeout: 10
      - name: site-rsshub
        where: host
        via: edge
        host: "rsshub.{{ deerlab_domain }}"
        path: /robots.txt
        timeout: 10
      - name: site-mealie
        where: host
        via: edge
        host: "{{ mealie_hostname }}"
        path: /api/households/mealplans/ical/deerlab-health
        status: [404]
        timeout: 10
      - name: refused-metrics
        via: edge
        host: "{{ actual_hostname }}"
        path: /metrics
        status: [404]
      - name: refused-openid
        via: edge
        host: "{{ actual_hostname }}"
        path: /openid/config
        status: [404]
      - name: refused-bootstrap
        via: edge
        host: "{{ actual_hostname }}"
        path: /account/bootstrap
        status: [404]
      # The speed test's login is Caddy's: a request without credentials
      # gets 401. That proves the site is loaded, its certificate served and
      # its login on.
      - name: login-speedtest
        via: edge
        host: "speedtest.{{ deerlab_domain }}"
        path: /
        status: [401]
      - name: http-redirect
        path: /
        headers: { Host: "wallabag.{{ deerlab_domain }}" }
        status: [308]
      # RSSHub's key rides in the query string, which the site's log must
      # drop. 403 is RSSHub refusing the keyless request; 502 or 503 an
      # upstream Caddy cannot reach, as in the CI lab. site-rsshub, not this,
      # proves RSSHub answers.
      - name: redact-query
        type: log
        timeout: 45
        send:
          via: edge
          host: "rsshub.{{ deerlab_domain }}"
          path: /deerlab-log-__MARKER__
          query: { deerlab-sentinel: __SENTINEL__ }
          status: [403, 502, 503]
      # Actual's session token rides in X-Actual-Token, which the site's log
      # must drop; Caddy itself refuses /metrics.
      - name: redact-token
        type: log
        send:
          via: edge
          host: "{{ actual_hostname }}"
          path: /metrics/deerlab-log-__MARKER__
          headers: { X-Actual-Token: __SENTINEL__ }
          status: [404]
      # Mealie's tokens ride in URLs, which the site's log must redact; a log
      # check carries its sentinel in the query, so the path redactions are
      # proven only at build time. 200 or 404 is Mealie answering, 502 or
      # 503 an upstream Caddy cannot reach, as in the CI lab.
      - name: redact-mealie
        type: log
        timeout: 45
        send:
          via: edge
          host: "{{ mealie_hostname }}"
          path: /deerlab-log-__MARKER__
          query: { token: __SENTINEL__ }
          status: [200, 404, 502, 503]
      # Its lookups reach the operator's DNS resolver under its own name: the
      # resolver's test endpoint answers with the name of the device that
      # looked it up, and only to a curl User-Agent. The body also holds the
      # resolver's profile and the host's address, which no_log keeps out.
      - name: dns-name
        type: exec
        where: host
        timeout: 10
        cmd: [wget, -U, curl/8, -T, "8", -qO-, "{{ deerlab_dns_test_url }}"]
        stdout_regex: '"deviceName":\s*"caddy"'
    egress: any
    backup:
      volumes: [data]

  # The operator's speed test. On the edge, not svc1, because it measures the
  # link to the edge: on svc1 every byte would also cross the tailnet hop.
  librespeed:
    uid: 2002
    image: ghcr.io/librespeed/speedtest:6.3.1-alpine@sha256:2db012618515bfe8c8d825ce155e6a9122d78849e21535ecd1e74ef42884979a
    # The image's own apache user. Apache starts directly as it (entrypoint:
    # and exec: below), so no capability is needed: upstream's start script,
    # which needs CHOWN, SETUID and SETGID and a writable root, never runs.
    user: 100
    group: 101
    publish:
      # Container side 8080: a non-root container uid cannot bind below 1024.
      # Caddy reaches host port 8082 at 169.254.1.2, pasta's address for the
      # host. The firewall opens no port for it to the internet, so past
      # Caddy only the host and the tailnet reach it.
      - "8082:8080"
    volumes:
      # :U gives the fresh volume to uid 100, which creates db.sqlite in it.
      - { name: data, mount: /database, chown: true }
    tmpfs:
      # Apache's pid file. The image's /run/apache2 is root's.
      - "/run/apache2:rw,nosuid,nodev,noexec,size=1m,mode=1777"
      # PHP's sessions and upload spool: each 20 MiB upload chunk spools here,
      # and a test sends three at once.
      - "/tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777"
    config_files:
      # 0644, not Caddy's 0640: this container runs as uid 100, which cannot
      # read a group-restricted file (FreshRSS's record says more).
      - path: config/httpd.conf
        content: "{{ librespeed_httpd_conf }}"
        mode: "0644"
        banner: "#"
        upstream:
          path: /etc/apache2/httpd.conf
          edits:
            - { from: "Listen 80", to: "Listen 8080" }
            - { from: "DocumentRoot \"/var/www/localhost/htdocs\"", to: "DocumentRoot \"/speedtest\"" }
            - { from: "<Directory \"/var/www/localhost/htdocs\">", to: "<Directory \"/speedtest\">" }
            - { from: "ErrorLog logs/error.log", to: "ErrorLog /dev/stderr" }
            - { from: "    CustomLog logs/access.log combined", to: "    CustomLog /dev/stdout combined" }
            # The thirteen comment lines below end in spaces upstream, and this
            # repository refuses trailing whitespace, so the copy drops them.
            - from: "# In particular, see "
              to: "# In particular, see"
            - from: "# consult the online docs. You have been warned.  "
              to: "# consult the online docs. You have been warned."
            - from: "# server as \"/usr/local/apache2/logs/access_log\", whereas \"/logs/access_log\" "
              to: "# server as \"/usr/local/apache2/logs/access_log\", whereas \"/logs/access_log\""
            - from: "# Change this to Listen on specific IP addresses as shown below to "
              to: "# Change this to Listen on specific IP addresses as shown below to"
            - from: "# httpd as root initially and it will switch.  "
              to: "# httpd as root initially and it will switch."
            - from: "# explicitly permit access to web content directories in other "
              to: "# explicitly permit access to web content directories in other"
            - from: "# The following lines prevent .htaccess and .htpasswd files from being "
              to: "# The following lines prevent .htaccess and .htpasswd files from being"
            - from: "# viewed by Web clients. "
              to: "# viewed by Web clients."
            - from: "    # Redirect: Allows you to tell clients about documents that used to "
              to: "    # Redirect: Allows you to tell clients about documents that used to"
            - from: "    # exist in your server's namespace, but do not anymore. The client "
              to: "    # exist in your server's namespace, but do not anymore. The client"
            - from: "    # ScriptAlias: This controls which directories contain server scripts. "
              to: "    # ScriptAlias: This controls which directories contain server scripts."
            - from: "# EnableMMAP and EnableSendfile: On systems that support it, "
              to: "# EnableMMAP and EnableSendfile: On systems that support it,"
            - from: "# be turned off when serving from networked-mounted "
              to: "# be turned off when serving from networked-mounted"
      # No banner: a line before <?php would be sent with every page.
      - path: config/php/telemetry_settings.php
        content: "{{ librespeed_telemetry_settings }}"
        mode: "0644"
        upstream:
          path: /speedtest/results/telemetry_settings.php
          edits:
            - { from: "$stats_password = 'PASSWORD';", to: "$stats_password = getenv('LIBRESPEED_STATS_PASSWORD') ?: 'PASSWORD';" }
            - { from: "$Sqlite_db_file = __DIR__ . '/../../speedtest_telemetry.db';", to: "$Sqlite_db_file = '/database/db.sqlite';" }
      # No banner on JSON, which has no comment syntax.
      - path: config/settings.json
        content: "{{ librespeed_settings_json }}"
        mode: "0644"
        upstream:
          path: /speedtest/settings.json
          edits:
            - { from: '  "telemetry_level": "off",', to: '  "telemetry_level": "basic",' }
      - { path: config/server-list.json, content: "{{ librespeed_server_list }}", mode: "0644" }
      - { path: config/deerlab-apache.conf, content: "{{ librespeed_apache_conf }}", mode: "0644", banner: "#" }
      - { path: config/deerlab-php.ini, content: "{{ librespeed_php_ini }}", mode: "0644", banner: ";" }
    # One file each, not the directory: config_files makes its directories
    # 0750 for the service user, which is namespace root, so uid 100 could
    # not enter a mounted directory. The image's conf.d directories load
    # every *.conf and *.ini in them, in order; zz- sorts these last.
    mounts:
      - { src: /var/lib/librespeed/config/httpd.conf, dst: /etc/deerlab/httpd.conf, ro: true }
      - { src: /var/lib/librespeed/config/php/telemetry_settings.php, dst: /etc/deerlab/php/telemetry_settings.php, ro: true }
      - { src: /var/lib/librespeed/config/settings.json, dst: /etc/deerlab/settings.json, ro: true }
      - { src: /var/lib/librespeed/config/server-list.json, dst: /etc/deerlab/server-list.json, ro: true }
      - { src: /var/lib/librespeed/config/deerlab-apache.conf, dst: /etc/apache2/conf.d/zz-deerlab.conf, ro: true }
      - { src: /var/lib/librespeed/config/deerlab-php.ini, dst: /etc/php85/conf.d/zz-deerlab.ini, ro: true }
    entrypoint: httpd
    exec: -DFOREGROUND -f /etc/deerlab/httpd.conf
    secrets:
      - { name: stats-password, value: "{{ librespeed_stats_password }}", type: env, target: LIBRESPEED_STATS_PASSWORD }
    capabilities: []
    read_only: true
    no_new_privileges: true
    # The image's SIGWINCH is Apache's graceful stop, which waits for every
    # test in flight, outlasts StopTimeout and exits 137, which pages. SIGTERM
    # ends them and exits 0.
    stop_signal: SIGTERM
    health:
      cmd: wget -q -O /dev/null http://127.0.0.1:8080/backend/empty.php
      interval: 30s
      start_period: 30s
    # What a pull proves once LibreSpeed has started. None of it logs in,
    # sends a password or writes a result.
    checks:
      # PHP answers, and the ISP database bundled in the image loads. A public
      # address, the regional registry's own, stands in for a client's: the
      # server believes X-Real-IP on this direct path (Caddy overwrites it at
      # the edge), and has nothing to look up for a private one.
      - name: getip
        path: /backend/getIP.php
        query: { isp: "true" }
        headers: { X-Real-IP: 193.0.6.139 }
        body_regex: '"processedString":"193\.0\.6\.139 - [^"]+, [^"]+"'
      # A lookup that must find nothing. It prints db-error when the database
      # cannot be opened, and when the image's own settings load instead of
      # the mounted ones, whose database is on the read-only root.
      - name: database
        type: exec
        cmd:
          - php
          - -r
          - >-
            chdir("/speedtest/results"); require "telemetry_db.php"; $r = getSpeedtestUserById("zzzzzzz");
            echo $r === null ? "missing-ok" : ($r === false ? "db-error" : "found"), "\n";
        stdout_regex: ^missing-ok$
      # The stats page shows its login form: neither open, nor disabled for
      # want of a password.
      - name: stats-locked
        path: /results/stats.php
        body_regex: name="password"
      # Its lookups reach the resolver under its own name, as Caddy's do.
      - name: dns-name
        type: exec
        where: host
        timeout: 10
        cmd: [wget, -U, curl/8, -T, "8", -qO-, "{{ deerlab_dns_test_url }}"]
        stdout_regex: '"deviceName":\s*"librespeed"'
    # The server never calls out without an ipinfo key, which it does not
    # have; image pulls, restic and Pushover need 443 alone.
    egress: platform
    backup:
      # One file with a rollback journal. count(*) > 0, not >= 0: PHP creates
      # the table on every connection, so only a row shows the database is
      # the one that holds the history.
      sqlite:
        - { volume: data, path: db.sqlite, presence_query: "SELECT count(*) > 0 FROM speedtest_users" }
      volumes: [data]
