# The records themselves are checked by podman_service_check, which the
# playbooks run before backup; see that role for why.
- name: Validate required inputs
  ansible.builtin.assert:
    that:
      - podman_service_services is mapping
      - podman_service_limits is mapping
    fail_msg: podman_service needs podman_services and deerlab_service_limits as mappings
    quiet: true

- name: Deploy each service
  ansible.builtin.include_tasks: service.yml
  loop: "{{ podman_service_services | dict2items }}"
  loop_control:
    loop_var: podman_service_item
    label: "{{ podman_service_item.key }}"
