# Runs self-hosted Renovate against this repository on a GitHub App token.
# The first step mints an installation token for this repository alone, valid
# for an hour, narrowed to the five permissions Renovate uses. The App's
# private key is a repository secret, so any workflow run from this repository
# can read it: branches pushed to it, and pull requests from them. Renovate
# also manages the pinned actions in .github/workflows/, which needs the
# workflows permission that the job's own GITHUB_TOKEN can never hold.
#
# Renovate merges its own PRs, through the API with Rebase and merge, once
# every check on one has passed, the CI lab's included: one merge per run.
# GitHub's auto-merge stays off, so DEERLAB_AUTOMERGE is the only switch.
# See docs/runbook.md, Bot pull requests.

name: Renovate

on:
  # Every 3 hours, as a heartbeat: GitHub has started this repository's
  # scheduled runs hours late, so the two triggers below do the real work.
  schedule:
    - cron: "17 */3 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch:
  # After every merge, so Renovate rebases the PRs that are now behind main.
  # Runs queue one at a time and GitHub keeps only the newest pending one.
  push:
    branches: [main]
  # When CI finishes on one of Renovate's branches, so a green PR merges
  # now and the next follows, instead of each waiting for the schedule.
  # There is no job-level if: a skipped run would still take the one
  # pending slot and cancel a useful run.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["renovate/**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nothing here restores or saves a cache, so deny it outright: a job
    # holding contents: write must not be able to seed a cache that CI on
    # main later restores.
    cache-mode: none
    # The job needs nothing from GITHUB_TOKEN: the App token does the work.
    permissions: {}
    steps:
      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write
          permission-workflows: write
      # No checkout. Renovate clones the repository itself through the API
      # token, and reads renovate.json from the default branch.
      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          # The kill switch, failing closed: Renovate merges only while the
          # repository variable DEERLAB_AUTOMERGE is "enabled", compared
          # without regard to case; unset, empty or anything else forces
          # automerge off. force overrides
          # renovate.json and every packageRule. It acts from the next run
          # and cannot recall a merge already made.
          RENOVATE_FORCE: ${{ case(vars.DEERLAB_AUTOMERGE == 'enabled', '', '{"automerge":false}') }}
