# The key must be one-off, pre-approved and tagged (tag:edge or tag:svc).
# Tagged at first login, the machine belongs to the tag and its key expiry is
# off; a tag added later would leave the 180-day expiry on. The key reaches
# tailscaled only through the root-only file, never an argument, and the file
# is emptied again whether or not the login worked.

# rc is 0 whenever tailscaled answers, whatever its state.
- name: Read tailscaled's state
  ansible.builtin.command: tailscale status --json
  register: base_tailscale_status
  changed_when: false
  failed_when: base_tailscale_status.rc != 0
  check_mode: false
  no_log: true

- name: Report a machine that has already joined
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} is already on the tailnet; the key was not used"
  when: (base_tailscale_status.stdout | from_json)['BackendState'] == 'Running'

- name: Join the tailnet
  when: (base_tailscale_status.stdout | from_json)['BackendState'] != 'Running'
  block:
    - name: Hand tailscaled the key
      ansible.builtin.copy:
        content: "{{ base_tailscale_auth_key }}"
        dest: "{{ base_tailscale_auth_key_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Restart tailscaled so it reads the key
      ansible.builtin.systemd_service:
        name: tailscaled
        state: restarted

    # no_log: the status names the tailnet and its addresses.
    - name: Wait for tailscaled to log in
      ansible.builtin.command: tailscale status --json
      register: base_tailscale_join
      until: >-
        base_tailscale_join.rc == 0 and
        (base_tailscale_join.stdout | from_json)['BackendState'] == 'Running'
      retries: 30
      delay: 2
      changed_when: false
      failed_when: false
      no_log: true

    - name: Fail unless tailscaled joined the tailnet
      ansible.builtin.assert:
        that: base_tailscale_join_state == 'Running'
        fail_msg: >-
          tailscaled on {{ inventory_hostname }} is {{ base_tailscale_join_state }},
          not Running: {{ base_tailscale_join_health | join('; ') }}
        quiet: true
      vars:
        base_tailscale_join_json: "{{ base_tailscale_join.stdout | from_json if base_tailscale_join.rc == 0 else {} }}"
        base_tailscale_join_state: "{{ base_tailscale_join_json['BackendState'] | default('not answering') }}"
        base_tailscale_join_health: "{{ base_tailscale_join_json['Health'] | default([], true) }}"
  always:
    - name: Empty the auth key file
      ansible.builtin.copy:
        content: ""
        dest: "{{ base_tailscale_auth_key_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

# A key with no tag leaves the machine owned by a user with a 180-day key
# expiry, and one with the other host's tag gives it that host's grants.
# Either passes the login, so the machine's own view of itself is checked,
# for a host that was already on the tailnet as much as for a new one.
- name: Read the machine's tags and key expiry
  ansible.builtin.command: tailscale status --json
  register: base_tailscale_self
  changed_when: false
  failed_when: base_tailscale_self.rc != 0
  check_mode: false
  no_log: true

- name: Fail unless the machine carries its tag and no key expiry
  ansible.builtin.assert:
    that:
      - base_tailscale_self_tags == [base_tailscale_tag]
      - not base_tailscale_self_expiring
    fail_msg: >-
      {{ inventory_hostname }} joined as {{ base_tailscale_self_as }}, not as
      {{ base_tailscale_tag }} with no expiry. Delete the machine in the console, then enrol
      it again with a one-off key tagged {{ base_tailscale_tag }}.
    quiet: true
  vars:
    base_tailscale_self_json: "{{ (base_tailscale_self.stdout | from_json)['Self'] | default({}) }}"
    base_tailscale_self_tags: "{{ base_tailscale_self_json['Tags'] | default([], true) | list }}"
    base_tailscale_self_expiring: "{{ base_tailscale_self_json['KeyExpiry'] is defined }}"
    base_tailscale_self_as: >-
      {{ (base_tailscale_self_tags | join(', ') or 'untagged')
         ~ (', with key expiry on' if base_tailscale_self_expiring else '') }}
