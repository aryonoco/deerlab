- name: Validate required inputs
  ansible.builtin.assert:
    that:
      - base_firewall_role in ['edge', 'services']
      - base_firewall_role == 'edge' or base_firewall_edge_public_v4 is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - base_firewall_services is mapping
      # `that:` stops at the first false condition, so the defined check has to
      # come before the value check - rejectattr on an undefined attribute dies
      # as a raw Jinja error rather than this fail_msg.
      - base_firewall_services | dict2items | rejectattr('value.egress', 'defined') | list | length == 0
      - base_firewall_services | dict2items | rejectattr('value.egress', 'in', base_firewall_egress_classes) | list | length == 0
    fail_msg: >-
      base_firewall_role must be edge or services, a services host needs the
      edge's public IPv4 address as a literal, and every service needs an egress class from {{ base_firewall_egress_classes | join(', ') }}. An
      unrecognised class renders the template's fail-closed branch, which
      would drop the nightly backup and the alert about it.

- name: Write the ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft --check --file %s
  notify: Reload nftables

- name: Enable nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Flush handlers so the ruleset applies before later roles test connectivity
  ansible.builtin.meta: flush_handlers
