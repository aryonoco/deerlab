# Runs self-hosted Renovate against this repository on a GitHub App token.
# The first step mints an installation token for this repository alone, valid
# for an hour, narrowed to the five permissions Renovate uses. The App's
# private key is a repository secret, so any workflow run in this repository
# can read it, branch and pull request runs included. Renovate also manages
# the pinned actions in .github/workflows/, which needs the workflows
# permission that the job's own GITHUB_TOKEN can never hold.

name: Renovate

on:
  # Daily, so a Vikunja release (schedule "at any time" in renovate.json)
  # opens within a day. Everything else is held to Monday by renovate.json's
  # own schedule, which Renovate evaluates in Australia/Sydney.
  schedule:
    - cron: "17 5 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch:
  # After every merge, so Renovate rebases the PRs that are now behind main.
  # Runs queue one at a time and GitHub keeps only the newest pending one.
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nothing here restores or saves a cache, so deny it outright: a job
    # holding contents: write must not be able to seed a cache that CI on
    # main later restores.
    cache-mode: none
    # The job needs nothing from GITHUB_TOKEN: the App token does the work.
    permissions: {}
    steps:
      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write
          permission-workflows: write
      # No checkout. Renovate clones the repository itself through the API
      # token, and reads renovate.json from the default branch.
      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
