- name: Reconfigure wg
  ansible.builtin.command:
    cmd: "networkctl reload"
  changed_when: true
  notify: Reconfigure wg interface

- name: Reconfigure wg interface
  ansible.builtin.command:
    cmd: "networkctl reconfigure {{ base_wireguard_interface }}"
  changed_when: true
  failed_when: false
