# Single source of truth for every tool the repo needs. CI and `just setup`
# both run `mise install` and nothing else.

[tools]
uv = "0.12.9"
just = "1.58.0"
shellcheck = "0.11.0"
trivy = "0.74.0"
gitleaks = "8.30.1"
sops = "3.13.3"
age = "1.3.2"
restic = "0.19.1"
"pipx:ansible" = { version = "14.3.1", uvx_args = "--with-executables-from ansible-core --with paramiko --with passlib" }
"pipx:ansible-lint" = { version = "26.8.0", uvx_args = "--with passlib" }
"pipx:yamllint" = "1.38.0"
