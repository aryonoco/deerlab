# A host gets sops from base_pull, during a bootstrap that decrypts the
# inventory on the operator's machine. The lab has no such machine: its first
# pull decrypts the inventory itself, so sops must be there first. Same role,
# same pinned version as base_pull.
- name: Install sops before the lab's first pull
  hosts: localhost
  connection: local
  vars_files:
    - ../roles/base_pull/defaults/main.yml
  roles:
    - role: community.sops.install
      vars:
        sops_version: "{{ base_pull_sops_version }}"
        sops_source: github
