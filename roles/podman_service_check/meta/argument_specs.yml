argument_specs:
  main:
    short_description: Check every podman_services record before it is used
    description: >
      Asserts that each service record has a fully qualified digest-pinned
      image, publish, health.cmd, an entry with a pids limit in
      deerlab_service_limits, no CHANGE-ME secrets and a well-formed
      stop_signal, and that its workloads follow the rules on kind,
      parent-only keys, schedule, health, persistent, runtime_max,
      start_timeout and stop_signal. It reads nothing on the host and needs
      no privileges, so it runs in full under check mode. The playbooks run
      it first, and podman_service lists it as a dependency, so a play that
      names podman_service alone still runs it; Ansible runs it once per
      play. The record keys are documented in podman_service's argument
      spec, the role that consumes them.
    options:
      podman_service_check_services:
        type: dict
        required: true
        description: >
          The podman_services dictionary; see podman_service's
          podman_service_services for the keys a record supports.
      podman_service_check_limits:
        type: dict
        required: true
        description: >
          The deerlab_service_limits dictionary; see podman_service's
          podman_service_limits for its shape.
