- name: Validate required inputs
  ansible.builtin.assert:
    that:
      - base_dns_tls_addresses is sequence and base_dns_tls_addresses is not string
      - base_dns_tls_addresses | length > 0
      - base_dns_tls_addresses | reject('match', '[0-9a-fA-F.:]+$') | list | length == 0
      - base_dns_tls_name is match('[A-Za-z0-9-]{1,63}(\.[A-Za-z0-9-]{1,63})+$')
      - base_dns_check_name | length > 0
    fail_msg: base_dns needs the resolver's DNS-over-TLS addresses, the name its certificate carries, and a name to check
    quiet: true

# On Debian's cloud image already. Listed so a host built from another image
# fails here, not at its first lookup; openssl runs the TLS check below.
- name: Install the resolver and the tools its check uses
  ansible.builtin.apt:
    name:
      - systemd-resolved
      # glibc's lookups through resolved's socket rather than port 53, so a
      # service user's image pulls, backups and alerts are not steered to its
      # DNS listener (docs/runbook.md, The services' DNS forwarder). Only a
      # Recommends of systemd-resolved, so named here.
      - libnss-resolve
      - ca-certificates
      - openssl
    state: present

- name: Keep systemd-resolved running
  ansible.builtin.systemd_service:
    name: systemd-resolved
    enabled: true
    state: started

- name: Create the resolver's drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Read the resolver's drop-in as it stands
  ansible.builtin.slurp:
    src: /etc/systemd/resolved.conf.d/50-deerlab.conf
  register: base_dns_current
  failed_when: false
  no_log: true

# Rendered once, so the file written below is exactly the text compared
# with the one on disk. no_log, here and below: the name carries the
# resolver's profile.
- name: Render the resolver's drop-in
  ansible.builtin.set_fact:
    base_dns_dropin: "{{ lookup('ansible.builtin.template', 'resolved.conf.j2') }}"
  no_log: true

# Strict DNS-over-TLS fails every lookup when an address does not answer
# TLS, or its certificate does not cover the name. So before a changed
# drop-in is written, each address must complete a handshake with a
# certificate valid for the name, from the system's CAs as resolved uses
# them; such a value then fails the run here, while the host still resolves
# through what it had. A name the certificate's wildcard covers passes, a
# mistyped profile included: only the resolver's own logs show that. A
# converged host opens no connection for it.
- name: Check each address answers TLS for the name on port 853
  ansible.builtin.command:
    argv:
      - timeout
      - "15"
      - openssl
      - s_client
      - -connect
      - "{{ ('[' ~ item ~ ']') if ':' in item else item }}:853"
      - -servername
      - "{{ base_dns_tls_name }}"
      - -verify_hostname
      - "{{ base_dns_tls_name }}"
      - -verify_return_error
      - -brief
    stdin: Q
  loop: "{{ base_dns_tls_addresses }}"
  register: base_dns_tls_check
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: base_dns_dropin != (base_dns_current.content | default('') | b64decode)

# Reads only each address and its exit code: the check's full result holds
# the name, and a failed assert would print it.
- name: Refuse an address that failed the TLS check
  ansible.builtin.assert:
    that: base_dns_tls_failed | length == 0
    fail_msg: >-
      the resolver at {{ base_dns_tls_failed | join(', ') }} did not complete a
      verified TLS handshake for the configured name on port
      853{{ base_dns_tls_silent_note }}; the host keeps its current DNS
    quiet: true
  vars:
    base_dns_tls_failed: "{{ base_dns_tls_check.results | rejectattr('rc', 'eq', 0) | map(attribute='item') | list }}"
    base_dns_tls_silent: "{{ base_dns_tls_check.results | selectattr('rc', 'eq', 124) | map(attribute='item') | list }}"
    base_dns_tls_silent_note: "{{ (' (no answer within 15 s from ' ~ (base_dns_tls_silent | join(', ')) ~ ')') if base_dns_tls_silent else '' }}"
  when: base_dns_dropin != (base_dns_current.content | default('') | b64decode)

- name: Write the resolver's drop-in
  ansible.builtin.copy:
    content: "{{ base_dns_dropin }}"
    dest: /etc/systemd/resolved.conf.d/50-deerlab.conf
    owner: root
    group: root
    mode: "0644"
  diff: false
  notify: Reload systemd-resolved

- name: Apply it before anything else in the run looks a name up
  ansible.builtin.meta: flush_handlers

# The provider's DHCP resolvers complete DNS-over-TLS as well, so while
# tailscaled is not routing they would answer lookups beside the operator's
# resolver. A drop-in beside the provider's generated network file stops
# networkd handing them to resolved. It comes after the resolver's own
# servers are in place, so the host is never without one.
- name: Ask networkd which network file the uplink uses
  ansible.builtin.command:
    argv:
      - networkctl
      - status
      - "{{ base_dns_uplink_interface }}"
      - --json=short
  register: base_dns_uplink_status
  changed_when: false
  failed_when: false
  check_mode: false
  # Its JSON holds the host's addresses and the provider's resolvers.
  no_log: true

- name: Note the uplink's network file
  ansible.builtin.set_fact:
    base_dns_uplink_network: "{{ ((base_dns_uplink_status.stdout or '{}') | from_json).NetworkFile | default('') }}"

- name: Refuse an uplink networkd does not manage
  ansible.builtin.assert:
    that: base_dns_uplink_network | length > 0
    fail_msg: >-
      networkd manages no network file for {{ base_dns_uplink_interface }},
      so the provider's DHCP resolvers cannot be kept from resolved
    quiet: true

- name: Create the drop-in directory of the uplink's network file
  ansible.builtin.file:
    path: "/etc/systemd/network/{{ base_dns_uplink_network | basename }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep the uplink's resolvers from resolved
  ansible.builtin.template:
    src: network-nodns.conf.j2
    dest: "/etc/systemd/network/{{ base_dns_uplink_network | basename }}.d/50-deerlab-dns.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd-networkd

- name: Apply it before the checks below
  ansible.builtin.meta: flush_handlers

# A run that died after the write, or a reload that failed, leaves the
# drop-in on disk but unapplied, and unchanged for the next run. So the
# uplink's servers are read whatever happened above, and networkd is
# reloaded while it still hands resolved any. no_log: the list would name
# the provider's resolvers.
- name: Read the uplink's DNS servers as resolved has them
  ansible.builtin.command:
    argv:
      - resolvectl
      - dns
      - "{{ base_dns_uplink_interface }}"
  register: base_dns_uplink_dns
  retries: 5
  delay: 1
  until: base_dns_uplink_dns.rc == 0 and (base_dns_uplink_dns.stdout | regex_replace('^[^:]*:', '') | trim | length == 0)
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

- name: Reload networkd while the uplink still hands resolved servers
  ansible.builtin.systemd_service:
    name: systemd-networkd
    state: reloaded
  when:
    - not ansible_check_mode
    - base_dns_uplink_dns.stdout | default('') | regex_replace('^[^:]*:', '') | trim | length > 0

- name: Read them again after that reload
  ansible.builtin.command:
    argv:
      - resolvectl
      - dns
      - "{{ base_dns_uplink_interface }}"
  register: base_dns_uplink_dns_again
  retries: 10
  delay: 1
  until: base_dns_uplink_dns_again.rc == 0 and (base_dns_uplink_dns_again.stdout | regex_replace('^[^:]*:', '') | trim | length == 0)
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - not ansible_check_mode
    - base_dns_uplink_dns.stdout | default('') | regex_replace('^[^:]*:', '') | trim | length > 0

- name: Fail when the uplink still hands resolved DNS servers
  ansible.builtin.assert:
    that:
      - base_dns_uplink_final.rc == 0
      - base_dns_uplink_final.stdout | regex_replace('^[^:]*:', '') | trim | length == 0
    fail_msg: >-
      {{ base_dns_uplink_interface }} still gives resolved DNS servers after
      networkd reloaded; see `networkctl status {{ base_dns_uplink_interface }}`
      and its network file
    quiet: true
  vars:
    base_dns_uplink_final: "{{ base_dns_uplink_dns if base_dns_uplink_dns_again is skipped else base_dns_uplink_dns_again }}"
  when: not ansible_check_mode

- name: Look up a name the host needs
  ansible.builtin.command:
    argv:
      - resolvectl
      - query
      - --cache=no
      - --legend=no
      - "{{ base_dns_check_name }}"
  register: base_dns_query
  retries: 3
  delay: 2
  until: base_dns_query.rc == 0
  changed_when: false
  failed_when: false
  check_mode: false

- name: Fail when the host cannot resolve
  ansible.builtin.assert:
    that: base_dns_query.rc == 0
    fail_msg: "{{ base_dns_check_name }} did not resolve: the host has no working DNS"
    quiet: true
