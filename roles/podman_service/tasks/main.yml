- name: Validate the service definitions
  ansible.builtin.assert:
    that:
      - podman_service_definition_spec.image is match('^[a-z0-9.-]+(/[a-z0-9._-]+)+:[A-Za-z0-9._-]+@sha256:[a-f0-9]{64}$')
      - podman_service_definition_spec.publish is defined
      - podman_service_definition_spec.health.cmd is defined
      # Ansible evaluates `that:` in order and stops at the first false
      # condition, so this guard has to run before the two indexing checks
      # below - without it, a service missing from deerlab_service_limits
      # dies as a raw Jinja KeyError instead of this assert's own fail_msg.
      - podman_service_definition_name in podman_service_limits
      - podman_service_definition_name in podman_service_limits[podman_service_definition_name].containers
      - podman_service_limits[podman_service_definition_name].containers[podman_service_definition_name].pids is defined
      - (podman_service_definition_spec.secrets | default([])) | map(attribute='value') | select('equalto', 'CHANGE-ME') | list | length == 0
    fail_msg: >-
      service {{ podman_service_definition_name }} needs a fully qualified digest-pinned image, publish,
      health.cmd, an entry with a pids limit in deerlab_service_limits, and no
      CHANGE-ME secrets
    quiet: true
  # A failed loop result contains its complete item, and the CHANGE-ME check
  # fails exactly while real secrets are being staged. Loop over the service
  # name alone so a validation failure cannot print the service's secret values.
  loop: "{{ podman_service_services | list }}"
  loop_control:
    loop_var: podman_service_definition_name
    label: "{{ podman_service_definition_name }}"
  vars:
    podman_service_definition_spec: "{{ podman_service_services[podman_service_definition_name] }}"

# service.yml blocks a workload from INHERITING the keys in
# podman_service_never_inherited - it does not stop a workload from declaring
# a key itself. kind, schedule and persistent are mandatory or valid workload
# keys, so they must not join the forbidden-key list below. base_firewall
# builds every host's egress chains from map(attribute='publish') over the
# top-level podman_services entries alone, so a workload's own PublishPort=
# would open a port with no egress chain and no firewall rule ever written for
# it: a silent bypass introduced by one misplaced key, not a startup failure. A
# workload with no matching entry in deerlab_service_limits fails instead with
# a raw Jinja error from deep inside service.yml; this gives that a clean
# fail_msg.
#
# health is deliberately absent from this list: a worker may declare its own
# health check rather than inherit the primary's, and only a job is refused
# one, by the job-health check below. secrets stays on the list because the
# secret-creation loop in service.yml iterates the parent spec only, so a
# workload's own secrets entry would render a Secret= reference to a Podman
# secret that was never created, and the container would fail to start. Keep
# it here until that loop is taught to look at workloads too.
- name: Validate the workload definitions
  ansible.builtin.assert:
    that:
      - podman_service_workload_bad_kinds | length == 0
      - podman_service_workload_forbidden_hits | length == 0
      - podman_service_workload_missing_limits | length == 0
      - podman_service_workload_bad_schedules | length == 0
      - podman_service_workload_job_health | length == 0
      - podman_service_workload_bad_persistent | length == 0
      - podman_service_workload_missing_runtime_max | length == 0
      - podman_service_workload_missing_start_timeout | length == 0
    fail_msg: >-
      service {{ podman_service_workload_service_name }}: workloads with a missing or invalid kind
      {{ podman_service_workload_bad_kinds }}; workloads declaring a parent-only
      key {{ podman_service_workload_forbidden_hits }}; workloads missing a
      deerlab_service_limits containers entry {{ podman_service_workload_missing_limits }};
      jobs missing a schedule or workers declaring one
      {{ podman_service_workload_bad_schedules }}; jobs declaring a health
      check {{ podman_service_workload_job_health }}; workloads with invalid
      persistent settings {{ podman_service_workload_bad_persistent }}; jobs
      missing runtime_max in deerlab_service_limits
      {{ podman_service_workload_missing_runtime_max }}; workers missing
      start_timeout in deerlab_service_limits
      {{ podman_service_workload_missing_start_timeout }}
    quiet: true
  # A failed loop result contains its complete item. Loop over the service name
  # alone so a validation failure cannot print the service's secret values.
  loop: "{{ podman_service_services | list }}"
  loop_control:
    loop_var: podman_service_workload_service_name
    label: "{{ podman_service_workload_service_name }}"
  vars:
    podman_service_workload_spec: "{{ podman_service_services[podman_service_workload_service_name] }}"
    podman_service_workload_kinds: [worker, job]
    podman_service_workload_parent_only_keys:
      - publish
      - secrets
      - backup
      - uid
      - egress
      - workloads
    podman_service_workload_bad_kinds: >-
      {{ podman_service_workload_spec.workloads | default({}) | dict2items
         | rejectattr('value.kind', 'defined')
         | map(attribute='key') | list
         + (podman_service_workload_spec.workloads | default({}) | dict2items
            | selectattr('value.kind', 'defined')
            | rejectattr('value.kind', 'in', podman_service_workload_kinds)
            | map(attribute='key') | list) }}
    podman_service_workload_forbidden_hits: >-
      {{ (podman_service_workload_spec.workloads | default({}) | dict2items | map(attribute='key') | list)
         | zip(podman_service_workload_spec.workloads | default({}) | dict2items | map(attribute='value')
               | map('list') | map('intersect', podman_service_workload_parent_only_keys) | list)
         | rejectattr('1', 'equalto', [])
         | list }}
    podman_service_workload_missing_limits: >-
      {{ podman_service_workload_spec.workloads | default({}) | dict2items | map(attribute='key')
         | map('regex_replace', '^(.*)$', podman_service_workload_service_name ~ '-\1')
         | difference(podman_service_limits[podman_service_workload_service_name].containers | default({}) | dict2items
                      | selectattr('value.pids', 'defined') | map(attribute='key') | list) }}
    podman_service_workload_bad_schedules: >-
      {{ (podman_service_workload_spec.workloads | default({}) | dict2items
          | selectattr('value.kind', 'defined')
          | selectattr('value.kind', 'equalto', 'job')
          | rejectattr('value.schedule', 'defined')
          | map(attribute='key') | list)
         + (podman_service_workload_spec.workloads | default({}) | dict2items
            | selectattr('value.kind', 'defined')
            | selectattr('value.kind', 'equalto', 'worker')
            | selectattr('value.schedule', 'defined')
            | map(attribute='key') | list) }}
    podman_service_workload_job_health: >-
      {{ podman_service_workload_spec.workloads | default({}) | dict2items
         | selectattr('value.kind', 'defined')
         | selectattr('value.kind', 'equalto', 'job')
         | selectattr('value.health', 'defined')
         | map(attribute='key') | list }}
    podman_service_workload_bad_persistent: >-
      {{ ((podman_service_workload_spec.workloads | default({}) | dict2items
           | selectattr('value.persistent', 'defined')
           | rejectattr('value.persistent', 'boolean')
           | map(attribute='key') | list)
          + (podman_service_workload_spec.workloads | default({}) | dict2items
             | selectattr('value.kind', 'defined')
             | selectattr('value.kind', 'equalto', 'worker')
             | selectattr('value.persistent', 'defined')
             | map(attribute='key') | list)) | unique | list }}
    podman_service_workload_missing_runtime_max: >-
      {{ podman_service_workload_spec.workloads | default({}) | dict2items
         | selectattr('value.kind', 'defined')
         | selectattr('value.kind', 'equalto', 'job')
         | map(attribute='key')
         | map('regex_replace', '^(.*)$', podman_service_workload_service_name ~ '-\1')
         | difference(podman_service_limits[podman_service_workload_service_name].containers | default({}) | dict2items
                      | selectattr('value.runtime_max', 'defined') | map(attribute='key') | list) }}
    podman_service_workload_missing_start_timeout: >-
      {{ podman_service_workload_spec.workloads | default({}) | dict2items
         | selectattr('value.kind', 'defined')
         | selectattr('value.kind', 'equalto', 'worker')
         | map(attribute='key')
         | map('regex_replace', '^(.*)$', podman_service_workload_service_name ~ '-\1')
         | difference(podman_service_limits[podman_service_workload_service_name].containers | default({}) | dict2items
                      | selectattr('value.start_timeout', 'defined') | map(attribute='key') | list) }}

- name: Deploy each service
  ansible.builtin.include_tasks: service.yml
  loop: "{{ podman_service_services | dict2items }}"
  loop_control:
    loop_var: podman_service_item
    label: "{{ podman_service_item.key }}"
