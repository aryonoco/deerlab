# Fast-forwards the release branch to the commit CI passed on.
# The hosts pull release, verify the head commit's signature, and apply.

name: Promote

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  promote:
    name: Fast-forward release
    # The branches filter above matches workflow_run.head_branch, which for a
    # pull_request run is the *source* branch, so a fork PR opened from a branch
    # named main satisfies it. That was harmless while this job checked out the
    # base repository's main; it is not harmless now that it checks out the
    # commit CI ran on. Narrow the trigger to pushes.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The commit CI tested, not whatever main points at by the time this job
      # starts. A second commit landing in that window was promoted untested,
      # and this job is the only thing that writes release.
      - name: Checkout the commit CI passed on
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # No --force, so release can only fast-forward: a release branch already
      # ahead of this commit fails the push instead of rewinding both hosts.
      #
      # Deliberately no `git verify-commit` here. The check the hosts run needs
      # the allowed-signers list, which is encrypted in the inventory, and this
      # runner has no key for it. The ways to give it one are to hand GitHub an
      # age key that decrypts every secret in a public repository, or to copy
      # the signer identity into this file in clear; both cost more than they
      # buy, because `just merge` runs the same check before main moves and
      # ansible-pull runs it again on each host as the authority. An
      # unverifiable head therefore halts delivery and pages, rather than being
      # applied.
      - name: Push it to release
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git push origin "$HEAD_SHA:refs/heads/release"
