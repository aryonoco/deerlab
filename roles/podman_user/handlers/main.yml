# Podman documents that migrate stops the user's running containers, so this
# migrates only the users tasks/subid.yml found to have moved, and every user
# if that check never ran.
- name: Migrate podman storage
  ansible.builtin.command:
    cmd: podman system migrate
  become: true
  become_user: "{{ item.key }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ item.value.uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ item.value.uid }}/bus"
  changed_when: true
  failed_when: false
  loop: >-
    {{ podman_user_services | dict2items
       | selectattr('key', 'in', podman_user_moved | default(podman_user_services | list)) }}
  loop_control:
    label: "{{ item.key }}"
