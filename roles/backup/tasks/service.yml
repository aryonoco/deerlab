# No fact here holds a credential in a form Ansible will ever put on a command
# line. The three secrets below are only ever written into root-owned files by
# the copy tasks, which pass module arguments over the connection rather than
# as arguments to a process. backup_user_env carries the two user-manager
# variables, which are paths and identify nothing.
- name: Set the facts for {{ backup_item.key }}
  ansible.builtin.set_fact:
    backup_name: "{{ backup_item.key }}"
    backup_uid: "{{ backup_item.value.uid }}"
    backup_spec: "{{ backup_item.value.backup }}"
    backup_home: "/var/lib/{{ backup_item.key }}"
    backup_volume_root: "/var/lib/{{ backup_item.key }}/.local/share/containers/storage/volumes"
    backup_restic_password: "{{ lookup('ansible.builtin.vars', 'backup_' ~ backup_item.key ~ '_restic_password') }}"
    backup_s3_access_key: "{{ lookup('ansible.builtin.vars', 'backup_' ~ backup_item.key ~ '_s3_access_key') }}"
    backup_s3_secret_key: "{{ lookup('ansible.builtin.vars', 'backup_' ~ backup_item.key ~ '_s3_secret_key') }}"
    backup_user_env:
      XDG_RUNTIME_DIR: "/run/user/{{ backup_item.value.uid }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ backup_item.value.uid }}/bus"
  no_log: true

- name: Refuse placeholder credentials for {{ backup_name }}
  ansible.builtin.assert:
    that:
      - backup_restic_password | length > 0
      - backup_restic_password != 'CHANGE-ME'
      - backup_s3_access_key | length > 0
      - backup_s3_access_key != 'CHANGE-ME'
      - backup_s3_secret_key | length > 0
      - backup_s3_secret_key != 'CHANGE-ME'
      - backup_deadman_urls[backup_name] is defined
      - backup_deadman_urls[backup_name] | length > 0
      - backup_deadman_urls[backup_name] != 'CHANGE-ME'
    fail_msg: "backup credentials or dead-man URL for {{ backup_name }} are not set"
    quiet: true

- name: Write the restic environment of {{ backup_name }}
  ansible.builtin.copy:
    content: |
      RESTIC_REPOSITORY={{ backup_s3_bucket }}/{{ backup_name }}
      RESTIC_CACHE_DIR={{ backup_home }}/.cache/restic
      AWS_ACCESS_KEY_ID={{ backup_s3_access_key }}
      AWS_SECRET_ACCESS_KEY={{ backup_s3_secret_key }}
    dest: "{{ backup_dir }}/{{ backup_name }}.env"
    owner: root
    group: "{{ backup_name }}"
    mode: "0640"
  no_log: true

# Encrypted systemd credentials do not work in user units on this systemd, so
# the repository password is a root-written file the user manager loads with
# LoadCredential and the service user can read only through its own group.
- name: Write the repository password of {{ backup_name }}
  ansible.builtin.copy:
    content: "{{ backup_restic_password }}\n"
    dest: "{{ backup_dir }}/{{ backup_name }}.password"
    owner: root
    group: "{{ backup_name }}"
    mode: "0640"
  no_log: true

- name: Write the dead-man configuration of {{ backup_name }}
  ansible.builtin.copy:
    content: |
      # {{ deerlab_managed }}
      url = "{{ backup_deadman_urls[backup_name] }}"
    dest: "{{ backup_dir }}/{{ backup_name }}-deadman.conf"
    owner: root
    group: "{{ backup_name }}"
    mode: "0640"
  no_log: true

# Created with the service user's own ownership and 0700 so that the SQLite
# copy, which is the one consistent artefact in the whole snapshot, is not
# readable by anything else on the host. The intermediate backup directory
# inherits the same attributes.
- name: Create the staging directory of {{ backup_name }}
  ansible.builtin.file:
    path: "{{ backup_home }}/backup/staging"
    state: directory
    owner: "{{ backup_name }}"
    group: "{{ backup_name }}"
    mode: "0700"

# Deliberately not no_log. The repository location reaches the environment file
# above, which is; nothing secret reaches the unit, and the unit is the file
# whose diff is worth reading when a backup starts behaving differently.
- name: Install the backup unit of {{ backup_name }}
  ansible.builtin.template:
    src: backup.service.j2
    dest: "{{ backup_unit_dir }}/deerlab-backup-{{ backup_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: backup_unit

- name: Install the backup timer of {{ backup_name }}
  ansible.builtin.template:
    src: backup.timer.j2
    dest: "{{ backup_unit_dir }}/deerlab-backup-{{ backup_name }}.timer"
    owner: root
    group: root
    mode: "0644"
  register: backup_timer

# A plain `when: x.changed` is what a handler is for, and ansible-lint says so.
# There is no handler here because the reload has to happen inside this loop,
# before this service's timer is enabled, not once at the end of the play.
- name: Decide on a reload for {{ backup_name }}
  ansible.builtin.set_fact:
    backup_reload: "{{ backup_unit.changed or backup_timer.changed }}"

- name: Reload the user manager of {{ backup_name }}
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ backup_name }}"
  environment: "{{ backup_user_env }}"
  when: backup_reload | bool

# A system-scope `validate:` cannot check these: they are user units, and the
# user manager is the only thing that resolves %h and the user-scope notifier
# they hand failures to.
- name: Verify the generated units of {{ backup_name }}
  ansible.builtin.command:
    cmd: "systemd-analyze --user --generators=true verify deerlab-backup-{{ backup_name }}.service deerlab-backup-{{ backup_name }}.timer"
  become: true
  become_user: "{{ backup_name }}"
  environment: "{{ backup_user_env }}"
  changed_when: false

# Bootstrap runs once and leaves a marker, rather than probing the object store
# on every unattended pull for the rest of the host's life. The marker also
# stops a deleted repository being silently recreated: without it the next pull
# would initialise a fresh empty one, the backup would succeed and the dead-man
# would go green over no history at all. With it the backup fails loudly, which
# is the alarm you want. Delete the marker to deliberately re-bootstrap.
- name: Check for a bootstrap marker for {{ backup_name }}
  ansible.builtin.stat:
    path: "{{ backup_dir }}/{{ backup_name }}.initialised"
  register: backup_repo_marker

- name: Ensure there is a repository for {{ backup_name }}
  when: not backup_repo_marker.stat.exists
  block:
    # These two go through systemd-run rather than Ansible's environment
    # keyword. That keyword is delivered as a textual KEY=value prefix on the
    # command string, so every value lands in the argv of the sh, the sudo and
    # the interpreter that carry the task. /proc/<pid>/cmdline is mode 0444, so
    # any local account on the host can read it, including one service user
    # reading another's; only /proc/<pid>/environ is protected, at 0400. Here
    # systemd parses the very same EnvironmentFile the backup unit uses, and
    # Ansible passes nothing but paths. no_log stays, but now only to keep the
    # repository location out of Ansible's own output.
    - name: Check for the repository of {{ backup_name }}
      ansible.builtin.command:
        cmd: >-
          systemd-run --machine={{ backup_name }}@ --user --quiet --pipe --wait --collect
          --property=EnvironmentFile={{ backup_dir }}/{{ backup_name }}.env
          --setenv=RESTIC_PASSWORD_FILE={{ backup_dir }}/{{ backup_name }}.password
          /usr/bin/restic cat config
      become: true
      register: backup_repo_check
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Initialise the repository of {{ backup_name }}
      ansible.builtin.command:
        cmd: >-
          systemd-run --machine={{ backup_name }}@ --user --quiet --pipe --wait --collect
          --property=EnvironmentFile={{ backup_dir }}/{{ backup_name }}.env
          --setenv=RESTIC_PASSWORD_FILE={{ backup_dir }}/{{ backup_name }}.password
          /usr/bin/restic init
      become: true
      when: backup_repo_check.rc | default(1) != 0
      changed_when: true
      no_log: true

    - name: Record the initialised repository of {{ backup_name }}
      ansible.builtin.copy:
        content: |
          # {{ deerlab_managed }}
          # Remove this file to make the next run probe the object store again
          # and initialise the repository if it has gone.
        dest: "{{ backup_dir }}/{{ backup_name }}.initialised"
        owner: root
        group: root
        mode: "0644"

- name: Enable the backup timer of {{ backup_name }}
  ansible.builtin.systemd_service:
    name: "deerlab-backup-{{ backup_name }}.timer"
    enabled: true
    state: started
    scope: user
  become: true
  become_user: "{{ backup_name }}"
  environment: "{{ backup_user_env }}"
