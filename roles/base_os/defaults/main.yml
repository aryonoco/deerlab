base_os_timezone: "{{ deerlab_timezone | default('Etc/UTC') }}"
base_os_admin_user: "{{ deerlab_admin_user }}"
base_os_admin_ssh_keys: "{{ deerlab_admin_ssh_keys }}"
base_os_root_password_hash: "{{ deerlab_root_password_hash }}"

base_os_packages:
  - acl
  - auditd
  - ca-certificates
  - chrony
  - curl
  - git
  - needrestart
  - nftables
  - python3-venv
  - restic
  - sqlite3
  - systemd-zram-generator
  - unattended-upgrades
  - wireguard-tools

base_os_packages_absent:
  - fail2ban
  - systemd-timesyncd

# Neither host has disk swap, so before this a cgroup that reached its ceiling
# was OOM-killed with no grace, and host-wide pressure was resolved by the
# kernel killing something. zram compresses pages into RAM instead: microseconds
# and some CPU rather than milliseconds of network-backed disk. It does not add
# capacity, it buys time and turns a kill into a slowdown.
base_os_zram_enabled: true
base_os_zram_size: ram / 2
base_os_zram_algorithm: zstd

# init_on_alloc, randomize_kstack_offset and vsyscall=none are deliberately
# absent: Debian already compiles them on by default, verified in
# /boot/config-$(uname -r), so passing them would be noise. These three are not
# on by default. init_on_free costs a few percent and buys mitigation of
# use-after-free information leaks; debugfs=off removes a large kernel
# introspection surface and costs only bpftrace and bcc, which are not used here.
base_os_kernel_cmdline: "lockdown=integrity systemd.ssh_auto=no slab_nomerge page_alloc.shuffle=1 init_on_free=1 debugfs=off"

# Rare network protocols, legacy filesystems and buses that do not exist on a
# virtual machine. Each has carried privilege escalation bugs and none is
# reachable by anything deployed here. Both directives are needed: `blacklist`
# stops alias-based autoload, `install ... /bin/false` stops an explicit modprobe.
base_os_blocked_modules:
  - dccp
  - sctp
  - rds
  - tipc
  - n-hdlc
  - ax25
  - netrom
  - x25
  - rose
  - decnet
  - econet
  - af_802154
  - ipx
  - appletalk
  - psnap
  - p8023
  - p8022
  - can
  - atm
  - cramfs
  - freevxfs
  - jffs2
  - hfs
  - hfsplus
  - udf
  - usb-storage
  - firewire-core
  - firewire-ohci
  - bluetooth
  - thunderbolt

base_os_sysctl:
  # Rootless Podman needs this. Assert it explicitly so nothing can flip it.
  # Confirmed present on both hosts: Debian 13 still carries this knob, and it
  # already reads 1.
  kernel.unprivileged_userns_clone: 1
  # Kernel
  kernel.randomize_va_space: 2
  kernel.dmesg_restrict: 1
  kernel.kptr_restrict: 2
  kernel.sysrq: 0
  kernel.yama.ptrace_scope: 2
  kernel.kexec_load_disabled: 1
  kernel.unprivileged_bpf_disabled: 2
  kernel.perf_event_paranoid: 3
  # io_uring has been the most productive local privilege escalation surface in
  # recent kernels, and it is a class neither the user namespace nor the seccomp
  # profile addresses. Nothing here needs it: podman, conmon, crun and pasta all
  # use epoll. 2 disables it outright rather than restricting it to a group.
  kernel.io_uring_disabled: 2
  net.core.bpf_jit_harden: 2
  # Filesystem
  fs.protected_hardlinks: 1
  fs.protected_symlinks: 1
  fs.protected_fifos: 2
  fs.protected_regular: 2
  fs.suid_dumpable: 0
  # Memory
  vm.mmap_min_addr: 65536
  # 10 was right while there was no swap at all: it told the kernel not to try.
  # With zram the calculation inverts, because swapping is now a compression
  # into RAM rather than a write to disk. 60 is the kernel's own default and
  # lets zram engage under real pressure without the kernel reaching for it
  # eagerly.
  vm.swappiness: 60
  # Network
  net.ipv4.ip_forward: 0
  net.ipv6.conf.all.forwarding: 0
  net.ipv4.tcp_syncookies: 1
  net.ipv4.tcp_rfc1337: 1
  net.ipv4.conf.all.rp_filter: 2
  net.ipv4.conf.default.rp_filter: 2
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.default.accept_source_route: 0

base_os_sysctl_extra: {}

base_os_journald_max_use: 512M
base_os_journald_retention: 90day

base_os_chrony_nts_servers:
  - time.cloudflare.com
  - nts.netnod.se

base_os_auditd_enabled: true
base_os_hidepid_enabled: false
