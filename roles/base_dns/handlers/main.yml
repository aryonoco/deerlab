# A reload re-reads the drop-ins and rebuilds every link's servers, without
# losing what tailscaled set on its own link over D-Bus. Rolling the drop-in
# back needs a restart instead: a reload does not restore every default.
- name: Reload systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: reloaded

# A reload re-reads the network files and their drop-ins and applies a
# changed one with the DHCP lease and the address kept. `networkctl
# reconfigure` re-reads nothing and drops the address first (both measured
# on systemd 257).
- name: Reload systemd-networkd
  ansible.builtin.systemd_service:
    name: systemd-networkd
    state: reloaded
