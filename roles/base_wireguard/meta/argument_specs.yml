argument_specs:
  main:
    short_description: Remove the retired WireGuard tunnel from a host
    description: >
      The hosts reach each other over the tailnet now. This role removes what
      the WireGuard role left on a host: the wg0 interface, its key and
      network files, the boot wait for it, the peers' names in /etc/hosts and
      wireguard-tools. It never stops or disables systemd-networkd, which
      also manages the uplink. It takes no inputs.
    options: {}
