# The CI lab's deploy: what a host's pull applies, less the roles a container
# cannot run (base_os beyond its kernel parameters, base_ssh and
# base_wireguard). The lab's first step runs this file from the base commit
# with this commit's ci/ laid over it, so it imports nothing a base commit
# may lack: no verify play, no kernel play. See docs/runbook.md, The CI lab.
- name: Install collections into the checkout
  ansible.builtin.import_playbook: ../playbooks/deps.yml

- name: Configure the lab's base
  hosts: podman_hosts
  roles:
    - role: base_firewall
    - role: base_notify
    - role: base_pull

- name: Configure the edge host
  ansible.builtin.import_playbook: ../playbooks/edge.yml

- name: Configure the services host
  ansible.builtin.import_playbook: ../playbooks/services.yml
