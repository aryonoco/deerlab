argument_specs:
  main:
    short_description: Check every podman_services record before it is used
    description: >
      Asserts that each service record has a fully qualified digest-pinned
      image, publish, health.cmd, an entry with a pids limit in
      deerlab_service_limits, no CHANGE-ME secrets, a well-formed
      stop_signal and success_exit_status, and that its workloads follow the rules on kind,
      parent-only keys, schedule, health, persistent, runtime_max,
      start_timeout and stop_signal. It also validates each service's
      working-use checks and config_files upstream entries against the
      schema podman_service_verify documents, and keeps the checks a pull
      runs on one host within a time budget. It reads nothing on the host and needs
      no privileges, so it runs in full under check mode. The playbooks run
      it first, and podman_service lists it as a dependency, so a play that
      names podman_service alone still runs it; Ansible runs it once per
      play. The record keys are documented in podman_service's argument
      spec, the role that consumes them.
    options:
      podman_service_check_services:
        type: dict
        required: true
        description: >
          The podman_services dictionary; see podman_service's
          podman_service_services for the keys a record supports.
      podman_service_check_limits:
        type: dict
        required: true
        description: >
          The deerlab_service_limits dictionary; see podman_service's
          podman_service_limits for its shape.
      podman_service_check_check_defaults:
        type: dict
        default:
          timeout: 5
          retries: 0
          delay: 5
        description: >
          The timeout, retries and delay, in seconds and attempts, a check
          gets when it leaves one out. podman_service_verify reads the same
          values.
      podman_service_check_check_keys:
        type: dict
        default:
          common: [name, type, where, timeout, retries, delay]
          http: [via, host, method, path, query, headers, body, body_format, status, body_regex, body_version]
          exec: [container, cmd, stdin, stdout_regex]
          unit: [workload, start]
          log: [send]
          send: [via, host, method, path, query, headers, status]
        description: >
          The keys each check type accepts beyond the common ones, and the
          keys of a log check's send request. Any other key is refused.
      podman_service_check_verify_budget:
        type: int
        default: 300
        description: >
          Seconds. The most that the checks a pull runs on one host (where
          both or host) may take together, every check failing at every
          retry: (retries + 1) * timeout + retries * delay, summed.
