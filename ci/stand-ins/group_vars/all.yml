# Stand-ins for inventory/group_vars/all/secrets.sops.yaml,
# encrypted per run to the lab's throwaway age key. Every key that file
# holds, and no real value.
deerlab_domain: example.test
deerlab_acme_email: lab@example.test
deerlab_root_password_hash: lab-stand-in
deerlab_deadman_urls:
  pull:
    edge1: https://deadman.example.test/pull-edge1
    svc1: https://deadman.example.test/pull-svc1
  backup:
    caddy: https://deadman.example.test/backup-caddy
    wallabag: https://deadman.example.test/backup-wallabag
    linkding: https://deadman.example.test/backup-linkding
    baikal: https://deadman.example.test/backup-baikal
    freshrss: https://deadman.example.test/backup-freshrss
    vikunja: https://deadman.example.test/backup-vikunja
    actual: https://deadman.example.test/backup-actual
backup_s3_bucket: s3:https://s3.example.test/lab
deerlab_pushover_token: lab-stand-in
deerlab_pushover_user: lab-stand-in
deerlab_admin_user: labadmin
deerlab_admin_ssh_keys:
  - ssh-ed25519 AAAAlabstandin lab@example.test
vikunja_hostname: tasks.example.test
actual_hostname: budget.example.test
# The fixture front, which hands DNS-over-HTTPS to ci/fixture/dnsdist.yml;
# base_dns, the other reader, does not run in the lab.
deerlab_dns_tls_addresses:
  - 203.0.113.10
deerlab_dns_tls_name: lab.dns.example.test
deerlab_tailnet_domain: tailnet.example.test
