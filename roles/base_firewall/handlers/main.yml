- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

# Listens to the reload, so it runs after it. The ruleset begins with flush
# ruleset, which deletes the rules tailscaled installed, and tailscaled puts
# them back only when it restarts (tailscale/tailscale#11926). The restart
# drops tailnet connections for a few seconds.
- name: Restart tailscaled after a ruleset reload
  ansible.builtin.systemd_service:
    name: tailscaled
    state: restarted
  listen: Reload nftables
  when: base_firewall_restart_tailscaled
