base_firewall_role: services

# A faithful copy of Docker/FreshRSS.Apache.conf at the pinned tag, with
# Listen 80 changed to Listen 8080 and nothing else. Re-diff it against the
# image on every Renovate bump; a drifted copy is a silent behaviour change.
#
# The file is vendored because a non-root container uid cannot bind port 80 -
# measured on svc1, a rootless container netns reports
# ip_unprivileged_port_start=1024 - and the image's LISTEN variable is applied
# with sed -i against this very file, which fails on a read-only rootfs with no
# set -e to notice.
#
# Kept faithful rather than minimised. The OIDC block can never fire because
# OIDC_ENABLED is never defined, the piped CustomLog duplicates what the edge
# already records, and RemoteIPInternalProxy trusts three whole private ranges
# where one host would do. All three are accepted so that diffing this against
# a new release stays trivial.
freshrss_apache_conf: |
  ServerName freshrss.localhost
  Listen 8080
  DocumentRoot /var/www/FreshRSS/p/
  AllowEncodedSlashes On
  ServerTokens OS
  TraceEnable Off
  ErrorLog /dev/stderr

  # For logging the original user-agent IP instead of proxy IPs:
  <IfModule mod_remoteip.c>
  	# Can be disabled by setting the TRUSTED_PROXY environment variable to 0:
  	RemoteIPHeader X-Forwarded-For
  	# Can be overridden by the TRUSTED_PROXY environment variable:
  	RemoteIPInternalProxy 10.0.0.1/8 172.16.0.1/12 192.168.0.1/16
  </IfModule>

  # Default, will be overridden by p/.htaccess and p/api/.htaccess
  SetEnvIfExpr "reqenv('LOG_REMOTE_USER') == ''" LOG_REMOTE_USER=-
  SetEnvIfExpr "reqenv('LOG_REMOTE_USER') == '-' && reqenv('REMOTE_USER') =~ /(.+)/" LOG_REMOTE_USER=$1

  LogFormat "%a %l %{LOG_REMOTE_USER}e %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined_proxy
  CustomLog "|/var/www/FreshRSS/cli/sensitive-log.sh" combined_proxy

  <IfDefine OIDC_ENABLED>
  	<IfModule !auth_openidc_module>
  		Error "The auth_openidc_module is not available. Install it or unset environment variable OIDC_ENABLED."
  	</IfModule>

  	# Workaround to be able to check whether an environment variable is set
  	# See: https://serverfault.com/questions/1022233/using-ifdefine-with-environment-variables/1022234#1022234
  	Define VStart "${"
  	Define VEnd "}"

  	OIDCProviderMetadataURL ${OIDC_PROVIDER_METADATA_URL}
  	OIDCClientID ${OIDC_CLIENT_ID}
  	OIDCClientSecret ${OIDC_CLIENT_SECRET}

  	OIDCSessionInactivityTimeout ${OIDC_SESSION_INACTIVITY_TIMEOUT}
  	OIDCSessionMaxDuration ${OIDC_SESSION_MAX_DURATION}
  	OIDCSessionType ${OIDC_SESSION_TYPE}

  	OIDCRedirectURI /i/oidc/
  	OIDCDefaultURL ${OIDC_DEFAULT_URL}
  	OIDCCryptoPassphrase ${OIDC_CLIENT_CRYPTO_KEY}

  	Define "Test_${OIDC_REMOTE_USER_CLAIM}"
  	<IfDefine Test_${VStart}OIDC_REMOTE_USER_CLAIM${VEnd}>
  		OIDCRemoteUserClaim preferred_username
  	</IfDefine>
  	<IfDefine !Test_${VStart}OIDC_REMOTE_USER_CLAIM${VEnd}>
  		OIDCRemoteUserClaim "${OIDC_REMOTE_USER_CLAIM}"
  	</IfDefine>
  	Define "Test_${OIDC_SCOPES}"
  	<IfDefine Test_${VStart}OIDC_SCOPES${VEnd}>
  		OIDCScope openid
  	</IfDefine>
  	<IfDefine !Test_${VStart}OIDC_SCOPES${VEnd}>
  		OIDCScope "${OIDC_SCOPES}"
  	</IfDefine>
  	Define "Test_${OIDC_X_FORWARDED_HEADERS}"
  	<IfDefine !Test_${VStart}OIDC_X_FORWARDED_HEADERS${VEnd}>
  		OIDCXForwardedHeaders ${OIDC_X_FORWARDED_HEADERS}
  	</IfDefine>

  	# Additional parameters can be set e.g. in /var/www/FreshRSS/p/i/.htaccess
  </IfDefine>

  <Directory />
  	AllowOverride None
  	Options FollowSymLinks
  	Require all denied
  </Directory>

  <Directory /var/www/FreshRSS/p>
  	AllowOverride None
  	Include /var/www/FreshRSS/p/.htaccess
  	Options FollowSymLinks
  	Require all granted
  </Directory>

  <Directory /var/www/FreshRSS/p/api>
  	Include /var/www/FreshRSS/p/api/.htaccess
  </Directory>

  <Directory /var/www/FreshRSS/p/i>
  	ExpiresActive Off

  	<IfDefine OIDC_ENABLED>
  		AuthType openid-connect
  		Require valid-user
  	</IfDefine>
  	IncludeOptional /var/www/FreshRSS/p/i/.htaccess
  </Directory>

  <Directory /var/www/FreshRSS/p/themes>
  	Include /var/www/FreshRSS/p/themes/.htaccess
  </Directory>

podman_services:
  wallabag:
    uid: 2001
    # The image runs as root inside and rewrites its application tree on
    # every start, so it cannot be read-only.
    image: docker.io/wallabag/wallabag:2.6.14@sha256:4a527e027e0d59e87c14225ef11e005af3d4890374202ad319ce5e63dfc66709
    publish:
      - "8080:80"
    volumes:
      - { name: data, mount: /var/www/wallabag/data }
      - { name: images, mount: /var/www/wallabag/web/assets/images }
    tmpfs:
      - "/tmp:rw,nosuid,nodev,noexec,size=64m"
      - "/run:rw,nosuid,nodev,size=16m"
    env:
      SYMFONY__ENV__DOMAIN_NAME: "https://wallabag.{{ deerlab_domain }}"
      SYMFONY__ENV__SERVER_NAME: wallabag
      SYMFONY__ENV__FOSUSER_REGISTRATION: "false"
      SYMFONY__ENV__DATABASE_DRIVER: pdo_sqlite
      POPULATE_DATABASE: "True"
      PHP_MEMORY_LIMIT: 256M
      TZ: Etc/UTC
    secrets:
      - { name: symfony-secret, value: "{{ wallabag_symfony_secret }}", type: env, target: SYMFONY__ENV__SECRET }
    # Trimmed empirically, one capability at a time, then reproved against a
    # volume destroyed and recreated from empty. Each of the five below made
    # the unit fail to start when removed:
    # CAP_CHOWN: nginx failed to chown its own tmp directory inside the
    #   container's writable layer (not a mounted volume, so this is rebuilt
    #   on every start regardless of volume state) with "Operation not
    #   permitted".
    # CAP_SETUID / CAP_SETGID: the entrypoint's `su` to the application user
    #   failed with "Operation not permitted" before the application started.
    # CAP_NET_BIND_SERVICE: nginx could not bind() the low port it publishes;
    #   failed with "Permission denied".
    # CAP_DAC_OVERRIDE: the entrypoint could not write its config file;
    #   failed with "Permission denied".
    # CAP_FOWNER was removed: the health check, the login page and a fresh
    # deployment against an empty volume all passed without it.
    capabilities:
      - CAP_CHOWN
      - CAP_SETUID
      - CAP_SETGID
      - CAP_NET_BIND_SERVICE
      - CAP_DAC_OVERRIDE
    read_only: false
    no_new_privileges: true
    health:
      cmd: curl --fail --silent --output /dev/null http://localhost/login
      interval: 30s
      start_period: 180s
    egress: web
    backup:
      sqlite: [{ volume: data, path: db/wallabag.sqlite }]
      volumes: [data, images]

  linkding:
    uid: 2002
    image: ghcr.io/sissbruecker/linkding:1.46.2-plus@sha256:041dfbe0a9bb655d8a4bcdf983cd4d1b10f3f9a5cbe60432169df1612efecbd5
    # The image drops privilege internally: uwsgi.ini carries uid = www-data,
    # which is 33 in the Debian image, and bootstrap.sh chowns the data
    # directory to it. Starting as 33 makes that chown a permitted same-owner
    # no-op and skips the privilege drop entirely, so nothing here needs CHOWN,
    # DAC_OVERRIDE, SETUID or SETGID. Starting as root would need all four and
    # a writable root filesystem besides.
    user: 33
    group: 33
    publish:
      - "8081:9090"
    volumes:
      # chown renders :U. The image ships data/tasks.sqlite3 owned root:root, so
      # Podman's copy-up into a fresh volume lands root-owned and a uid-33
      # container then fails with "mkdir: cannot create directory
      # 'data/favicons': Permission denied". :U also self-heals after a volume
      # is deleted and recreated, which is what a restore does.
      - { name: data, mount: /etc/linkding/data, chown: true }
    tmpfs:
      # uwsgi.ini writes /tmp/linkding.pid and there is no writable path
      # anywhere else with a read-only root, so the container exits 1 without
      # this: "No usable temporary directory found".
      #
      # mode, never uid/gid. Podman 5.4.2 rejects those two outright - the
      # container exits 125 with `unknown mount option "uid=33": invalid mount
      # option` before the image is even started. A tmpfs is created root-owned
      # and Podman offers no way to chown it, so mode is the only lever. 1777
      # is also Podman's own default here, confirmed on the host; setting it
      # explicitly says the container's uid must be able to write rather than
      # resting on a default.
      - "/tmp:rw,nosuid,nodev,size=256m,mode=1777"
    env:
      # LD_DISABLE_BACKGROUND_TASKS is deliberately ABSENT and must stay absent.
      # It reads as "do not start supervisord", which is what we want here, but
      # it also gates task ENQUEUEING in whichever process evaluates it. Setting
      # it would stop this container queueing any favicon, preview, metadata or
      # snapshot work, and the worker would consume an empty queue forever.
      # LD_SUPERVISOR_MANAGED must stay absent too: on that path bootstrap.sh
      # execs supervisord, so its failure kills the container instead of being
      # ignored.
      #
      # Consequence: this container logs "Error: Can't drop privilege as nonroot
      # user" once per start, because bootstrap.sh tries to launch supervisord
      # and supervisord refuses to run as non-root. It has no set -e and does
      # not check the exit status, so it proceeds to exec uwsgi and everything
      # works. The worker unit is what actually drains the queue.
      #
      # linkding sets no SECURE_PROXY_SSL_HEADER anywhere, so request.is_secure()
      # is always false behind Caddy. This, not proto forwarding, is what stops
      # a POST failing with "CSRF verification failed". The scheme is required.
      LD_CSRF_TRUSTED_ORIGINS: "https://linkding.{{ deerlab_domain }}"
      # The default provider is a Google gstatic endpoint, which would tell
      # Google the domain of every bookmark from this host's address as it is
      # saved.
      LD_FAVICON_PROVIDER: "https://icons.duckduckgo.com/ip3/{domain}.ico"
      LD_ENABLE_SNAPSHOTS: "True"
      LD_SUPERUSER_NAME: "{{ linkding_superuser_name }}"
      TZ: Etc/UTC
    secrets:
      # Create-only: once the user exists linkding logs "Skip creating initial
      # superuser" and will NOT reset the password. Changing this value and
      # promoting appears to succeed and changes nothing; a real password change
      # goes through the UI or manage.py changepassword.
      - { name: superuser-password, value: "{{ linkding_superuser_password }}", type: env, target: LD_SUPERUSER_PASSWORD }
    capabilities: []
    read_only: true
    no_new_privileges: true
    health:
      # /health calls connections["default"].ensure_connection(), so it proves
      # the database is reachable rather than just that a socket is open.
      # /login is a 301 to /login/ and proves nothing.
      cmd: curl --fail --silent --output /dev/null http://localhost:9090/health
      interval: 30s
      start_period: 120s
    egress: web
    backup:
      sqlite: [{ volume: data, path: db.sqlite3 }]
      volumes: [data]
    workloads:
      worker:
        kind: worker
        # Huey's consumer, run directly rather than under supervisord.
        # supervisord cannot run here at all: both its configs declare
        # [supervisord] user=root and it refuses to start when it cannot drop
        # privilege. This is the command its own config would have run.
        exec: python manage.py run_huey -f
        env:
          # manage.py defaults to bookmarks.settings, whose __init__ tries dev
          # and falls back to prod. uwsgi.ini sets this explicitly rather than
          # relying on that fallback, so this does too.
          DJANGO_SETTINGS_MODULE: bookmarks.settings.prod
          # supervisord set HOME=/tmp/home for Chromium and nothing ever created
          # the directory. We do not run supervisord, so set it somewhere that
          # exists.
          HOME: /tmp
        tmpfs:
          - "/tmp:rw,nosuid,nodev,size=1g,mode=1777"
          # single-file-cli passes --user-data-dir=./chromium-profile, relative
          # to WORKDIR /etc/linkding, which is read-only. The directory exists
          # in the image owned by www-data; this makes it writable without
          # touching the image.
          - "/etc/linkding/chromium-profile:rw,nosuid,nodev,size=256m,mode=1777"

  baikal:
    uid: 2003
    image: ghcr.io/aryonoco/baikal:0.12.1@sha256:123c2b94d5855c758f2b0840a910491f23210c90622351cae03f5fb527a33b65
    # Pinned rather than inherited from the image's own USER, so an image that
    # changed it fails to start instead of silently re-chowning the volume.
    user: 65532
    group: 65532
    # 8081 is the image's health listener and is deliberately NOT published:
    # base_firewall derives the tunnel-scoped inbound rules from this list, so
    # publishing it would open it to the edge.
    publish:
      - "8082:8080"
    volumes:
      - { name: data, mount: /data, chown: true }
    tmpfs:
      - "/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777"
    env:
      # An input to every password hash Baikal ever writes. Changing it after
      # the first run invalidates the admin password and every DAV user's
      # credentials at once, with no error.
      BAIKAL_AUTH_REALM: BaikalDAV
      BAIKAL_DAV_AUTH_TYPE: Basic
      BAIKAL_TIMEZONE: Etc/UTC
      TZ: Etc/UTC
    secrets:
      # Create-only: once the config file exists the image never rewrites it,
      # so changing this and promoting appears to succeed and changes nothing.
      # A real password change goes through the admin UI.
      - { name: admin-password, value: "{{ baikal_admin_password }}", type: env, target: BAIKAL_ADMIN_PASSWORD }
    capabilities: []
    read_only: true
    no_new_privileges: true
    health:
      # A JSON array, not a plain string: Podman runs a plain string through
      # /bin/sh -c and this image has no shell. Simplifying this to a bare
      # command makes the probe fail forever, and Notify=healthy then holds the
      # unit in `activating` rather than failing it.
      #
      # No leading "CMD" element, and that is load-bearing rather than a
      # shorthand. Podman before 5.8.0 - svc1 runs 5.4.2 - discards the parsed
      # array when its first element is the literal "CMD" and re-splits the raw
      # string on whitespace, leaving one token that can never execute. Without
      # the element it prepends CMD to the parsed array and gets exec form on
      # every version. Adding "CMD" back reads like a correction and is a
      # permanently unhealthy container.
      cmd: '["/usr/local/bin/frankenphp","php-cli","/usr/local/bin/baikal-health"]'
      interval: 30s
      start_period: 60s
    egress: platform
    backup:
      sqlite: [{ volume: data, path: Specific/db/db.sqlite }]
      volumes: [data]

  freshrss:
    uid: 2004
    image: docker.io/freshrss/freshrss:1.30.0-alpine@sha256:fcff0b573f2bf3aff375c7de08e26588d752a63094e161b3276ec26736ce17fd
    # The image sets no USER, so Podman would run it as the service user, which
    # maps to namespace uid 0. Pinned to the image's own apache:www-data
    # instead, so cli/access-permissions.sh chowns the volume to the uid that
    # already owns it - a permitted same-owner no-op - rather than failing
    # without CAP_CHOWN and logging an error on every start. Confirm with
    # `id apache` against the image before the first apply.
    user: 100
    group: 82
    publish:
      # Container side 8080, not the image's 80: a non-root container uid
      # cannot bind a low port. Measured on svc1 - a rootless container netns
      # reports ip_unprivileged_port_start=1024, because Podman's
      # default_sysctls does not lower it the way Docker's does.
      - "8083:8080"
    volumes:
      # chown renders :U. A fresh volume's copy-up lands root-owned and a
      # uid-100 container then cannot create data/users. :U also self-heals
      # after a volume is deleted and recreated, which is what Restore B does.
      - { name: data, mount: /var/www/FreshRSS/data, chown: true }
    tmpfs:
      # Apache writes its pid here; the image creates the directory empty.
      - "/run/apache2:rw,nosuid,nodev,size=16m,mode=1777"
      # PHP sessions land in /tmp on Alpine because session.save_path is unset.
      # Without this the container starts, the health check passes, and login
      # is impossible: session_start() hits a read-only filesystem.
      - "/tmp:rw,nosuid,nodev,size=256m,mode=1777"
    config_files:
      # A faithful copy of Docker/FreshRSS.Apache.conf at the pinned tag with
      # Listen 80 changed to 8080, and nothing else. Re-diff it on every image
      # bump. 0644, not Caddy's 0640: Caddy declares no user: and so runs as
      # namespace uid 0, which can read a root-owned group-restricted file.
      # This container runs as uid 100 and cannot - at 0640 Apache fails to
      # read its own configuration and never starts.
      - { path: config/FreshRSS.Apache.conf, content: "{{ freshrss_apache_conf }}", mode: "0644", banner: "#" }
    mounts:
      # The Alpine path. The entrypoint auto-detects it from a list that also
      # covers Debian's sites-available and Arch's conf/conf.d - do not copy a
      # path from documentation written for another variant.
      - { src: /var/lib/freshrss/config/FreshRSS.Apache.conf,
          dst: /etc/apache2/conf.d/FreshRSS.Apache.conf, ro: true }
    env:
      # CRON_MIN is deliberately ABSENT and must stay absent. The image's baked
      # crontab runs `su apache`, and su is setuid-root, which
      # NoNewPrivileges=true neuters, so the internal cron cannot work here
      # under any configuration. On this Alpine variant setting it fails
      # SILENTLY: the container runs, crond starts, `crontab -` fails with
      # "must be suid to work properly", and feeds are never refreshed. The
      # refresh workload below is what actually fetches.
      #
      # TZ is deliberately absent too. The entrypoint applies it by writing
      # /etc/localtime, /etc/timezone and php.ini, all of which fail on a
      # read-only rootfs, with no set -e to notice. The image's own ENV TZ=UTC
      # is the effective setting, which is what this estate wants anyway.
      # Declaring the variable would only imply it does something.
      #
      # Idempotent by upstream design: do-install.php exits 3 once
      # data/applied_migrations.txt exists and the entrypoint treats 3 as "no
      # change performed". A real failure exits non-zero and the entrypoint
      # propagates it, so the container fails loudly. Flags are hyphenated;
      # the underscore spellings are deprecated aliases.
      FRESHRSS_INSTALL: >-
        --default-user {{ freshrss_admin_user }}
        --base-url https://freshrss.{{ deerlab_domain }}
        --db-type sqlite
        --language en
        --title FreshRSS
        --api-enabled
    secrets:
      # The whole argument string is the secret, not just the password, because
      # create-user.php takes the password as an argument and there is no way
      # to split it out. It must NOT go in env: above - the template renders
      # env entries as Environment= lines into a world-readable (mode 0644)
      # Quadlet file, so the password would sit in plaintext on the host.
      #
      # Create-only: create-user.php exits 3 once the user exists, so changing
      # this value and promoting appears to succeed and changes nothing. A real
      # password change goes through the UI or cli/user-info.php.
      #
      # Charset: both the admin username and the password must use only
      # A-Za-z0-9.,_-. The entrypoint expands this string through
      # eval "echo \"$FRESHRSS_USER\"", so inside those double quotes a
      # backtick, a dollar sign, a backslash or a double quote is interpreted,
      # and the resulting unquoted command substitution then word-splits and
      # globs.
      #
      # Even with a compliant charset the password is not kept off the host
      # entirely: the entrypoint passes it to create-user.php as a
      # command-line argument on every container start, so it is briefly
      # visible in that process's /proc/<pid>/cmdline.
      - { name: user-args, value: "--user {{ freshrss_admin_user }} --password {{ freshrss_admin_password }} --language en", type: env, target: FRESHRSS_USER }
    capabilities: []
    read_only: true
    no_new_privileges: true
    health:
      # Invoked through the interpreter rather than the shebang, so neither the
      # exec bit nor $PATH matters. --url is needed because the default is
      # http://localhost/api/ and the listen port moved. The probe asserts the
      # body starts with <!DOCTYPE html>, ends with </html> and contains
      # /scripts/api.js, so it is a content check - but it does NOT read the
      # database. This is liveness only.
      cmd: php /var/www/FreshRSS/cli/health.php --url=http://localhost:8080/api/
      interval: 30s
      start_period: 120s
    # web, not platform: a feed reader fetches arbitrary URLs, so port 80 is
    # required for plain-HTTP feeds and for HTTP-to-HTTPS redirects.
    egress: web
    backup:
      # A glob, not a fixed path: FreshRSS keeps one database per user, and a
      # second account must not end up covered only by the raw volume copy.
      sqlite:
        - { volume: data, path: "users/*/db.sqlite" }
      volumes: [data]
    workloads:
      refresh:
        kind: job
        # Fifteen minutes, jittered by 60s so the fetch burst does not land on
        # a round minute. runtime_max in limits.yml is 600s, strictly inside
        # the window and enforced by Podman's own --timeout, not a systemd
        # timeout directive.
        schedule: "*:0/15"
        persistent: false
        # Bypasses ./Docker/entrypoint.sh, which ends in exec "$@" and would
        # otherwise re-run cli/prepare.php and
        # cli/access-permissions.sh --only-userdirs every fifteen minutes,
        # concurrently with the daemon serving from the same files.
        entrypoint: php
        exec: ./app/actualize_script.php
        # Overrides the primary's list: no Apache here, but /tmp must stay
        # writable. TMP_PATH holds the actualize mutex, and with a read-only
        # /tmp the script EXITS 0 HAVING DONE NOTHING.
        tmpfs:
          - "/tmp:rw,nosuid,nodev,size=256m,mode=1777"
