# Public data shared by every host. This repository is public, so anything that
# would help a stranger reach, impersonate or map the estate lives in
# secrets.sops.yaml instead — addresses, accounts and keys included. What is
# left here is either already public
# knowledge or meaningless on its own.

deerlab_timezone: Etc/UTC

# Header stamped into every generated file. `ansible_managed` cannot be used:
# the template action plugin injects it, so it is undefined inside
# `copy: content:` and the task fails to resolve its arguments. Defining it
# here means one string works in both, and there is only one place to change it.
deerlab_managed: "Managed by deerlab Ansible. Edit the repository, not this file."

# Who Ansible connects as. Deliberately separate from deerlab_admin_user, which
# names the administrative account the roles create: `just bootstrap` overrides
# ansible_user to root, and if the roles read that they would make root the
# admin and then lock every account out. deerlab_admin_user itself and the keys
# that may log in as it are in secrets.sops.yaml.
ansible_user: "{{ deerlab_admin_user }}"

deerlab_repo_url: https://github.com/aryonoco/deerlab.git

# Pushover's message endpoint. Fixed and public; the token and user key that
# authenticate against it are the secrets. Named globally because both
# base_notify and podman_user render the same curl configuration from it.
deerlab_pushover_url: https://api.pushover.net/1/messages.json

# GitHub's SSH host key is not needed: hosts clone over HTTPS.

# tailscaled's UDP port, Tailscale's default. Plaintext because it is the
# documented default every installation uses; it is open to the internet on
# the edge only, where it makes direct connections between peers likelier.
deerlab_tailscale_port: 41641

# Each host's MagicDNS name. deerlab_tailnet_domain, the tailnet's own
# `.ts.net` name, is in secrets.sops.yaml: it is not a credential, but it names
# the tailnet, and nothing else here needs to.
deerlab_tailnet_fqdn: "{{ inventory_hostname }}.{{ deerlab_tailnet_domain }}"

# How Ansible reaches each host. The edge is the one host reached directly, at
# its public address; every other host is reached through it, so Ansible
# works from any network. deerlab_ssh_route picks where the edge forwards
# to: `tailnet`, the host's MagicDNS name, or `public`, its public address
# (any other value fails),
# which a services host's firewall accepts SSH on from the edge alone.
# `just enrol` takes the public route, because a host being enrolled may not
# be on the tailnet; `just bootstrap` clears these arguments, because a fresh
# host has no firewall yet. ansible_host stays each host's public address
# either way, because ssh checks the host key in known_hosts against it.
deerlab_ssh_route: tailnet
ansible_ssh_common_args: >-
  {{ '' if inventory_hostname in groups['edge']
     else '-o ProxyCommand="ssh -W %s:22 %s@%s"' | format(
       {'tailnet': deerlab_tailnet_fqdn, 'public': ansible_host}[deerlab_ssh_route],
       deerlab_admin_user, hostvars[groups['edge'][0]]['ansible_host']) }}

# The same route as one command, for `just ssh`, so the jump is defined once.
deerlab_ssh_command: "ssh {{ ansible_ssh_common_args }} {{ deerlab_admin_user }}@{{ ansible_host }}"

# The tailnet check (roles/tailnet_check) fails a pull when its host is off
# the tailnet, or when the edge cannot reach svc1 over it. The CI lab, whose
# containers never join, turns it off.
tailnet_check_enabled: true

# Named globally because base_firewall renders the chains from it and
# podman_user asserts its own inputs against it. One definition, two gates.
deerlab_egress_classes: [any, web, platform, mail, public]

# The services' DNS forwarder, the record deerlab_dnsdist_service in
# podman_hosts/main.yml. Every other service on a host gets a listener of its
# own on loopback, whose queries leave for the operator's DNS resolver under
# that service's name. The address follows from the service's uid, as its
# subordinate IDs do, so a new service needs no entry here. Every address
# derives from the one prefix: the listeners, the forwarder's health listener
# at .254, and the range its egress chain accepts. podman_service_check keeps
# every uid within the 253 addresses below the health listener.
deerlab_dns_forwarder: dnsdist
deerlab_dns_listener_port: 5300
deerlab_dns_listener_prefix: 127.0.53
deerlab_dns_listener_net: "{{ deerlab_dns_listener_prefix }}.0/24"
deerlab_dns_health_listener: "{{ deerlab_dns_listener_prefix }}.254"
deerlab_dns_listeners: >-
  {%- set ns = namespace(listeners={}) -%}
  {%- for name in podman_services if name != deerlab_dns_forwarder -%}
  {%- set ns.listeners = ns.listeners | combine({name: deerlab_dns_listener_prefix ~ '.' ~ (podman_services[name].uid | int - 1999)}) -%}
  {%- endfor -%}
  {{ ns.listeners }}

# One DNS query per address, from python3's standard library, for the
# forwarder's checks: python3 -c CODE QNAME PORT MODE ADDR... MODE any passes
# on any A answer, index on 192.0.2.<the address's last octet>, which is how
# the CI lab's fixture answers each service, and =<IPv4> on that address. It
# prints ok and the address for each address, and never an answer.
deerlab_dns_probe_py: |-
  import socket, struct, sys
  qname, port, mode, addrs = sys.argv[1], int(sys.argv[2]), sys.argv[3], sys.argv[4:]
  query = struct.pack('>6H', 0x5a5a, 0x0100, 1, 0, 0, 0)
  query += b''.join(bytes([len(label)]) + label.encode() for label in qname.rstrip('.').split('.'))
  query += b'\0' + struct.pack('>2H', 1, 1)

  def skip(msg, i):
      while msg[i]:
          if msg[i] >= 192:
              return i + 2
          i += msg[i] + 1
      return i + 1

  for addr in addrs:
      sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
      sock.settimeout(2)
      try:
          sock.sendto(query, (addr, port))
          reply = sock.recv(4096)
      except OSError as err:
          sys.exit(f'fail {addr}: {type(err).__name__}')
      if reply[:2] != query[:2] or reply[3] & 15:
          sys.exit(f'fail {addr}: rcode {reply[3] & 15}')
      found, i = None, len(query)
      for _ in range(struct.unpack('>H', reply[6:8])[0]):
          i = skip(reply, i)
          rtype, _, _, length = struct.unpack('>2HIH', reply[i:i + 10])
          i += 10
          if rtype == 1 and length == 4:
              found = socket.inet_ntoa(reply[i:i + 4])
              break
          i += length
      want = {'any': found, 'index': '192.0.2.' + addr.split('.')[-1]}.get(mode, mode[1:])
      if found is None or found != want:
          sys.exit(f'fail {addr}: no matching A answer')
      print(f'ok {addr}')
